<title>중고 정리함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 아이폰은 -apple-system(Apple SD Gothic Neo)으로 충분하므로 웹폰트는 첫 화면을 막지 않게 뒤늦게 붙인다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F2F2F7; --bg-2:#FFFFFF; --card:#FFFFFF;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.06);
  --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.29);
  --label:#000000; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.34);
  --accent:#FF6B2C; --accent-ink:#FFFFFF; --accent-soft:rgba(255,107,44,.12);
  --s-planned:#5856D6; --s-listed:#007AFF; --s-sold:#34C759; --s-held:#8E8E93;
  --red:#FF3B30; --amber:#FF9500; --teal:#30B0C7;
  --bar:rgba(249,249,249,.82);
  --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-2:#1C1C1E; --card:#1C1C1E;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
    --sep:rgba(84,84,88,.5); --sep-strong:rgba(84,84,88,.75);
    --label:#FFFFFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
    --accent:#FF7A3D; --accent-ink:#1A0B03; --accent-soft:rgba(255,122,61,.18);
    --s-planned:#5E5CE6; --s-listed:#0A84FF; --s-sold:#30D158; --s-held:#98989F;
    --red:#FF453A; --amber:#FF9F0A; --teal:#40C8E0;
    --bar:rgba(28,28,30,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#1C1C1E; --card:#1C1C1E;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --sep:rgba(84,84,88,.5); --sep-strong:rgba(84,84,88,.75);
  --label:#FFFFFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
  --accent:#FF7A3D; --accent-ink:#1A0B03; --accent-soft:rgba(255,122,61,.18);
  --s-planned:#5E5CE6; --s-listed:#0A84FF; --s-sold:#30D158; --s-held:#98989F;
  --red:#FF453A; --amber:#FF9F0A; --teal:#40C8E0; --bar:rgba(28,28,30,.8);
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:none}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::placeholder{color:var(--label-3)}
.tnum{font-variant-numeric:tabular-nums}

#root{height:100%;display:flex;flex-direction:column;overflow:hidden}
#screens{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen{padding:0 0 30px}
.wrap{padding:0 16px}
.screens-holder{flex:1;position:relative;display:flex;min-height:0}

.navbar{position:sticky;top:0;z-index:20;background:var(--bar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep)}
.navbar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px}
.navbar h1{margin:0;font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-.6px}
.nav-sub{font-size:13px;color:var(--label-2);margin:2px 0 0}

.tabbar{display:flex;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);flex:0 0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 0 9px;color:var(--label-3);font-size:10px;font-weight:500}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar svg{width:24px;height:24px;display:block}

.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 16px 7px;
  font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--label-2)}
.sec-h .act{text-transform:none;letter-spacing:0;font-weight:400;color:var(--accent);font-size:15px}
.sec-h .plain{text-transform:none;letter-spacing:0;font-weight:400}
.group{background:var(--card);border-radius:var(--radius);margin:0 16px;overflow:hidden}
.row-i{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left}
.row-i + .row-i::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
button.row-i:active{background:var(--fill-2)}
.chev{margin-left:auto;flex:0 0 auto;color:var(--label-3)}
.chev svg{display:block;width:8px;height:13px}
.empty{padding:34px 22px;text-align:center;color:var(--label-2);font-size:15px}
.empty b{display:block;color:var(--label);font-size:17px;font-weight:600;margin-bottom:4px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border-radius:var(--radius);padding:12px;min-width:0}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.2px;color:var(--label-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:3px;line-height:1.15}
.tile .u{font-size:12px;font-weight:500;color:var(--label-2);margin-left:1px}
.tile.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--accent-soft),var(--fill-2))}
.tile.hero .v{font-size:30px;color:var(--accent)}

.thumb{width:54px;height:54px;border-radius:9px;flex:0 0 auto;background:var(--fill-2);
  object-fit:cover;display:grid;place-items:center;color:var(--label-3);font-size:11px;
  border:.5px solid var(--sep);overflow:hidden;line-height:1.25;text-align:center}
img.thumb{display:block}
.it-body{min-width:0;flex:1}
.it-t{font-size:16px;font-weight:600;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.it-s{font-size:13px;color:var(--label-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.it-m{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}

.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:99px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.pill.warn{background:rgba(255,149,0,.16);color:var(--amber)}
.pill.go{background:rgba(52,199,89,.16);color:var(--s-sold)}
.pill.demo{background:var(--accent-soft);color:var(--accent)}
.pill.cut{background:rgba(255,59,48,.14);color:var(--red)}

.seg{display:flex;gap:2px;background:var(--fill);border-radius:9px;padding:2px;margin:0 16px}
.seg button{flex:1;padding:6px 2px 7px;border-radius:7px;font-size:13px;font-weight:600;
  color:var(--label);transition:background .18s;min-width:0}
.seg button[aria-selected="true"]{background:var(--bg-2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .n{font-size:11px;font-weight:500;color:var(--label-2);margin-left:3px}
.seg button[aria-selected="true"] .n{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;
  border-radius:11px;font-size:16px;font-weight:600;letter-spacing:-.2px;background:var(--fill);
  color:var(--label);transition:transform .1s,opacity .15s;width:100%}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.danger{color:var(--red)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:9px;width:auto}
.btn.ghost{background:transparent;border:1px solid var(--sep-strong)}
.btn-row{display:flex;gap:8px;padding:0 16px;margin-top:10px}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.field{display:flex;align-items:center;gap:10px;padding:10px 14px;position:relative}
.field + .field::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.field label{flex:0 0 96px;font-size:15px;color:var(--label-2)}
.field input,.field select{flex:1;min-width:0;background:none;border:0;font-size:16px;text-align:right;padding:2px 0}
.field input:focus,.field select:focus{outline:none}
.field select{text-align-last:right;-webkit-appearance:none;appearance:none}
.field .suffix{font-size:14px;color:var(--label-2);flex:0 0 auto}
.field .mini{flex:0 0 auto;font-size:13px;color:var(--accent);font-weight:600;padding:3px 8px;
  border-radius:7px;background:var(--accent-soft)}
textarea.ta{width:100%;background:var(--card);border:0;border-radius:var(--radius);padding:13px 14px;
  font-size:16px;line-height:1.6;resize:vertical;min-height:100px}
textarea.ta:focus{outline:2px solid var(--accent);outline-offset:-2px}
.hint{padding:7px 18px 0;font-size:12px;line-height:1.5;color:var(--label-2)}
.hint.warn{color:var(--amber)}
.hint b{color:var(--label)}

.photos{display:flex;gap:9px;overflow-x:auto;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
.photos::-webkit-scrollbar{display:none}
.ph{position:relative;flex:0 0 auto;width:96px;height:96px;border-radius:11px;overflow:hidden;
  background:var(--fill-2);border:.5px solid var(--sep)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .idx{position:absolute;top:3px;left:3px;min-width:18px;height:18px;border-radius:9px;
  background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center;padding:0 5px}
.ph .lead{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.55);color:#fff;
  font-size:10px;font-weight:600;text-align:center;padding:2px 0}
.ph-add{flex:0 0 auto;width:96px;height:96px;border-radius:11px;border:1.5px dashed var(--sep-strong);
  display:grid;place-items:center;color:var(--label-2);font-size:12px;gap:2px;line-height:1.3}
.ph-add span{font-size:22px;font-weight:300;display:block}

.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:.5px solid var(--sep);border-radius:99px;
  padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap;max-width:72vw;
  overflow:hidden;text-overflow:ellipsis}
.chip:active{background:var(--fill-2)}
.chip.add{border-style:dashed;color:var(--accent);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
  border-radius:12px 12px 0 0;display:flex;flex-direction:column;
  animation:up .32s cubic-bezier(.32,.72,0,1);box-shadow:0 -1px 0 var(--sep)}
.sheet.full{top:12px}
.sheet.auto{max-height:88%}
.sheet-nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-bottom:.5px solid var(--sep);background:var(--bar);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:12px 12px 0 0}
.sheet-nav .t{font-size:17px;font-weight:600;letter-spacing:-.3px;flex:1;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-nav .lnk{font-size:17px;color:var(--accent);flex:0 0 auto;min-width:46px}
.sheet-nav .lnk.r{text-align:right;font-weight:600}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}

.as{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:42;
  animation:up .3s cubic-bezier(.32,.72,0,1)}
.as-g{background:var(--bar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:14px;overflow:hidden;margin-bottom:8px}
.as-t{padding:14px 16px;text-align:center;font-size:13px;color:var(--label-2);
  border-bottom:.5px solid var(--sep-strong);line-height:1.5}
.as-b{display:block;width:100%;padding:16px;text-align:center;font-size:19px;color:var(--s-listed)}
.as-b + .as-b{border-top:.5px solid var(--sep-strong)}
.as-b:active{background:var(--fill)}
.as-b.destructive{color:var(--red)}
.as-b.strong{font-weight:600}
.as-b small{display:block;font-size:12px;color:var(--label-2);font-weight:400;margin-top:2px}
.as-cancel{background:var(--bg-2);border-radius:14px;width:100%;padding:16px;font-size:19px;
  font-weight:600;color:var(--s-listed)}

#fab{position:absolute;right:16px;bottom:16px;z-index:15;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(255,107,44,.42);font-size:28px;font-weight:300;line-height:0}
#fab:active{transform:scale(.93)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:60;background:rgba(28,28,30,.94);color:#fff;padding:11px 18px;
  border-radius:99px;font-size:14px;font-weight:500;max-width:calc(100% - 40px);text-align:center;
  animation:fade .18s ease;backdrop-filter:blur(10px);pointer-events:none}

.aicard{background:var(--card);border-radius:var(--radius);margin:0 16px;padding:14px;font-size:15px;line-height:1.6}
.aicard h4{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--label-2);text-transform:uppercase}
.aicard ul{margin:0;padding-left:18px}
.aicard li{margin:4px 0}
.aicard .meta{font-size:12px;color:var(--label-2);margin-top:10px;padding-top:9px;border-top:.5px solid var(--sep)}

.plat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 0 0}
.plat .p{background:var(--fill-2);border-radius:10px;padding:10px 11px;border:.5px solid var(--sep)}
.plat .p .n{font-size:12px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:5px}
.plat .p .big{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-top:3px}
.plat .p .sub{font-size:11px;color:var(--label-2);margin-top:1px;line-height:1.4}
.plat .p.dg{border-color:rgba(255,107,44,.35)}
.plat .p.dg .n{color:var(--accent)}
.plat .p.bj{border-color:rgba(48,176,199,.4)}
.plat .p.bj .n{color:var(--teal)}

.links{display:flex;gap:8px;overflow-x:auto;padding:0 16px 2px}
.links::-webkit-scrollbar{display:none}
.links a{flex:0 0 auto;text-decoration:none;background:var(--card);border-radius:10px;padding:9px 13px;
  font-size:14px;font-weight:600;color:var(--label);border:.5px solid var(--sep);white-space:nowrap}
.links a:active{background:var(--fill-2)}

.ai-tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px}
.ai-tool{background:var(--card);border-radius:var(--radius);padding:13px 12px;text-align:left;
  display:flex;flex-direction:column;gap:3px;min-height:74px;justify-content:center}
.ai-tool:active{background:var(--fill-2)}
.ai-tool .n{font-size:15px;font-weight:600;letter-spacing:-.2px}
.ai-tool .d{font-size:12px;color:var(--label-2);line-height:1.35}
.ai-tool[disabled]{opacity:.42;pointer-events:none}

.chart{display:flex;align-items:flex-end;gap:7px;height:116px;padding:0 16px;margin-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;justify-content:flex-end}
.chart .b{width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:3px}
.chart .b.zero{background:var(--fill)}
.chart .cap{font-size:10px;color:var(--label-2);white-space:nowrap}
.chart .amt{font-size:9px;color:var(--label-3);white-space:nowrap}

.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:0 16px;background:var(--fill)}
.stack div{min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:9px 16px 0;font-size:12px;color:var(--label-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;animation:fade .2s}
.viewer .vtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));color:#fff;font-size:15px}
.viewer .vtop button{color:#fff;font-size:16px}
.viewer .vmain{flex:1;display:grid;place-items:center;min-height:0;padding:0 8px}
.viewer .vmain img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.viewer .vbot{padding:12px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;align-items:center}
.viewer .vbot .btn{background:rgba(255,255,255,.16);color:#fff}
.viewer .vhint{color:rgba(255,255,255,.6);font-size:12px;text-align:center;padding:0 16px 8px;line-height:1.5}

@media (min-width:680px){
  .wrap,.group,.seg,.tiles,.btn-row,.aicard,.links,.ai-tools,.photos,.chart,.chips,.stack,.legend{
    max-width:640px;margin-left:auto;margin-right:auto}
  .navbar .row,.sheet-nav{max-width:640px;margin:0 auto}
}
</style>

<div id="root">
  <header class="navbar">
    <div class="row">
      <div><h1 id="navTitle">오늘</h1><p class="nav-sub" id="navSub">불러오는 중…</p></div>
    </div>
  </header>
  <div class="screens-holder">
    <div id="screens">
      <section class="screen" id="tab-today"></section>
      <section class="screen" id="tab-items" hidden></section>
      <section class="screen" id="tab-stats" hidden></section>
      <section class="screen" id="tab-settings" hidden></section>
    </div>
    <button id="fab" aria-label="물건 추가">+</button>
  </div>
  <nav class="tabbar" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>오늘</button>
    <button role="tab" data-tab="items" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><path d="M9 13h6"/></svg>물건</button>
    <button role="tab" data-tab="stats" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M21 19H3"/></svg>분석</button>
    <button role="tab" data-tab="settings" aria-selected="false">

/* ===================== 유틸 ===================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (Math.round(Number(n)) || 0).toLocaleString("ko-KR");

const now = () => Date.now();
const DAY = 86400000;

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));

function fmtDate(t){
  if(!t) return "";

}
const monthKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };

let toastTimer;

  let el = $("#toast");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast("복사했어요"); return true; }catch(_){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy"); ta.remove();

}

/* ===================== 가격 계산 ===================== */
/* it.price = 내가 손에 쥐고 싶은 금액(실수령). 플랫폼 게시가는 수수료를 얹어 역산. */
const feeOf = id => {
  const v = cfg.fees && cfg.fees[id];
  return typeof v === "number" ? v : (PLAT[id]?.defFee ?? 0);
};
const listPriceFor = (net, platId) => {
  const f = feeOf(platId) / 100;
  if(f <= 0 || f >= 1) return Math.round(net);
  return roundTo(net / (1 - f), 100);
};
const netFromList = (list, platId) => Math.round(list * (1 - feeOf(platId)/100));
const feeAmount = (list, platId) => Math.round(list * feeOf(platId)/100);

/* ===================== 저장소 ===================== */
const LS_ITEMS = "jungo.items.v2";
const LS_CFG = "jungo.cfg.v2";
let db = null, assets = null, sampleFn = null, sampleLimits = null, downloads = null;
let backend = "local";
let items = [];
let ready = false;      // 목록을 한 번이라도 받았는가
let settled = false;    // 서버가 확정한 목록을 받았는가 (캐시 스냅샷 아님)
/* 저장소 상태: 목록이 비어 보일 때 "진짜 빈 것"과 "아직 못 받은 것"을 절대 섞지 않는다 */
let storeState = "connecting";   // connecting | ready | error
let demoOn = false;              // 예시는 사용자가 직접 켤 때만 나온다
let cfg = { fees:{}, tone:"default", styleSamples:[], closing:"", snippets: DEFAULT_SNIPPETS.slice(), bumpDays:7 };

const blobCache = new Map();
const urlCache = new Map();

const lsRead = (k, fb) => { try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(_){ return fb; } };
const lsWrite = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} };

/* 한 번이라도 내 물건을 저장했으면 예시 화면으로 돌아가지 않는다 */
const LS_USED = "jungo.used";
let everUsed = false;
try{ everUsed = localStorage.getItem(LS_USED) === "1"; }catch(_){}
function markUsed(){
  if(everUsed) return;
  everUsed = true;
  try{ localStorage.setItem(LS_USED, "1"); }catch(_){}
}

const writeQueue = new Map();
function persist(item){
  markUsed();
  item.updatedAt = now();
  const idx = items.findIndex(i => i.id === item.id);
  if(idx === -1) items.push(item); else items[idx] = item;
  if(backend === "local"){ lsWrite(LS_ITEMS, items); renderAll(); return Promise.resolve(); }
  const prev = writeQueue.get(item.id) || Promise.resolve();
  const body = JSON.parse(JSON.stringify(item)); delete body.id;
  const next = prev.catch(() => {}).then(() => db.doc("items/" + item.id).set(body))
    .catch(e => {
      toast(e && e.code === "quota_exceeded" ? "저장 공간이 찼어요. 오래된 물건을 지워주세요." : "저장하지 못했어요.");
      console.error("persist", e);
    });
  writeQueue.set(item.id, next);
  renderAll();
  return next;
}
const saveTimers = new Map();
function persistSoon(item, ms=700){
  clearTimeout(saveTimers.get(item.id));
  saveTimers.set(item.id, setTimeout(() => persist(item), ms));
}
async function removeItem(id){
  items = items.filter(i => i.id !== id);
  if(backend === "local"){ lsWrite(LS_ITEMS, items); renderAll(); return; }
  renderAll();
  try{ await db.doc("items/" + id).delete(); }catch(e){ toast("삭제하지 못했어요."); console.error(e); }
}

let cfgTimer;
function saveCfg(immediate){
  const go = () => {
    if(backend === "local"){ lsWrite(LS_CFG, cfg); return; }
    db.doc("config/app").set(JSON.parse(JSON.stringify(cfg))).catch(e => console.error("cfg", e));
  };
  clearTimeout(cfgTimer);
  if(immediate) go(); else cfgTimer = setTimeout(go, 600);
}

const photoURL = pid => backend === "db" ? "/_blob/" + pid : (urlCache.get(pid) || "");

function blankItem(title){
  return {
    id: uid(), title: title || "", status:"planned", photos: [],
    brief: { brand:"", product:"", category:"", msrp:"", buyPrice:"", usedBuyPrice:"",
             buyDate:"", useCount:"", condition:"", includes:"", notes:"" },
    desc:"", price:"", priceHistory: [],
    priceGuide:null, productInfo:null,
    listedAt:null, bumpedAt:null, bumps:0,
    soldAt:null, soldList:"", soldPlatform:"danggn",
    createdAt: now(), updatedAt: now(),
  };
}
function normalize(raw, id){
  const b = blankItem();
  const it = Object.assign(b, raw, { id });
  it.brief = Object.assign(b.brief, raw.brief || {});
  it.photos = Array.isArray(raw.photos) ? raw.photos : [];
  it.priceHistory = Array.isArray(raw.priceHistory) ? raw.priceHistory : [];
  return it;
}
const soldNet = it => it.soldList ? netFromList(num(it.soldList), it.soldPlatform || "danggn") : 0;

/* ===================== 예시(저장 안 함) ===================== */
const DEMO = [
  { id:"demo1", demo:true, status:"listed", title:"발뮤다 더 토스터 K05A 화이트",
    brief:{brand:"발뮤다", product:"The Toaster K05A", category:"주방가전", msrp:"329000", buyPrice:"329000",
           usedBuyPrice:"", buyDate:"2024-03", useCount:"주 2회", condition:"사용감 적음",
           includes:"본체, 급수컵, 설명서, 박스", notes:"상판에 잔기스 1cm"},
    price:"180000", photos:[], desc:"", listedAt:now()-9*DAY, bumpedAt:now()-9*DAY, bumps:0, createdAt:now()-12*DAY,
    priceHistory:[{at:now()-9*DAY, price:200000, note:"처음 등록"},{at:now()-3*DAY, price:180000, note:"10% 내림"}] },
  { id:"demo2", demo:true, status:"planned", title:"아이패드 에어 4세대 64GB",
    brief:{brand:"Apple", product:"iPad Air 4 (2020)", category:"태블릿", msrp:"779000", buyPrice:"",
           usedBuyPrice:"430000", buyDate:"2023-05", useCount:"", condition:"사용감 있음",
           includes:"본체, 충전기", notes:""},
    price:"", photos:[], desc:"", createdAt:now()-3*DAY },
  { id:"demo3", demo:true, status:"sold", title:"닌텐도 스위치 OLED",
    brief:{brand:"닌텐도", product:"Switch OLED", category:"게임기", msrp:"415000", buyPrice:"415000",
           usedBuyPrice:"", buyDate:"2022-08", useCount:"", condition:"거의 새것", includes:"풀박", notes:""},
    price:"300000", soldList:"310000", soldPlatform:"bunjang", soldAt:now()-16*DAY,
    photos:[], desc:"", listedAt:now()-30*DAY, createdAt:now()-40*DAY },
];
/* 예시는 "서버가 비었다고 확정했고, 한 번도 쓴 적이 없을 때"만 보여준다.
   로딩 중이거나 연결이 잠깐 끊긴 순간에는 절대 예시로 돌아가지 않는다. */
/* 예시는 오직 사용자가 "예시 보기"를 눌렀을 때만.
   저장소가 느리거나 끊겼다고 해서 내 목록이 예시로 바뀌는 일은 이제 없다. */
const showingDemo = () => demoOn && items.length === 0;
const view = () => showingDemo() ? DEMO.map(d => normalize(d, d.id)) : items;

/* ===================== 초기화 ===================== */
function boot(){
  const cap = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

  // 목록이 제일 먼저 뜨게 한다. 나머지 기능은 준비되는 대로 뒤따라 붙는다.
  // (하나라도 같이 기다리면 응답 없는 기능 하나가 10초까지 화면을 잡아둔다)
  cap("db").then(d => { db = d; startStore(); });
  cap("assets").then(a => { assets = a; });
  cap("downloads").then(x => { downloads = x; });
  cap("sample").then(async s => {
    sampleFn = s;
    if(s) sampleLimits = await s.limits().catch(() => null);
    renderAll();
  });

  // 저장소 기능 자체가 끝내 응답하지 않을 때만 실패로 본다.
  setTimeout(() => {
    if(!storeStarted){
      diag.note = "저장소 기능이 응답하지 않음";
      storeState = "error"; renderAll();
    }
  }, 15000);
}

/* ---- 저장소: 단순 조회가 주 경로, 실시간 구독은 보조 ----
   예전에는 실시간 구독 하나로만 목록을 받아서, 그 통로가 막히면
   저장소에 물건이 멀쩡히 있어도 화면에 아무것도 못 띄웠다. */
let storeStarted = false, unsub = null, live = false, fetching = false, retryTimer = null;
const diag = { fetch:null, sub:null, note:"" };

function applyDocs(docs, definitive){
  const fresh = docs.map(d => normalize(d.data() || {}, d.id));
  // 아직 확정되지 않은 빈 목록으로 내 목록을 덮지 않는다.
  if(!definitive && !fresh.length && items.length) return;
  // 지금 열어 둔 물건은 화면에서 고치는 중이니 서버 사본으로 덮지 않는다.
  items = openItem ? fresh.map(f => f.id === openItem.id ? openItem : f) : fresh;
  if(openItem && !fresh.some(f => f.id === openItem.id)) items.push(openItem);
  if(items.length) markUsed();
}

async function fetchOnce(why){
  if(!db || fetching) return false;
  fetching = true;
  try{
    const snap = await db.collection("items").get();
    applyDocs(snap.docs, true);
    ready = true; settled = true; storeState = "ready";
    diag.fetch = { ok:true, n:snap.docs.length, why, at:Date.now() };
    renderAll();
    return true;
  }catch(e){
    diag.fetch = { ok:false, code:(e && e.code) || "?", msg:(e && e.message) || String(e), why, at:Date.now() };
    console.error("items.get", e);
    return false;
  }finally{ fetching = false; }
}

function subscribe(){
  if(!db) return;
  try{ unsub && unsub(); }catch(_){}
  try{
    unsub = db.collection("items").onSnapshot(
      snap => {
        live = true;
        diag.sub = { ok:true, n:snap.docs.length, at:Date.now() };
        applyDocs(snap.docs, !(snap.metadata && snap.metadata.fromCache));
        ready = true; settled = true; storeState = "ready";
        renderAll();
      },
      err => {
        live = false;
        diag.sub = { ok:false, code:(err && err.code) || "?", msg:(err && err.message) || "", at:Date.now() };
        console.error("items.onSnapshot", err);
        fetchOnce("구독 끊김").then(ok => { if(!ok) markError(); });
        setTimeout(subscribe, 8000);   // 새로 구독하는 것이 유일한 복구 수단
      });
  }catch(e){
    live = false;
    diag.sub = { ok:false, code:"throw", msg:String((e && e.message) || e), at:Date.now() };
  }
}

function markError(){
  if(items.length) return;   // 보여줄 게 있으면 실패라고 하지 않는다
  storeState = "error"; renderAll();
}

async function reload(){
  if(!db){ renderAll(); return; }
  clearTimeout(retryTimer);
  storeState = items.length ? "ready" : "connecting";
  renderAll();
  const ok = await fetchOnce("다시 불러오기");
  if(ok) subscribe(); else markError();
}

function startStore(){
  if(storeStarted) return;
  storeStarted = true;

  if(!db){
    backend = "local";
    items = lsRead(LS_ITEMS, []);
    cfg = Object.assign(cfg, lsRead(LS_CFG, {}));
    ready = true; settled = true; storeState = "ready";
    renderAll();
    return;
  }

  backend = "db";
  db.doc("config/app").get()
    .then(snap => { if(snap.exists){ cfg = Object.assign(cfg, snap.data()); renderAll(); } })
    .catch(e => console.warn("cfg load", e));

  // 1) 먼저 그냥 한 번 읽어온다 (가장 단순하고 잘 되는 경로)
  fetchOnce("첫 로딩").then(ok => {
    if(ok) return;
    // 2) 실패하면 조용히 재시도한다. 세 번 해보고 그때 알린다.
    let n = 0;
    const again = async () => {
      n++;
      if(await fetchOnce("자동 재시도 " + n)) return;
      if(n < 3) retryTimer = setTimeout(again, n * 3000); else markError();
    };
    retryTimer = setTimeout(again, 2000);
  });

  // 3) 실시간 갱신은 보조로 붙인다. 안 붙어도 앱은 돌아간다.
  subscribe();

  // 4) 실시간이 죽어 있으면 주기적으로, 그리고 앱으로 돌아올 때마다 다시 읽는다.
  setInterval(() => { if(!live && !document.hidden) fetchOnce("주기 확인"); }, 30000);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && !live) fetchOnce("화면 복귀");
  });

  renderAll();
}

/* ===================== 파생값 ===================== */
const byStatus = (st, list=view()) => list.filter(i => i.status === st);
const bumpDays = () => Number(cfg.bumpDays) || 7;
function bumpDue(it){
  if(it.status !== "listed") return false;
  const last = it.bumpedAt || it.listedAt;
  return last ? (now() - last) >= bumpDays() * DAY : false;
}
function todoList(){
  const list = view(); const out = [];
  for(const it of list) if(bumpDue(it))
    out.push({ it, kind:"bump", label:`${daysSince(it.bumpedAt || it.listedAt)}일째 그대로예요`, cta:"끌올" });
  for(const it of byStatus("listed", list))
    if(!bumpDue(it) && daysSince(it.bumpedAt || it.listedAt) >= Math.floor(bumpDays()*2) )
      out.push({ it, kind:"cut", label:"오래 안 팔려요. 가격을 내려볼까요?", cta:"가격" });
  for(const it of byStatus("planned", list)){
    if(!it.desc) out.push({ it, kind:"write", label:"판매글이 비어 있어요", cta:"AI로 쓰기" });
    else if(it.photos.length === 0) out.push({ it, kind:"photo", label:"사진이 아직 없어요", cta:"사진 넣기" });
    else out.push({ it, kind:"list", label:"글과 사진 다 됐어요", cta:"등록함" });
  }
  return out;
}
function stats(){
  const list = view();
  const sold = byStatus("sold", list);
  const total = sold.reduce((s,i) => s + soldNet(i), 0);
  const fees = sold.reduce((s,i) => s + (i.soldList ? feeAmount(num(i.soldList), i.soldPlatform||"danggn") : 0), 0);
  const mk = monthKey(now());
  const thisMonth = sold.filter(i => i.soldAt && monthKey(i.soldAt) === mk).reduce((s,i) => s + soldNet(i), 0);
  const pending = [...byStatus("planned", list), ...byStatus("listed", list)];
  const potential = pending.reduce((s,i) => s + num(i.price), 0);
  const priced = pending.filter(i => num(i.price) > 0).length;
  return { total, fees, thisMonth, potential, pending: pending.length, priced,
           soldCount: sold.length, held: byStatus("held", list).length };
}

function itemRow(it, opts={}){
  const b = it.brief || {};

  const money = it.status === "sold"
    ? (it.soldList ? `${won(soldNet(it))}원 받음` : "판매 완료")
    : (num(it.price) ? `${won(listPriceFor(num(it.price), "danggn"))}원` : "가격 미정");

  if(it.demo) chips.push(`<span class="pill demo">예시</span>`);
  if(opts.showStage) chips.push(`<span class="pill"><span class="dot" style="background:${STAGE[it.status].color}"></span>${STAGE[it.status].name}</span>`);
  if(bumpDue(it)) chips.push(`<span class="pill warn">끌올 필요</span>`);
  else if(it.status === "listed" && it.listedAt) chips.push(`<span class="pill">등록 ${daysSince(it.bumpedAt || it.listedAt)}일째</span>`);
  if(it.status === "listed" && it.priceHistory.length > 1) chips.push(`<span class="pill cut">${it.priceHistory.length - 1}번 내림</span>`);
  if(it.status === "planned" && !it.desc) chips.push(`<span class="pill">글 없음</span>`);
  else if(it.status === "planned" && !it.photos.length) chips.push(`<span class="pill">사진 없음</span>`);
  else if(it.status === "planned") chips.push(`<span class="pill go">등록 준비 완료</span>`);
  if(it.status === "sold" && it.soldPlatform === "bunjang") chips.push(`<span class="pill">번개 · 수수료 ${won(feeAmount(num(it.soldList), "bunjang"))}원</span>`);

  return `<button class="row-i" data-open="${esc(it.id)}">${thumbOf(it)}

function renderItems(){

  const list = view();
  const s = stats();
  const sold = byStatus("sold", list).slice().sort((a,b) => (b.soldAt||0) - (a.soldAt||0));
  const planned = byStatus("planned", list), listed = byStatus("listed", list);

  const hero = `<div class="tiles" style="margin-top:14px">
    <div class="tile hero"><div class="k">지금까지 손에 쥔 돈</div>
      <div class="v tnum">${won(s.total)}<span class="u">원</span></div>

  </div>`;

  const plannedSum = planned.reduce((a,i) => a + num(i.price), 0);
  const listedSum = listed.reduce((a,i) => a + num(i.price), 0);
  const noPrice = [...planned, ...listed].filter(i => !num(i.price)).length;
  const potential = `<div class="sec">
    <div class="sec-h"><span>다 팔면 얼마?</span></div>
    <div class="aicard">
      <div class="tnum" style="font-size:32px;font-weight:700;letter-spacing:-.8px;color:var(--accent);line-height:1.1">${won(s.potential)}원</div>
      <div style="color:var(--label-2);font-size:13px;margin-top:3px">지금 예정·등록에 있는 걸 적어둔 가격에 모두 팔았을 때</div>
      ${s.potential ? `<div class="stack" style="margin:13px 0 0">
        ${plannedSum ? `<div style="background:var(--s-planned);width:${(plannedSum/s.potential*100).toFixed(1)}%"></div>` : ""}
        ${listedSum ? `<div style="background:var(--s-listed);width:${(listedSum/s.potential*100).toFixed(1)}%"></div>` : ""}
      </div>` : ""}
      <div class="legend" style="padding-left:0;padding-right:0">
        <span><span class="dot" style="background:var(--s-planned)"></span>예정 ${planned.length}개 · ${won(plannedSum)}원</span>
        <span><span class="dot" style="background:var(--s-listed)"></span>등록 ${listed.length}개 · ${won(listedSum)}원</span>
      </div>
      ${noPrice ? `<div class="meta">${noPrice}개는 아직 가격을 안 적었어요. 넣으면 이 숫자가 더 정확해져요.</div>` : ""}
    </div>
    <div class="hint">여기 금액은 모두 <b>수수료를 뺀 실수령 기준</b>이에요.</div>
  </div>`;

  const months = [];
  for(let i = 5; i >= 0; i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    const key = monthKey(d.getTime());
    months.push({ label:`${d.getMonth()+1}월`,
      sum: sold.filter(x => x.soldAt && monthKey(x.soldAt) === key).reduce((a,x) => a + soldNet(x), 0) });
  }
  const max = Math.max(1, ...months.map(m => m.sum));
  const chart = `<div class="sec">
    <div class="sec-h"><span>월별 실수령</span><span class="plain tnum">최고 ${won(max)}원</span></div>

      <div class="amt">${m.sum ? won(Math.round(m.sum/10000)) + "만" : ""}</div>

      <div class="cap">${m.label}</div></div>`).join("")}</div></div>`;

  const withDays = sold.filter(i => i.soldAt && i.listedAt);
  const avgDays = withDays.length ? Math.round(withDays.reduce((a,i) => a + (i.soldAt - i.listedAt)/DAY, 0) / withDays.length) : null;
  const rateItems = sold.filter(i => num(i.brief?.buyPrice));

    ? Math.round(rateItems.reduce((a,i) => a + soldNet(i)/num(i.brief.buyPrice), 0) / rateItems.length * 100) : null;

  const kpi = `<div class="sec"><div class="sec-h"><span>거래 습관</span></div>
    <div class="tiles">
      <div class="tile"><div class="k">평균 소요</div><div class="v tnum">${avgDays ?? "–"}<span class="u">${avgDays!=null?"일":""}</span></div></div>
      <div class="tile"><div class="k">평균 판매가</div><div class="v tnum">${avgPrice!=null?won(avgPrice):"–"}<span class="u">${avgPrice!=null?"원":""}</span></div></div>
      <div class="tile"><div class="k">회수율</div><div class="v tnum">${rate ?? "–"}<span class="u">${rate!=null?"%":""}</span></div></div>
    </div>
    <div class="hint">회수율은 <b>실수령 ÷ 처음 산 가격</b>의 평균이에요. 구매가를 적어둔 ${rateItems.length}개만 셉니다.</div></div>`;

  const byPlat = PLATFORMS.map(p => {
    const rows = sold.filter(i => (i.soldPlatform || "danggn") === p.id);
    return { p, n: rows.length,
      net: rows.reduce((a,i) => a + soldNet(i), 0),
      fee: rows.reduce((a,i) => a + feeAmount(num(i.soldList), p.id), 0) };
  }).filter(x => x.n);
  const platSec = byPlat.length ? `<div class="sec">
    <div class="sec-h"><span>어디서 팔았나</span></div>
    <div class="group">${byPlat.map(x => `<div class="row-i">
      <span class="it-body"><span class="it-t">${esc(x.p.name)} · ${x.n}건</span>
      <span class="it-s">${won(x.net)}원 받음${x.fee ? ` · 수수료 ${won(x.fee)}원` : " · 수수료 없음"}</span></span>
    </div>`).join("")}</div>
    ${s.fees ? `<div class="hint warn">수수료로 지금까지 <b>${won(s.fees)}원</b>이 빠져나갔어요. 같은 값이면 당근 직거래가 남는 게 많아요.</div>` : ""}

  const soldList = sold.length ? `<div class="sec">
    <div class="sec-h"><span>판매한 물건</span><span class="plain tnum">${sold.length}건</span></div>
    <div class="group">${sold.map(i => `<button class="row-i" data-open="${esc(i.id)}">${thumbOf(i)}
      <span class="it-body"><span class="it-t">${esc(i.title || "제목 없음")}</span>
        <span class="it-s">${esc(fmtDate(i.soldAt))} · ${esc(PLAT[i.soldPlatform||"danggn"]?.name || "")} ${won(num(i.soldList))}원${
          feeAmount(num(i.soldList), i.soldPlatform||"danggn") ? ` → ${won(soldNet(i))}원 실수령` : ""}</span></span>${chev}</button>`).join("")}</div>
  </div>` : `<div class="sec"><div class="sec-h"><span>판매한 물건</span></div>
    <div class="group"><div class="empty"><b>판매 기록이 없어요</b>거래가 끝난 물건을 판매로 옮기면 여기에 쌓입니다.</div></div></div>`;

  $("#tab-stats").innerHTML = hero + potential + chart + kpi + platSec + soldList;
}

/* ===================== 탭/전역 이벤트 ===================== */
function setTab(t){
  tab = t;
  $$(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  ["today","items","stats","settings"].forEach(k => { $("#tab-" + k).hidden = (k !== t); });
  $("#screens").scrollTop = 0;
  renderAll();
}
$$(".tabbar button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("#fab").addEventListener("click", () => openQuickAdd());

document.addEventListener("click", ev => {
  const t = ev.target;
  const open = t.closest("[data-open]");        if(open){ openDetail(open.dataset.open); return; }
  const seg = t.closest("[data-seg]");          if(seg){ segment = seg.dataset.seg; renderItems(); return; }
  const go = t.closest("[data-goseg]");         if(go){ segment = go.dataset.goseg; setTab("items"); return; }
  if(t.closest("#quickAdd")){ openQuickAdd(); return; }
  if(t.closest("#hideDemo")){ demoOn = false; markUsed(); renderAll(); return; }
  if(t.closest("#showDemo")){ demoOn = true; setTab("today"); return; }
  if(t.closest("#retryLoad")){ reload(); return; }
  const todo = t.closest("[data-todo]");        if(todo){ handleTodo(todo.dataset.todo, todo.dataset.id); return; }

  if(t.closest("#bumpAll")){
    const rows = byStatus("listed").filter(bumpDue).filter(i => !i.demo);
    if(!rows.length){ toast("예시에서는 끌올할 수 없어요."); return; }
    rows.forEach(i => { i.bumpedAt = now(); i.bumps = (i.bumps||0)+1; persist(i); });
    toast(`${rows.length}개 끌올로 표시했어요`); return;
  }

  // 설정
  const tone = t.closest("[data-tone]");
  if(tone){ cfg.tone = tone.dataset.tone; saveCfg(); renderSettings(); return; }
  if(t.closest("#addSample")){ addStyleSample(); return; }
  const rms = t.closest("[data-rmsample]");
  if(rms){ cfg.styleSamples.splice(+rms.dataset.rmsample,1); saveCfg(true); renderSettings(); toast("지웠어요"); return; }
  if(t.closest("#addSnip")){ addSnippet(); return; }
  const rmn = t.closest("[data-rmsnip]");
  if(rmn){ cfg.snippets.splice(+rmn.dataset.rmsnip,1); saveCfg(true); renderSettings(); toast("지웠어요"); return; }
  if(t.closest("#resetSnip")){ cfg.snippets = DEFAULT_SNIPPETS.slice(); saveCfg(true); renderSettings(); toast("기본 멘트로 되돌렸어요"); return; }
  if(t.closest("#backupBtn")){ backup(t.closest("#backupBtn")); return; }
  if(t.closest("#diagRefresh")){ reload().then(() => renderSettings()); return; }
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.id === "q"){ query = t.value; renderItems(); $("#q").focus(); return; }
  if(t.dataset && t.dataset.fee){
    cfg.fees = cfg.fees || {};
    cfg.fees[t.dataset.fee] = clamp(parseFloat(t.value) || 0, 0, 90);
    saveCfg(); return;
  }
  if(t.id === "bumpDays"){ cfg.bumpDays = clamp(parseInt(t.value,10) || 7, 1, 90); saveCfg(); return; }
  if(t.id === "closing"){ cfg.closing = t.value; saveCfg(); return; }
});

function handleTodo(kind, id){
  const it = items.find(i => i.id === id);
  if(!it){ toast("예시예요. + 를 눌러 내 물건을 넣어보세요."); return; }
  if(kind === "bump"){ it.bumpedAt = now(); it.bumps = (it.bumps||0)+1; persist(it); toast("끌올했다고 표시했어요"); }
  else if(kind === "list"){ moveTo(it, "listed"); }
  else if(kind === "cut"){ cutPrice(it); }
  else openDetail(id, kind === "photo" ? "photo" : "write");
}

/* ===================== 시트 인프라 ===================== */
function openSheet({ title, left="닫기", right="", full=true, body="", onRight, onClose }){
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const sheet = document.createElement("div"); sheet.className = "sheet " + (full ? "full" : "auto");
  sheet.innerHTML = `<div class="sheet-nav"><button class="lnk l">${esc(left)}</button>
    <div class="t">${esc(title)}</div><button class="lnk r">${esc(right)}</button></div>
    <div class="sheet-body">${body}</div>`;
  document.body.append(scrim, sheet);
  const close = () => { scrim.remove(); sheet.remove(); onClose && onClose(); };
  scrim.addEventListener("click", close);
  sheet.querySelector(".lnk.l").addEventListener("click", close);
  const r = sheet.querySelector(".lnk.r");
  if(right && onRight) r.addEventListener("click", () => onRight(close)); else r.style.visibility = "hidden";
  return { sheet, close, body: sheet.querySelector(".sheet-body") };
}

function actionSheet(title, options){
  return new Promise(resolve => {
    const scrim = document.createElement("div"); scrim.className = "scrim";
    const as = document.createElement("div"); as.className = "as";
    as.innerHTML = `<div class="as-g">${title ? `<div class="as-t">${esc(title)}</div>` : ""}
      ${options.map((o,i) => `<button class="as-b ${o.destructive?"destructive":""} ${o.strong?"strong":""}" data-i="${i}">${esc(o.label)}${o.note?`<small>${esc(o.note)}</small>`:""}</button>`).join("")}
      </div><button class="as-cancel">취소</button>`;
    document.body.append(scrim, as);
    const done = v => { scrim.remove(); as.remove(); resolve(v); };
    scrim.addEventListener("click", () => done(null));
    as.querySelector(".as-cancel").addEventListener("click", () => done(null));
    as.querySelectorAll(".as-b").forEach(b => b.addEventListener("click", () => done(options[+b.dataset.i].value)));
  });
}

function promptSheet(title, fields, submitLabel="저장"){
  return new Promise(resolve => {
    let settled = false;
    const body = `<div class="group" style="margin-top:14px">${fields.map(f => f.multiline
      ? `<div style="padding:10px 14px"><label for="ps-${f.key}" style="font-size:13px;color:var(--label-2);display:block;margin-bottom:6px">${esc(f.label)}</label>
         <textarea id="ps-${f.key}" rows="${f.rows||5}" placeholder="${esc(f.placeholder||"")}"
         style="width:100%;background:var(--fill-2);border:0;border-radius:9px;padding:10px;font-size:16px;line-height:1.55;resize:vertical">${esc(f.value||"")}</textarea></div>`
      : `<div class="field"><label for="ps-${f.key}">${esc(f.label)}</label>
         <input id="ps-${f.key}" inputmode="${f.inputmode||"text"}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}">
         ${f.suffix?`<span class="suffix">${esc(f.suffix)}</span>`:""}</div>`).join("")}</div>
      ${fields.some(f=>f.hint) ? `<div class="hint">${fields.filter(f=>f.hint).map(f=>esc(f.hint)).join("<br>")}</div>` : ""}
      <div class="btn-row" style="margin-top:16px"><button class="btn primary" id="ps-go">${esc(submitLabel)}</button></div>`;
    const s = openSheet({ title, full:false, left:"취소", body,
      onClose: () => { if(!settled){ settled = true; resolve(null); } } });
    const go = () => {
      const out = {};
      fields.forEach(f => { out[f.key] = s.body.querySelector("#ps-" + f.key).value.trim(); });
      settled = true; s.close(); resolve(out);
    };
    s.body.querySelector("#ps-go").addEventListener("click", go);
    s.body.querySelector("input,textarea")?.focus();
    s.body.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.tagName !== "TEXTAREA") go(); });
  });
}

const aiOn = () => !!sampleFn;
const aiImages = () => !!(sampleLimits && sampleLimits.images);
const NO_INVENT = "정보에 없는 사실은 절대 지어내지 마세요. 모르는 것은 아예 쓰지 말고, 추측이면 추측이라고 밝히세요.";

async function ai(btn, runner){
  if(!sampleFn){ toast("이 화면에서는 AI를 쓸 수 없어요."); return null; }
  const original = btn ? btn.innerHTML : null;
  if(btn){ btn.innerHTML = `<span class="spin"></span> 생각하는 중…`; btn.disabled = true; }
  try{ return await runner(); }
  catch(e){
    if(e && e.code !== "cancelled") toast(AI_ERR[e && e.code] || AI_ERR.upstream_error);
    console.warn("ai", e);
    return null;
  }finally{ if(btn){ btn.innerHTML = original; btn.disabled = false; } }
}

function briefText(it){
  const b = it.brief || {}, L = [];
  if(it.title) L.push(`물건: ${it.title}`);
  if(b.brand) L.push(`브랜드: ${b.brand}`);
  if(b.product) L.push(`제품명/모델: ${b.product}`);
  if(b.category) L.push(`분류: ${b.category}`);
  if(b.msrp) L.push(`새 제품 정가: ${won(b.msrp)}원`);
  if(b.buyPrice) L.push(`내가 새로 산 가격: ${won(b.buyPrice)}원`);
  if(b.usedBuyPrice) L.push(`내가 중고로 산 가격: ${won(b.usedBuyPrice)}원 (참고용, 글에는 쓰지 말 것)`);
  if(b.buyDate) L.push(`구매 시기: ${b.buyDate}`);
  if(b.useCount) L.push(`사용 정도: ${b.useCount}`);
  if(b.condition) L.push(`상태: ${b.condition}`);
  if(b.includes) L.push(`구성품: ${b.includes}`);
  if(b.notes) L.push(`특이사항/하자: ${b.notes}`);
  if(num(it.price)) L.push(`내가 받고 싶은 금액: ${won(it.price)}원`);
  return L.join("\n") || "(정보가 거의 없음)";
}

function fld(key,label,value,ph,mode="text",suffix){
  return `<div class="field"><label for="f-${key}">${esc(label)}</label>
    <input id="f-${key}" value="${esc(value||"")}" placeholder="${esc(ph)}" inputmode="${mode}">

}

function openDetail(id, focus){
  const it = items.find(i => i.id === id) || view().find(i => i.id === id);
  if(!it) return;
  if(it.demo){ toast("예시예요. + 를 눌러 내 물건을 넣어보세요."); return; }
  openId = id; openItem = it;
  sheetRef = openSheet({ title: it.title || "새 물건", left:"완료", body: detailHTML(it),
    onClose: () => {
      clearTimeout(saveTimers.get(id));
      // 화면에서 고치던 그 객체를 저장한다. 목록에서 다시 찾으면 편집분이 날아간다.
      if(openItem) persist(openItem);
      openId = null; sheetRef = null; openItem = null;
    }});
  wireDetail(sheetRef, it);
  if(focus === "photo") sheetRef.body.querySelector("#addPhoto")?.click();
  if(focus === "write") sheetRef.body.querySelector("#f-desc")?.focus();
}
function refreshDetail(){
  if(!openId || !sheetRef) return;
  const it = openItem; if(!it) return;
  const y = sheetRef.body.scrollTop;
  sheetRef.body.innerHTML = detailHTML(it);
  sheetRef.sheet.querySelector(".t").textContent = it.title || "새 물건";
  wireDetail(sheetRef, it);
  sheetRef.body.scrollTop = y;
}

function wireDetail(s, it){
  const B = s.body, touch = () => persistSoon(it);
  const setters = {
    "f-title":   v => { it.title = v; s.sheet.querySelector(".t").textContent = v || "새 물건"; },
    "f-brand":   v => it.brief.brand = v,
    "f-product": v => it.brief.product = v,
    "f-category":v => it.brief.category = v,
    "f-msrp":    v => it.brief.msrp = String(num(v) || ""),
    "f-buyPrice":v => it.brief.buyPrice = String(num(v) || ""),
    "f-usedBuyPrice": v => it.brief.usedBuyPrice = String(num(v) || ""),
    "f-buyDate": v => it.brief.buyDate = v,
    "f-useCount":v => it.brief.useCount = v,
    "f-includes":v => it.brief.includes = v,
    "f-notes":   v => it.brief.notes = v,
    "f-desc":    v => it.desc = v,
  };
  Object.entries(setters).forEach(([id,set]) => {
    const el = B.querySelector("#"+id);
    if(el) el.addEventListener("input", e => { set(e.target.value); touch(); });
  });
  B.querySelector("#f-condition")?.addEventListener("change", e => { it.brief.condition = e.target.value; touch(); });

  // 가격: 입력 중엔 플랫폼 카드만 갱신
  const priceEl = B.querySelector("#f-price");
  priceEl?.addEventListener("input", e => {
    it.price = String(num(e.target.value) || "");
    const holder = priceEl.closest(".sec").querySelector(".aicard, .hint");
    const fresh = document.createElement("div");
    fresh.innerHTML = priceBlock(it);
    if(holder) holder.replaceWith(fresh.firstElementChild);
    touch();
  });
  priceEl?.addEventListener("change", () => {
    const last = it.priceHistory[it.priceHistory.length - 1];
    const v = num(it.price);
    if(v && (!last || last.price !== v)){
      it.priceHistory.push({ at: now(), price: v, note: last ? "직접 수정" : "처음 정함" });
      persist(it);
    }
  });

  B.querySelectorAll("[data-move]").forEach(btn => btn.addEventListener("click", () => moveTo(it, btn.dataset.move)));
  B.querySelector("#bumpBtn")?.addEventListener("click", () => {
    it.bumpedAt = now(); it.bumps = (it.bumps||0)+1; persist(it); refreshDetail(); toast("끌올했다고 표시했어요");
  });
  B.querySelector("#cutBtn")?.addEventListener("click", () => cutPrice(it));
  B.querySelector("#editSold")?.addEventListener("click", () => askSold(it, true));

  // 사진
  B.querySelector("#addPhoto")?.addEventListener("click", pickPhotos);
  B.querySelector("#viewPhotos")?.addEventListener("click", () => openViewer(it, 0));
  B.querySelector("#saveAllPhotos")?.addEventListener("click", e => saveAllPhotos(e.currentTarget, it));
  B.querySelectorAll("[data-ph]").forEach(el =>
    el.addEventListener("click", () => openViewer(it, +el.dataset.i)));

  // 멘트
  B.querySelectorAll("[data-snip]").forEach(btn => btn.addEventListener("click", () => {
    appendToDesc(B, it, (cfg.snippets||[])[+btn.dataset.snip]);
  }));
  B.querySelector("#newSnip")?.addEventListener("click", async () => {
    const text = await addSnippet();
    if(text){ appendToDesc(B, it, text); refreshDetail(); }
  });

  const copy = () => copyText(B.querySelector("#f-desc").value);
  B.querySelector("#copyDesc")?.addEventListener("click", copy);
  B.querySelector("#copyDesc2")?.addEventListener("click", copy);

  B.querySelector("#delBtn")?.addEventListener("click", async () => {
    const go = await actionSheet(`"${it.title || "제목 없음"}"을(를) 지울까요? 되돌릴 수 없어요.`,
      [{ label:"지우기", value:"del", destructive:true, strong:true }]);
    if(go !== "del") return;
    const ids = it.photos.slice();
    clearTimeout(saveTimers.get(it.id));
    openItem = null;              // 닫을 때 저장이 지운 물건을 되살리지 않도록
    await removeItem(it.id);
    s.close();
    ids.forEach(p => assets && assets.delete(p).catch(() => {}));
    toast("지웠어요");
  });

  B.querySelector("#writeAI")?.addEventListener("click", e => writeDesc(e.currentTarget, it, B));
  B.querySelector("#titleAI")?.addEventListener("click", e => suggestTitles(e.currentTarget, it, B));
  B.querySelector("#tPrice")?.addEventListener("click", e => guessPrice(e.currentTarget, it, B));
  B.querySelector("#tSpec")?.addEventListener("click", e => findSpecs(e.currentTarget, it, B));
  B.querySelector("#tPhoto")?.addEventListener("click", e => checkPhotos(e.currentTarget, it, B));
  B.querySelector("#tReply")?.addEventListener("click", () => replyHelper(it));

  async function pickPhotos(){
    if(backend === "db" && !assets){ toast("이 화면에서는 사진을 올릴 수 없어요."); return; }
    const input = document.createElement("input");
    input.type = "file"; input.accept = "image/*"; input.multiple = true;
    input.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    document.body.appendChild(input);
    input.addEventListener("change", async () => {
      const files = [...input.files].slice(0, MAX_PHOTOS - it.photos.length);
      input.remove();
      if(!files.length) return;
      toast(`사진 ${files.length}장 넣는 중…`);
      for(const f of files){
        try{
          const blob = await compress(f);
          let pid;
          if(assets){ pid = (await assets.upload(blob, { type:"image/jpeg" })).id; }
          else { pid = uid(); urlCache.set(pid, URL.createObjectURL(blob)); }
          blobCache.set(pid, blob);
          it.photos.push(pid);
          await persist(it);
          refreshDetail();
        }catch(err){
          toast({ too_large:"사진이 너무 커요.", quota_or_state:"저장 공간이 찼어요. 오래된 사진을 지워주세요.",
                  rate_limited:"조금 천천히 올려주세요.", unsupported_type:"이 형식의 사진은 올릴 수 없어요." }[err && err.code]
                || "사진을 올리지 못했어요.");
          console.error("upload", err); break;
        }
      }
    });
    input.click();
  }
}

function appendToDesc(B, it, text){
  if(!text) return;
  const ta = B.querySelector("#f-desc");
  const base = (ta.value || "").trimEnd();
  if(base.includes(text)){ toast("이미 들어 있어요"); return; }
  ta.value = base ? base + "\n\n" + text : text;
  it.desc = ta.value;
  persist(it);
  ta.scrollTop = ta.scrollHeight;
  toast("판매글에 붙였어요");
}

async function compress(file, max=1600, q=0.82){
  try{
    const bmp = await createImageBitmap(file, { imageOrientation:"from-image" });
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width*scale), h = Math.round(bmp.height*scale);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    bmp.close && bmp.close();
    return (await new Promise(res => c.toBlob(res, "image/jpeg", q))) || file;
  }catch(_){ return file; }
}

/* ===================== 사진 뷰어 / 내려받기 ===================== */
async function getBlob(pid){
  if(blobCache.has(pid)) return blobCache.get(pid);
  try{
    const r = await fetch(photoURL(pid));
    if(!r.ok) throw new Error(String(r.status));
    const b = await r.blob();
    blobCache.set(pid, b);
    return b;
  }catch(_){ return null; }
}
const safeName = (it, i) => (String(it.title || "물건").replace(/[\\/:*?"<>|]/g,"").trim().slice(0,40) || "물건") + `_${String(i+1).padStart(2,"0")}.jpg`;

async function savePhoto(pid, name){
  if(!downloads){ toast("이 화면에서는 내려받을 수 없어요. 사진을 꾹 눌러 저장해 주세요."); return "unavailable"; }
  const blob = await getBlob(pid);
  if(!blob){ toast("사진을 읽지 못했어요."); return "noblob"; }
  try{ await downloads.save({ filename: name, data: blob }); return "saved"; }
  catch(e){
    if(e && e.code === "declined") return "declined";
    if(e && e.code === "rate_limited") return "rate_limited";
    toast({ too_large:"사진이 너무 커요.", unavailable:"이 화면에서는 내려받을 수 없어요." }[e && e.code] || "내려받지 못했어요.");
    console.warn("download", e);
    return "error";
  }
}
async function saveAllPhotos(btn, it){
  if(!downloads){ toast("이 화면에서는 내려받을 수 없어요. 크게 보기에서 사진을 꾹 눌러 저장해 주세요."); return; }
  const orig = btn.innerHTML;
  let done = 0;
  for(let i = 0; i < it.photos.length; i++){
    btn.innerHTML = `<span class="spin"></span> ${i+1} / ${it.photos.length}장`;
    btn.disabled = true;
    let r = await savePhoto(it.photos[i], safeName(it, i));
    if(r === "rate_limited"){
      await new Promise(res => setTimeout(res, 1200));
      r = await savePhoto(it.photos[i], safeName(it, i));
    }
    if(r === "saved") done++;
    if(r === "declined" || r === "unavailable" || r === "error") break;
    await new Promise(res => setTimeout(res, 350));
  }
  btn.innerHTML = orig; btn.disabled = false;
  toast(done ? `${done}장 저장했어요` : "저장하지 않았어요");
}

function openViewer(it, start){
  let i = clamp(start, 0, it.photos.length - 1);
  const v = document.createElement("div");
  v.className = "viewer";
  const draw = () => {
    v.innerHTML = `
      <div class="vtop"><button id="vclose">닫기</button>
        <span class="tnum">${i+1} / ${it.photos.length}</span>
        <button id="vprev" ${i===0?"disabled style=opacity:.3":""}>◀</button></div>
      <div class="vmain"><img src="${esc(photoURL(it.photos[i]))}" alt="사진 ${i+1}"></div>
      <div class="vhint">아이폰이라면 사진을 <b>꾹 눌러</b> "사진에 추가"를 고르면 카메라 롤로 바로 들어가요.</div>
      <div class="vbot">
        <button class="btn" id="vlead">${i===0?"대표 사진":"대표로"}</button>
        ${downloads ? `<button class="btn" id="vsave">저장</button>` : ""}
        <button class="btn" id="vdel" style="color:#FF6B6B">삭제</button>
        <button class="btn" id="vnext" ${i>=it.photos.length-1?"disabled":""}>다음</button>
      </div>`;
    v.querySelector("#vclose").onclick = () => { v.remove(); refreshDetail(); };
    v.querySelector("#vprev").onclick = () => { if(i>0){ i--; draw(); } };
    v.querySelector("#vnext").onclick = () => { if(i<it.photos.length-1){ i++; draw(); } };
    v.querySelector("#vlead").onclick = () => {
      if(i === 0) return;
      const pid = it.photos[i];
      it.photos = [pid, ...it.photos.filter(p => p !== pid)];
      i = 0; persist(it); draw(); toast("대표 사진으로 바꿨어요");
    };
    const sv = v.querySelector("#vsave");
    if(sv) sv.onclick = async () => {
      sv.innerHTML = `<span class="spin"></span>`;
      const r = await savePhoto(it.photos[i], safeName(it, i));
      sv.innerHTML = "저장";
      if(r === "saved") toast("저장했어요");
    };
    v.querySelector("#vdel").onclick = async () => {
      const go = await actionSheet("이 사진을 지울까요?", [{ label:"사진 지우기", value:"del", destructive:true }]);
      if(go !== "del") return;
      const pid = it.photos[i];
      it.photos = it.photos.filter(p => p !== pid);
      blobCache.delete(pid);
      await persist(it);
      if(assets) assets.delete(pid).catch(() => {});
      if(!it.photos.length){ v.remove(); refreshDetail(); return; }
      i = clamp(i, 0, it.photos.length - 1); draw();
    };
  };
  draw();
  document.body.appendChild(v);
}

async function askSold(it, editing){
  const cur = num(it.soldList) || num(it.price) || 0;
  const plat = await actionSheet(editing ? "어디서 파셨어요?" : "어디서 파셨어요?",
    PLATFORMS.map(p => ({ label: p.name, value: p.id,
      note: feeOf(p.id) ? `수수료 ${feeOf(p.id)}%` : "수수료 없음" })));
  if(!plat) return false;
  const r = await promptSheet("얼마에 파셨어요?", [
    { key:"price", label:"거래 금액", value: cur ? String(cur) : "", placeholder:"180000", inputmode:"numeric", suffix:"원",
      hint: feeOf(plat) ? `${PLAT[plat].name} 수수료 ${feeOf(plat)}%를 뺀 금액이 분석 탭에 쌓여요.`
                        : "수수료가 없어서 그대로 실수령이에요." }], editing ? "고치기" : "판매 완료");
  if(!r) return false;
  it.soldList = String(num(r.price) || "");
  it.soldPlatform = plat;
  if(!editing || !it.soldAt) it.soldAt = now();
  return true;
}

async function moveTo(it, to){
  if(it.status === to) return;
  if(to === "listed" && !it.desc){
    const go = await actionSheet("판매글이 아직 비어 있어요. 그래도 등록으로 옮길까요?", [
      { label:"그래도 옮기기", value:"go" }, { label:"먼저 글 쓰러 가기", value:"write", strong:true }]);
    if(!go) return;
    if(go === "write"){ sheetRef ? sheetRef.body.querySelector("#f-desc")?.focus() : openDetail(it.id, "write"); return; }
  }
  if(to === "sold"){ if(!(await askSold(it, false))) return; }
  if(to === "listed" && !it.listedAt){
    it.listedAt = now(); it.bumpedAt = now();
    if(num(it.price) && !it.priceHistory.length) it.priceHistory.push({ at: now(), price: num(it.price), note:"처음 등록" });
  }
  if(to === "planned"){ it.listedAt = null; it.bumpedAt = null; it.bumps = 0; }
  if(to !== "sold"){ it.soldAt = null; it.soldList = ""; }
  it.status = to;
  await persist(it);
  refreshDetail();
  segment = to;
  toast(`${STAGE[to].name}(으)로 옮겼어요`);
}

async function cutPrice(it){
  const cur = num(it.price);
  if(!cur){ toast("먼저 받고 싶은 금액을 적어주세요."); openDetail(it.id); return; }
  const opts = [5,10,15].map(p => {
    const v = roundTo(cur * (1 - p/100), 1000);
    return { label:`${p}% 내리기 → ${won(v)}원`, value:String(v),
             note:`당근 ${won(listPriceFor(v,"danggn"))}원 · 번개 ${won(listPriceFor(v,"bunjang"))}원` };
  });
  opts.push({ label:"직접 입력", value:"custom" });
  const pick = await actionSheet(`지금 ${won(cur)}원이에요. 얼마로 내릴까요?`, opts);
  if(!pick) return;

  let v;
  if(pick === "custom"){
    const r = await promptSheet("새 가격", [
      { key:"price", label:"받고 싶은 돈", value:String(cur), inputmode:"numeric", suffix:"원",
        hint:"플랫폼 게시가는 이 금액에서 수수료를 얹어 다시 계산돼요." }], "내리기");
    if(!r) return;
    v = num(r.price);
  }else v = num(pick);
  if(!v) return;

  it.price = String(v);
  it.priceHistory.push({ at: now(), price: v, note: v < cur ? "가격 내림" : "가격 바꿈" });
  it.bumpedAt = now(); it.bumps = (it.bumps||0)+1;   // 가격 수정은 보통 끌올 효과가 있음
  await persist(it);
  refreshDetail();
  toast(`${won(cur)} → ${won(v)}원으로 내렸어요`);
}

  const floor = num(it.price) ? `\n내가 받아야 하는 최소 금액은 ${won(it.price)}원 수준입니다.` : "";
  const d = await ai(null, () => sampleFn.json(
    `당신은 중고거래 판매자를 대신해 구매자에게 보낼 답장을 써주는 도우미입니다.

[내가 파는 물건]
${briefText(it)}${floor}

[구매자가 보낸 말]
${r.msg}

톤이 다른 답장 3개를 제안하세요. 아래 JSON 배열 하나로만 답하세요:
[{"label":"짧은 이름표(예: 정중히 거절)","text":"실제로 보낼 문장"}]
- 각 답장은 2~4문장. 편한 존댓말("~해요" 체). 비굴하지도, 퉁명스럽지도 않게.
- 가격 얘기라면 하나는 거절, 하나는 소폭 조정, 하나는 조건부 수락처럼 서로 다른 선택지를 주세요.
- ${NO_INVENT} 없는 사양이나 없는 구성품을 약속하지 마세요.`, { modelTier:"default", cache:false }));

  if(!Array.isArray(d) || !d.length){
    s.body.innerHTML = `<div class="aicard" style="margin-top:14px">답장을 만들지 못했어요. 다시 시도해 주세요.</div>`;
    return;
  }
  s.body.innerHTML = d.slice(0,3).map((x,i) => `<div class="aicard" style="margin-top:${i?10:14}px">
    <h4>${esc(x.label || "답장 " + (i+1))}</h4>
    <div style="white-space:pre-wrap">${esc(x.text || "")}</div>
    <div style="margin-top:10px"><button class="btn sm tint" data-cp="${i}">복사</button></div></div>`).join("")
    + `<div class="hint">그대로 보내도 되고, 고쳐 보내도 돼요.</div>`;
  s.body.querySelectorAll("[data-cp]").forEach(b =>
    b.addEventListener("click", () => copyText(d[+b.dataset.cp].text || "")));
}

/* ===================== 백업 ===================== */
async function backup(btn){
  if(storeState !== "ready"){ toast("목록을 다 불러온 뒤에 받아주세요."); return; }
  if(!items.length){ toast("백업할 물건이 없어요."); return; }
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const payload = JSON.stringify({
    savedAt: new Date().toISOString(), app: "중고 정리함", version: 1,
    settings: cfg, items,
  }, null, 2);

  if(downloads){
    const orig = btn.innerHTML;
    btn.innerHTML = `<span class="spin"></span> 준비 중…`; btn.disabled = true;
    try{
      await downloads.save({ filename: `중고정리함_백업_${stamp}.json`, data: payload });
      toast(`물건 ${items.length}개를 백업했어요`);
    }catch(e){
      if(e && e.code !== "declined") toast("백업 파일을 저장하지 못했어요.");
    }finally{ btn.innerHTML = orig; btn.disabled = false; }
    return;
  }
  // 내려받기가 막힌 화면에서는 복사해서 어디든 붙여넣을 수 있게
  const ok = await copyText(payload);
  if(ok) toast("백업 내용을 복사했어요. 메모장에 붙여넣어 두세요.");
}
