  <!-- 손잡이 -->
  <circle cx="228" cy="282" r="12" fill="#d3a166" stroke="#6b4a22" stroke-width="8"/>
  <circle cx="284" cy="282" r="12" fill="#d3a166" stroke="#6b4a22" stroke-width="8"/>

