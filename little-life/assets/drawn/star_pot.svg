<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pot" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fdf2e0"/>
      <stop offset="0.6" stop-color="#f5e2c4"/>
      <stop offset="1" stop-color="#e2c396"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbe6a0"/>
      <stop offset="1" stop-color="#efc45f"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5a86"/>
      <stop offset="1" stop-color="#4c4066"/>
    </linearGradient>
  </defs>

  <!-- 줄기 -->
  <g stroke="#5f7a4a" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M256 330 q-6 -70 -2 -110"/>
    <path d="M254 268 q-42 -18 -66 -50"/>
    <path d="M254 250 q44 -20 70 -54"/>
  </g>

  <!-- 별 잎 -->
  <g fill="url(#leaf)" stroke="#6b4a22" stroke-width="9" stroke-linejoin="round">
    <path d="M254 96 l22 46 l50 7 l-36 35 l9 50 l-45 -24 l-45 24 l9 -50 l-36 -35 l50 -7 Z"/>
    <path d="M180 172 l16 34 l38 5 l-27 26 l6 37 l-33 -18 l-33 18 l6 -37 l-27 -26 l38 -5 Z"/>
    <path d="M332 162 l16 34 l38 5 l-27 26 l6 37 l-33 -18 l-33 18 l6 -37 l-27 -26 l38 -5 Z"/>
  </g>

  <!-- 별가루 -->
  <g fill="#fff2c2" stroke="#6b4a22" stroke-width="6">
    <circle cx="146" cy="252" r="9"/>
    <circle cx="384" cy="264" r="8"/>
    <circle cx="200" cy="120" r="7"/>
  </g>

  <!-- 화분 -->
  <g stroke="#6b4a22" stroke-width="11" stroke-linejoin="round">
    <path d="M164 322 h184 q12 0 12 14 v18 q0 14 -12 14 h-184 q-12 0 -12 -14 v-18 q0 -14 12 -14 Z"
          fill="url(#pot)"/>
    <path d="M170 368 h172 l-20 76 q-3 14 -18 14 h-96 q-15 0 -18 -14 Z" fill="url(#pot)"/>
  </g>

  <!-- 흙 -->
  <path d="M176 330 q80 -12 160 0 q6 12 -6 14 q-74 10 -148 0 q-12 -2 -6 -14 Z" fill="url(#soil)"/>

  <!-- 화분 광 -->
  <path d="M196 388 q-6 34 -2 56" stroke="#fffaf0" stroke-width="12" fill="none"
        stroke-linecap="round" opacity="0.8"/>
</svg>
