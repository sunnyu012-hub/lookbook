<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chest" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f0dcc0"/>
      <stop offset="0.6" stop-color="#e2c49e"/>
      <stop offset="1" stop-color="#caa478"/>
    </linearGradient>
    <linearGradient id="dr" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f7e9d1"/>
      <stop offset="1" stop-color="#e7d0ac"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="1" stop-color="#f6d67e"/>
    </linearGradient>
  </defs>

  <g stroke="#5c3d1c" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- 몸통 -->
    <path d="M136 122 h240 q12 0 12 12 v272 q0 12 -12 12 h-240 q-12 0 -12 -12 v-272 q0 -12 12 -12 Z"
          fill="url(#chest)"/>

    <!-- 서랍 (위 두 칸은 닫혀 있다) -->
    <path d="M160 148 h192 v66 h-192 Z" fill="url(#dr)"/>
    <path d="M160 228 h192 v66 h-192 Z" fill="url(#dr)"/>

    <!-- 살짝 열린 서랍 -->
    <path d="M144 308 h208 q10 0 10 10 v58 q0 10 -10 10 h-208 q-10 0 -10 -10 v-58 q0 -10 10 -10 Z"
          fill="url(#dr)"/>

    <!-- 다리 -->
    <path d="M158 418 v30 M354 418 v30" stroke-width="17"/>
  </g>

  <!-- 열린 틈에서 새는 빛 -->
  <path d="M150 306 h212 l-6 -14 h-200 Z" fill="url(#glow)" stroke="#5c3d1c"
        stroke-width="8" stroke-linejoin="round"/>

  <!-- 손잡이 -->
  <g fill="#c98f4e" stroke="#5c3d1c" stroke-width="8">
    <rect x="230" y="172" width="52" height="16" rx="8"/>
    <rect x="230" y="252" width="52" height="16" rx="8"/>
  </g>

  <!-- 열쇠구멍 -->
  <g fill="#5c3d1c">
    <circle cx="256" cy="336" r="11"/>
    <path d="M248 344 h16 l4 22 h-24 Z"/>
  </g>

  <!-- 반짝임 -->
  <path d="M400 254 l9 20 l20 9 l-20 9 l-9 20 l-9 -20 l-20 -9 l20 -9 Z"
        fill="#ffeeb2" stroke="#5c3d1c" stroke-width="7" stroke-linejoin="round"/>
</svg>
