<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#dff0e2">
<meta name="description" content="토닥토닥 숲 — 실패도 시간제한도 없는 작은 정원">
<title>토닥토닥 숲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --ink:#4a4038;
    --ink-soft:#8a7d70;
    --leaf:#7bc47f;
    --leaf-deep:#4f9a63;
    --soil:#c49a6c;
    --soil-deep:#a87f52;
    --heart:#ff9fb2;
    --card:#fffdf7;
    --line:#e8dfcf;
    --sky-1:#dff0e2;
    --sky-2:#fdf6e4;
    --hill-1:#bfe3c2;
    --hill-2:#a5d6ad;
    --hill-3:#8cc79a;
    --tree:#7fbf8c;
    --tree2:#98d0a2;
    --trunk:#bb8f63;
    --shadow:0 6px 0 rgba(0,0,0,.06);
  }
  html[data-time="night"]{
    --ink:#f2ecdf;
    --ink-soft:#b3aec6;
    --card:#2c3552;
    --line:#3e4870;
    --sky-1:#26304f;
    --sky-2:#3b3a5e;
    --hill-1:#2f3d5e;
    --hill-2:#28354f;
    --hill-3:#212c42;
    --soil:#7d6350;
    --soil-deep:#5e4a3c;
    --tree:#26334d;
    --tree2:#2f3f5e;
    --trunk:#38374e;
  }
  html,body{ height:100%; }
  body{
    font-family:'Gaegu', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    color:var(--ink);
    background:var(--sky-2);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #app{
    position:relative; width:100%; max-width:520px; height:100dvh; margin:0 auto;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 62%);
    transition:background .9s ease;
    overflow:hidden;
  }

  /* ---------- 하늘 ---------- */
  #sky{ position:absolute; inset:0; pointer-events:none; }
  .orb{
    position:absolute; top:94px; right:26px; width:56px; height:56px; border-radius:50%;
    transition:transform .9s cubic-bezier(.3,1.4,.5,1), opacity .9s ease;
  }
  .sun{ background:radial-gradient(circle at 35% 35%, #fff3b8, #ffd86b); box-shadow:0 0 34px 12px rgba(255,220,120,.45); }
  .moon{ background:radial-gradient(circle at 65% 35%, #fdfbef, #dcd8f0); box-shadow:0 0 30px 10px rgba(220,220,255,.28); opacity:0; transform:translateY(-90px) scale(.7); }
  html[data-time="night"] .sun{ opacity:0; transform:translateY(-90px) scale(.7); }
  html[data-time="night"] .moon{ opacity:1; transform:none; }
  .cloud{ position:absolute; opacity:.85; transition:opacity .9s ease; }
  html[data-time="night"] .cloud{ opacity:.22; }
  #stars{ position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease; }
  html[data-time="night"] #stars{ opacity:1; }
  .star{ position:absolute; background:#fff; border-radius:50%; animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(.8);} 50%{opacity:1; transform:scale(1.15);} }

  /* ---------- 상단 바 ---------- */
  header{
    position:relative; z-index:6; display:flex; align-items:center; gap:8px;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 6px;
  }
  .title{ font-size:24px; font-weight:700; letter-spacing:-.5px; line-height:1; }
  .title small{ display:block; font-size:13px; font-weight:400; color:var(--ink-soft); letter-spacing:0; }
  .spacer{ flex:1; }
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--card); border:2px solid var(--line); border-radius:999px;
    padding:5px 12px 4px; font-size:19px; font-weight:700; color:var(--ink);
    box-shadow:var(--shadow);
  }
  .pill svg{ width:17px; height:17px; }
  .iconbtn{
    width:40px; height:40px; display:grid; place-items:center; flex:none;
    background:var(--card); border:2px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease;
  }
  .iconbtn:active{ transform:translateY(3px); box-shadow:none; }
  .iconbtn svg{ width:21px; height:21px; }

  /* ---------- 무대 ---------- */
  #stage{ position:relative; z-index:2; flex:1; min-height:0; display:flex; flex-direction:column; }
  #fx{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  #ground{ position:relative; margin-top:auto; }
  .hills{ position:absolute; left:0; right:0; top:-64px; height:calc(100% + 64px); pointer-events:none; }
  #band{ position:relative; height:108px; }
  #forest{ position:absolute; inset:0; pointer-events:none; z-index:3; }
  .friend-far{ position:absolute; animation:stroll 6s ease-in-out infinite; filter:saturate(.85); }
  @keyframes stroll{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-5px) rotate(2deg);} }

  /* 장식 */
  #scenery{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  #scenery svg{ position:absolute; animation:sway 6.5s ease-in-out infinite; transform-origin:bottom center; }
  #decor{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .deco{ position:absolute; animation:sway 4.5s ease-in-out infinite; transform-origin:bottom center; }
  .deco svg{ display:block; }
  @keyframes sway{ 0%,100%{ transform:rotate(-1.5deg);} 50%{ transform:rotate(1.5deg);} }

  /* ---------- 밭 ---------- */
  #garden{
    position:relative; z-index:4;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:2px 4px;
    padding:0 12px 6px; justify-items:center;
  }
  .plot{
    position:relative; width:100%; max-width:106px; aspect-ratio:1/1.06;
    display:flex; align-items:flex-end; justify-content:center;
    cursor:pointer; touch-action:manipulation;
  }
  .mound{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:74%; height:26%; border-radius:50%;
    background:radial-gradient(ellipse at 50% 30%, var(--soil), var(--soil-deep));
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);
    transition:filter .3s ease;
  }
  .plot.empty .mound{ opacity:.42; }
  .plot.thirsty .mound{ filter:brightness(.86) saturate(.8); }
  .plant{ position:relative; z-index:2; margin-bottom:10px; transform-origin:bottom center; pointer-events:none; }
  .plant.grow{ animation:pop .55s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop{ 0%{ transform:scale(.4) translateY(8px);} 60%{ transform:scale(1.12);} 100%{ transform:scale(1);} }
  .breathe{ animation:breathe 3.2s ease-in-out infinite; transform-origin:bottom center; }
  @keyframes breathe{ 0%,100%{ transform:scaleY(1) scaleX(1);} 50%{ transform:scaleY(1.05) scaleX(.97) translateY(-2px);} }
  .plot.pet .plant{ animation:wiggle .5s ease; }
  @keyframes wiggle{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-9deg) scale(1.06);} 75%{transform:rotate(9deg) scale(1.06);} }
  .plot.leaving .plant{ animation:leave 1.1s ease forwards; }
  @keyframes leave{ to{ transform:translateY(-90px) scale(.5) rotate(12deg); opacity:0; } }
  .drop-hint{
    position:absolute; right:8%; bottom:46%;
    animation:bob 1.6s ease-in-out infinite; pointer-events:none;
  }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  .plus{ position:absolute; inset:0; display:grid; place-items:center; font-size:30px; color:var(--ink-soft); opacity:.5; padding-bottom:14px; }
  .ring{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:62%; }
  .ring circle{ fill:none; stroke-width:3.5; stroke-linecap:round; }
  .locked{ opacity:.42; }
  .locked .mound{ background:none; border:3px dashed var(--line); border-radius:20px; width:70%; height:52%; bottom:14px; box-shadow:none; }
  .splash{ position:absolute; inset:0; pointer-events:none; }

  /* ---------- 하단 ---------- */
  footer{
    position:relative; z-index:6; padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);
    display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  .hint{
    font-size:16px; color:var(--ink-soft); text-align:center; min-height:22px; line-height:1.25;
    transition:opacity .25s ease;
  }
  .tools{ display:flex; gap:9px; }
  .tool{
    display:flex; align-items:center; gap:6px; padding:9px 15px 7px;
    background:var(--card); border:2px solid var(--line); border-radius:16px;
    font-family:inherit; font-size:19px; font-weight:700; color:var(--ink);
    box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease;
  }
  .tool:active{ transform:translateY(3px); box-shadow:none; }
  .tool.on{ border-color:var(--leaf); background:color-mix(in srgb, var(--leaf) 16%, var(--card)); }
  .tool svg{ width:22px; height:22px; }

  /* ---------- 토스트 ---------- */
  #toasts{ position:absolute; left:0; right:0; top:92px; z-index:20; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
  .toast{
    background:var(--card); border:2px solid var(--line); border-radius:999px;
    padding:6px 16px 4px; font-size:19px; font-weight:700; box-shadow:var(--shadow);
    animation:toastIn .35s cubic-bezier(.2,1.5,.4,1), toastOut .4s ease 2.1s forwards;
  }
  @keyframes toastIn{ from{ transform:translateY(14px) scale(.85); opacity:0; } }
  @keyframes toastOut{ to{ transform:translateY(-10px); opacity:0; } }
  .float{ position:absolute; z-index:19; font-size:22px; font-weight:700; color:var(--heart); pointer-events:none; animation:floatUp 1s ease forwards; }
  @keyframes floatUp{ to{ transform:translateY(-52px) scale(1.15); opacity:0; } }

  /* ---------- 시트 ---------- */
  .sheet-bg{
    position:fixed; inset:0; z-index:40; background:rgba(40,32,26,.42);
    display:none; align-items:flex-end; justify-content:center;
    backdrop-filter:blur(2px);
  }
  .sheet-bg.open{ display:flex; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0;} }
  .sheet{
    width:100%; max-width:520px; max-height:82dvh; overflow-y:auto; overscroll-behavior:contain;
    background:var(--card); border-radius:26px 26px 0 0; border-top:3px solid var(--line);
    padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);
    animation:up .3s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes up{ from{ transform:translateY(60px); } }
  .sheet h2{ font-size:24px; margin-bottom:2px; }
  .sheet .sub{ font-size:16px; color:var(--ink-soft); margin-bottom:14px; }
  .grab{ width:44px; height:5px; border-radius:99px; background:var(--line); margin:0 auto 12px; }
  .dex{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .dex-cell{
    background:color-mix(in srgb, var(--line) 26%, transparent);
    border:2px solid var(--line); border-radius:18px; padding:8px 4px 7px; text-align:center;
  }
  .dex-cell.got{ background:color-mix(in srgb, var(--leaf) 14%, var(--card)); border-color:color-mix(in srgb, var(--leaf) 45%, var(--line)); }
  .dex-name{ font-size:16px; font-weight:700; line-height:1.1; margin-top:3px; }
  .dex-cnt{ font-size:14px; color:var(--ink-soft); }
  .silhouette{ filter:brightness(0) opacity(.16); }
  html[data-time="night"] .silhouette{ filter:brightness(0) invert(1) opacity(.2); }
  .shop-row{
    display:flex; align-items:center; gap:12px; padding:11px 12px; margin-bottom:9px;
    border:2px solid var(--line); border-radius:18px; background:color-mix(in srgb,var(--line) 14%, transparent);
  }
  .shop-row .ico{ width:54px; height:50px; flex:none; display:grid; place-items:center; }
  .shop-row .ico svg{ max-width:54px; max-height:50px; width:auto; height:auto; }
  .shop-row .txt{ flex:1; min-width:0; }
  .shop-row .nm{ font-size:20px; font-weight:700; line-height:1.15; }
  .shop-row .ds{ font-size:15px; color:var(--ink-soft); line-height:1.2; }
  .buy{
    font-family:inherit; font-size:18px; font-weight:700; color:#fff; background:var(--leaf-deep);
    border:none; border-radius:14px; padding:8px 14px 6px; cursor:pointer; white-space:nowrap;
    box-shadow:0 4px 0 rgba(0,0,0,.12); transition:transform .12s;
  }
  .buy:active{ transform:translateY(3px); box-shadow:none; }
  .buy[disabled]{ background:var(--line); color:var(--ink-soft); box-shadow:none; cursor:default; }
  .buy.done{ background:transparent; color:var(--leaf-deep); box-shadow:none; }
  .note{ font-size:15px; color:var(--ink-soft); text-align:center; margin-top:12px; line-height:1.4; }
  .reduced-ok{ }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sky">
    <div id="stars"></div>
    <div class="orb sun"></div>
    <div class="orb moon"></div>
    <svg class="cloud" style="top:130px; left:-8px; width:116px" viewBox="0 0 120 46" aria-hidden="true">
      <g fill="#fff" opacity=".92"><ellipse cx="38" cy="30" rx="34" ry="16"/><ellipse cx="66" cy="24" rx="26" ry="18"/><ellipse cx="90" cy="32" rx="22" ry="13"/></g>
    </svg>
    <svg class="cloud" style="top:176px; right:-12px; width:88px" viewBox="0 0 120 46" aria-hidden="true">
      <g fill="#fff" opacity=".8"><ellipse cx="38" cy="30" rx="34" ry="16"/><ellipse cx="70" cy="25" rx="28" ry="18"/></g>
    </svg>
  </div>

  <header>
    <div class="title">토닥토닥 숲<small id="tagline">천천히 자라도 괜찮아</small></div>
    <div class="spacer"></div>
    <div class="pill" id="heartPill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.1-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 15.9 12 21 12 21z" fill="#ff9fb2"/></svg>
      <span id="heartCount">0</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="fx"></canvas>
    <div id="ground">
    <svg class="hills" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 92 C 60 58, 110 96, 168 78 C 230 58, 300 94, 400 66 L400 200 L0 200 Z" fill="var(--hill-1)"/>
      <path d="M0 124 C 70 100, 140 132, 210 114 C 280 96, 340 128, 400 110 L400 200 L0 200 Z" fill="var(--hill-2)"/>
      <path d="M0 160 C 80 142, 150 168, 240 152 C 320 138, 360 158, 400 150 L400 200 L0 200 Z" fill="var(--hill-3)"/>
    </svg>
    <div id="band">
      <div id="scenery" aria-hidden="true">
          <svg style="left:20%; bottom:4px; width:54px; animation-delay:0s" viewBox="0 0 60 84"><rect x="26" y="46" width="8" height="34" rx="4" fill="var(--trunk)"/><circle cx="30" cy="30" r="20" fill="var(--tree)"/><circle cx="17" cy="41" r="14" fill="var(--tree2)"/><circle cx="43" cy="41" r="14" fill="var(--tree2)"/><circle cx="30" cy="44" r="15" fill="var(--tree)"/></svg>
          <svg style="left:57%; bottom:10px; width:36px; animation-delay:1.4s" viewBox="0 0 60 84"><rect x="26" y="46" width="8" height="34" rx="4" fill="var(--trunk)"/><circle cx="30" cy="30" r="20" fill="var(--tree)"/><circle cx="17" cy="41" r="14" fill="var(--tree2)"/><circle cx="43" cy="41" r="14" fill="var(--tree2)"/><circle cx="30" cy="44" r="15" fill="var(--tree)"/></svg>
          <svg style="right:9%; bottom:4px; width:48px; animation-delay:0.7s" viewBox="0 0 60 84"><rect x="26" y="46" width="8" height="34" rx="4" fill="var(--trunk)"/><circle cx="30" cy="30" r="20" fill="var(--tree)"/><circle cx="17" cy="41" r="14" fill="var(--tree2)"/><circle cx="43" cy="41" r="14" fill="var(--tree2)"/><circle cx="30" cy="44" r="15" fill="var(--tree)"/></svg>
          <svg style="left:44%; bottom:0; width:42px; animation-delay:0.5s" viewBox="0 0 60 30"><ellipse cx="20" cy="20" rx="17" ry="11" fill="var(--tree2)"/><ellipse cx="38" cy="21" rx="14" ry="9" fill="var(--tree)"/></svg>
          <svg style="right:31%; bottom:2px; width:34px; animation-delay:1.8s" viewBox="0 0 60 30"><ellipse cx="20" cy="20" rx="17" ry="11" fill="var(--tree2)"/><ellipse cx="38" cy="21" rx="14" ry="9" fill="var(--tree)"/></svg>
          <svg style="left:9%;  bottom:0; width:30px; animation-delay:2.4s" viewBox="0 0 60 30"><ellipse cx="20" cy="20" rx="17" ry="11" fill="var(--tree2)"/><ellipse cx="38" cy="21" rx="14" ry="9" fill="var(--tree)"/></svg>
      </div>
      <div id="forest"></div>
      <div id="decor"></div>
    </div>
    <div id="garden"></div>
    </div>
  </div>

  <footer>
    <div class="hint" id="hint">빈 흙을 눌러 씨앗을 심어보세요</div>
    <div class="tools">
      <button class="tool" id="btnDex" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M9 7h7M9 11h5"/></svg>
        도감
      </button>
      <button class="tool" id="btnShop" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.6 10.2A2 2 0 0 1 17.4 21H6.6a2 2 0 0 1-2-1.8L3 9z"/><path d="M8 9V6.5a4 4 0 0 1 8 0V9"/></svg>
        가게
      </button>
      <button class="iconbtn" id="btnTime" type="button" aria-label="낮과 밤"></button>
      <button class="iconbtn" id="btnSound" type="button" aria-label="소리"></button>
    </div>
  </footer>

  <div id="toasts"></div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(() => {
'use strict';

/* ===================== 친구들 ===================== */
// ear: round | long | pointy | flop | fin | none
// deco: leaf | star | mushroom | flower | acorn | drop | snow | none
const SPECIES = [
  { id:'mong',   name:'몽실이',   body:'#f6f1e6', belly:'#ffffff', cheek:'#ffc2cf', ear:'long',   deco:'none',     rare:0, line:'구름을 베고 자는 걸 좋아해요' },
  { id:'dotori', name:'도토리',   body:'#d9a86c', belly:'#f2dcbb', cheek:'#f0a68f', ear:'round',  deco:'acorn',    rare:0, line:'주머니에 늘 뭔가 숨겨둬요' },
  { id:'ikki',   name:'이끼',     body:'#9ed69b', belly:'#e2f4dc', cheek:'#ffb3ae', ear:'none',   deco:'leaf',     rare:0, line:'비 오는 날이 제일 신나요' },
  { id:'ttalgi', name:'딸기곰',   body:'#f2b8bd', belly:'#fde3e4', cheek:'#ff9aab', ear:'round',  deco:'flower',   rare:0, line:'안아주면 딸기 냄새가 나요' },
  { id:'byeol',  name:'별냥이',   body:'#c9c3ee', belly:'#eeebfb', cheek:'#ffb7d0', ear:'pointy', deco:'star',     rare:1, line:'밤이 되면 조금 빛나요' },
  { id:'beoseot',name:'버섯이',   body:'#e8ddc8', belly:'#f7f0e2', cheek:'#f4a7a0', ear:'none',   deco:'mushroom', rare:0, line:'그늘진 자리를 제일 좋아해요' },
  { id:'mulbang',name:'물방울',   body:'#a8d8ec', belly:'#e0f2fa', cheek:'#ffb0bd', ear:'flop',   deco:'drop',     rare:0, line:'첨벙거리는 소리를 흉내내요' },
  { id:'som',    name:'솜사탕',   body:'#fbe2f0', belly:'#ffffff', cheek:'#ffb2c9', ear:'flop',   deco:'none',     rare:0, line:'바람 불면 살짝 떠올라요' },
  { id:'bandi',  name:'반딧사슴', body:'#e7d6a8', belly:'#f7eed3', cheek:'#ffbfae', ear:'pointy', deco:'star',     rare:1, line:'졸리면 꼬리 끝이 깜빡여요' },
  { id:'jogak',  name:'조약돌',   body:'#c3c8cc', belly:'#e5e8ea', cheek:'#ffb6b0', ear:'none',   deco:'leaf',     rare:0, line:'느긋한 게 제일 중요하대요' },
  { id:'noeul',  name:'노을여우', body:'#f3b183', belly:'#ffe4cb', cheek:'#ff9d8f', ear:'pointy', deco:'flower',   rare:1, line:'해질녘에만 노래를 불러요' },
  { id:'nunkkot',name:'눈꽃',     body:'#dfeaf5', belly:'#ffffff', cheek:'#b9d8ee', ear:'fin',    deco:'snow',     rare:1, line:'손을 잡으면 시원해요' },
];
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));

// 받침에 따라 조사를 골라 붙인다
function josa(word, withBatchim, without){
  const c = word.charCodeAt(word.length - 1);
  const has = (c >= 0xac00 && c <= 0xd7a3) ? ((c - 0xac00) % 28) !== 0 : true;
  return word + (has ? withBatchim : without);
}

function ears(t, c, dark){
  if(t==='long')   return `<ellipse cx="24" cy="14" rx="6" ry="14" fill="${c}"/><ellipse cx="40" cy="14" rx="6" ry="14" fill="${c}"/><ellipse cx="24" cy="15" rx="3" ry="9" fill="${dark}" opacity=".45"/><ellipse cx="40" cy="15" rx="3" ry="9" fill="${dark}" opacity=".45"/>`;
  if(t==='round')  return `<circle cx="21" cy="21" r="9" fill="${c}"/><circle cx="43" cy="21" r="9" fill="${c}"/>`;
  if(t==='pointy') return `<path d="M19 27 L21 9 L33 21 Z" fill="${c}"/><path d="M45 27 L43 9 L31 21 Z" fill="${c}"/>`;
  if(t==='flop')   return `<ellipse cx="15" cy="34" rx="7" ry="11" fill="${c}" transform="rotate(-16 15 34)"/><ellipse cx="49" cy="34" rx="7" ry="11" fill="${c}" transform="rotate(16 49 34)"/>`;
  if(t==='fin')    return `<path d="M32 8 q10 6 8 16 q-8-5-16 0 q-2-10 8-16z" fill="${c}"/>`;
  return '';
}
function deco(t){
  switch(t){
    case 'leaf':     return `<path d="M32 10 q11 1 12 12 q-12 2-14-3 q-2-6 2-9z" fill="#7bc47f"/><path d="M32 11 q7 4 11 11" stroke="#4f9a63" stroke-width="1.4" fill="none"/>`;

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt)));
  return '#' + [f(n>>16), f((n>>8)&255), f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function creature(sp, size, opt){

const GROW = [10000, 16000, 22000];         // 씨앗→새싹→봉오리→친구

  { id:'lantern', name:'작은 등불',   cost:20, desc:'밤이 조금 덜 어두워져요',   pos:'left:34%;  bottom:4px;' },

const defaults = () => ({ hearts:0, slots:6, plots:Array(12).fill(null), dex:{}, forest:[], decor:{}, night:false, sound:true, seen:0 });
let S = defaults();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    S = Object.assign(defaults(), d);
    if(!Array.isArray(S.plots) || S.plots.length !== 12) S.plots = Array(12).fill(null);
    S.plots = S.plots.map(p => (p && SP[p.sp] ? p : (p && p.stage !== undefined ? p : null)));
    S.slots = Math.max(6, Math.min(12, S.slots|0));
    S.hearts = Math.max(0, S.hearts|0);
  }catch(e){ /* 저장이 깨졌으면 새 정원에서 시작 */ }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  }, 200);
}

/* ===================== 소리 ===================== */
let actx = null;
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.5];
function tone(freq, dur, type, vol){
  if(!S.sound) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.14, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.5));
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + (dur || 0.5) + 0.05);
  }catch(e){}
}
const note = (i, d) => tone(SCALE[(i|0) % SCALE.length], d || 0.6, 'sine', 0.12);
function chord(idxs){ idxs.forEach((n, k) => setTimeout(() => note(n, 0.9), k * 90)); }

const $ = s => document.querySelector(s);
const garden = $('#garden'), forestEl = $('#forest'), decorEl = $('#decor'), hintEl = $('#hint');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  const box = $('#toasts');
  box.appendChild(el);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2600);
}
function floatText(x, y, txt){
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = txt;
  el.style.left = (x - 14) + 'px'; el.style.top = y + 'px';
  $('#app').appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function rollSpecies(){
  const pool = [];
  SPECIES.forEach(s => { const w = s.rare ? 1 : 3; for(let i = 0; i < w; i++) pool.push(s.id); });
  return pick(pool);
}

/* ===================== 파티클 ===================== */
const cv = $('#fx'), ctx = cv.getContext('2d');
let W = 0, H = 0, motes = [], bursts = [];
function resize(){
  const r = $('#stage').getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(!motes.length) for(let i = 0; i < 26; i++) motes.push(newMote(true));
}
function newMote(any){
  return { x: rnd(0, W), y: any ? rnd(0, H) : H + 10, r: rnd(1.6, 3.6),
           vx: rnd(-.12, .3), vy: rnd(-.28, -.08), ph: rnd(0, 6.28), sp: rnd(.6, 1.6) };
}
function burst(x, y, color, n, up){
  for(let i = 0; i < n; i++){
    bursts.push({ x, y, vx: rnd(-1.6, 1.6), vy: up ? rnd(-2.6, -.8) : rnd(-1.8, .2),
                  r: rnd(2, 4.6), life: 1, color, rot: rnd(0, 6.28) });
  }
}
function frame(t){
  ctx.clearRect(0, 0, W, H);
  const night = S.night;
  motes.forEach((m, i) => {
    m.x += m.vx; m.y += m.vy; m.ph += 0.02 * m.sp;
    m.x += Math.sin(m.ph) * 0.28;
    if(m.y < -12 || m.x < -12 || m.x > W + 12) motes[i] = newMote(false);
    const a = night ? (0.35 + Math.sin(m.ph * 1.6) * 0.35) : 0.42;
    ctx.beginPath();
    if(night){
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 4.5);
      g.addColorStop(0, 'rgba(255,240,170,' + Math.max(0, a) + ')');
      g.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = g; ctx.arc(m.x, m.y, m.r * 4.5, 0, 6.3);
    }else{
      ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      ctx.arc(m.x, m.y, m.r, 0, 6.3);
    }
    ctx.fill();
  });
  for(let i = bursts.length - 1; i >= 0; i--){
    const b = bursts[i];
    b.x += b.vx; b.y += b.vy; b.vy += 0.09; b.life -= 0.018; b.rot += 0.12;
    if(b.life <= 0){ bursts.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = Math.max(0, b.life); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.ellipse(0, 0, b.r, b.r * 0.65, 0, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

/* ===================== 밭 그리기 ===================== */
const nodes = [];
function buildGarden(){
  garden.innerHTML = ''; nodes.length = 0;
  for(let i = 0; i < S.slots; i++){
    const el = document.createElement('div');
    el.className = 'plot'; el.dataset.i = i;
    el.innerHTML = '<div class="mound"></div>';
    bindPlot(el, i);
    garden.appendChild(el);
    nodes.push({ el, key: '' });
  }
  paintAll();
}
function plotKey(p){
  if(!p) return 'empty';
  return p.stage + '|' + (p.thirsty ? 't' : 'g') + '|' + (p.sp || '') + '|' + (S.night ? 'n' : 'd');
}
function paint(i, animate){
  const p = S.plots[i], n = nodes[i];
  if(!n) return;
  const key = plotKey(p);
  if(n.key === key && !animate) return;
  n.key = key;
  const el = n.el;
  el.className = 'plot' + (!p ? ' empty' : '') + (p && p.thirsty ? ' thirsty' : '');
  let inner = '<div class="mound"></div>';
  if(!p){
    inner += '<div class="plus">+</div>';
  }else if(p.stage === 3){
    inner += '<div class="plant breathe' + (animate ? ' grow' : '') + '">' + creature(SP[p.sp], 66, { sleep: S.night }) + '</div>';
  }else{
    const art = p.stage === 0 ? SEED : p.stage === 1 ? SPROUT : bud(p.bud || '#ffc9d6');
    inner += '<div class="plant' + (animate ? ' grow' : '') + (p.thirsty ? '' : ' breathe') + '">' + art + '</div>';
    if(p.thirsty) inner += '<div class="drop-hint">' + DROP_ICON + '</div>';
  }
  el.innerHTML = inner;
}
function paintAll(){ for(let i = 0; i < S.slots; i++) paint(i); }

function paintDecor(){
  decorEl.innerHTML = DECOR.filter(d => S.decor[d.id])

function hint(){
  const ps = S.plots.slice(0, S.slots);

  else if(ps.some(p => p && p.stage === 3)) t = '친구를 쓰다듬어 주세요 (꾹 누르면 배웅)';

/* ===================== 상호작용 ===================== */
function stageXY(el){
  const r = el.getBoundingClientRect(), s = $('#stage').getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
}
function bindPlot(el, i){
  let timer = null, longed = false, downAt = 0;
  const start = () => {
    longed = false; downAt = Date.now();
    const p = S.plots[i];
    if(p && p.stage === 3){
      timer = setTimeout(() => { longed = true; sendOff(i, el); }, 620);
    }
  };
  const end = (e) => {
    clearTimeout(timer);
    if(longed) return;
    if(Date.now() - downAt > 1200) return;
    tap(i, el, e);
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', () => clearTimeout(timer));
  el.addEventListener('pointercancel', () => clearTimeout(timer));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
function tap(i, el, ev){
  const p = S.plots[i];
  const c = stageXY(el);
  if(!p){
    S.plots[i] = { sp: null, stage: 0, thirsty: true, ready: 0, bud: pick(BUD_COLORS), pet: 0 };
    note(0, 0.5);
    burst(c.x, c.y + 16, '#c49a6c', 6, false);
    paint(i, true); hint(); save();
    return;
  }
  if(p.thirsty){
    p.thirsty = false;
    p.ready = Date.now() + GROW[p.stage];
    note(2, 0.45);
    burst(c.x, c.y, '#9ed6ee', 12, false);
    paint(i, false); hint(); save();
    return;
  }
  if(p.stage === 3){
    const now = Date.now();
    if(now - (p.pet || 0) < 700) return;
    p.pet = now;
    S.hearts += 1;
    el.classList.add('pet'); setTimeout(() => el.classList.remove('pet'), 500);
    const r = el.getBoundingClientRect();
    floatText(r.left + r.width / 2, r.top + 8, '♥');
    burst(c.x, c.y - 6, '#ff9fb2', 5, true);
    note(Math.floor(rnd(1, 6)), 0.5);
    paintHud(); save();
    return;
  }
  // 자라는 중
  note(1, 0.35);
  el.querySelector('.plant')?.classList.add('grow');
  setTimeout(() => el.querySelector('.plant')?.classList.remove('grow'), 560);
}
function sendOff(i, el){
  const p = S.plots[i];
  if(!p || p.stage !== 3) return;
  const c = stageXY(el);
  el.classList.add('leaving');
  S.forest.push(p.sp);
  if(S.forest.length > 30) S.forest.shift();
  S.hearts += 3;
  chord([4, 2, 0]);
  burst(c.x, c.y, '#ffe6a1', 10, true);
  const nm = SP[p.sp].name;
  setTimeout(() => {
    S.plots[i] = null;
    el.classList.remove('leaving');
    nodes[i].key = '';
    paint(i, false); paintForest(); paintHud(); save();
  }, 1000);
  toast(josa(nm, '이', '가') + ' 숲으로 갔어요 ♥ +3');
}
function bloom(i){
  const p = S.plots[i];
  p.sp = rollSpecies(); p.stage = 3; p.thirsty = false; p.pet = 0;
  const sp = SP[p.sp];
  S.dex[p.sp] = (S.dex[p.sp] || 0) + 1;
  S.hearts += 5;
  paint(i, true);
  const el = nodes[i].el, c = stageXY(el);
  burst(c.x, c.y - 10, sp.cheek, 16, true);
  burst(c.x, c.y - 10, '#ffe6a1', 10, true);
  chord(sp.rare ? [0, 2, 4, 5] : [0, 2, 4]);
  toast((S.dex[p.sp] === 1 ? '처음 만나요! ' : '') + josa(sp.name, '이', '가') + ' 피어났어요 ♥ +5');
  paintHud(); save();
}

/* ===================== 시간 흐름 ===================== */
function tick(){
  const now = Date.now();
  let changed = false;
  for(let i = 0; i < S.slots; i++){
    const p = S.plots[i];
    if(!p || p.thirsty || p.stage === 3) continue;
    if(now >= p.ready){
      if(p.stage === 2){ bloom(i); }
      else { p.stage += 1; p.thirsty = true; paint(i, true); note(1, 0.4); }
      changed = true;
    }
  }
  if(changed){ hint(); save(); }
}

/* ===================== 시트 ===================== */
const bg = $('#sheetBg'), sheet = $('#sheet');
function openSheet(html){
  sheet.innerHTML = '<div class="grab"></div>' + html;
  bg.classList.add('open');
  sheet.scrollTop = 0;
}
function closeSheet(){ bg.classList.remove('open'); }
bg.addEventListener('click', e => { if(e.target === bg) closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

function dexSheet(){
  const got = SPECIES.filter(s => S.dex[s.id]).length;
  const cells = SPECIES.map(s => {
    const n = S.dex[s.id] || 0;
    if(!n) return '<div class="dex-cell"><div class="silhouette">' + creature(s, 62) + '</div>' +
                  '<div class="dex-name">???</div><div class="dex-cnt">아직 몰라요</div></div>';
    return '<div class="dex-cell got">' + creature(s, 62) +
           '<div class="dex-name">' + s.name + (s.rare ? ' ✦' : '') + '</div>' +
           '<div class="dex-cnt">' + n + '번 만남</div></div>';
  }).join('');
  openSheet('<h2>도감</h2><div class="sub">' + got + ' / ' + SPECIES.length + ' 명의 친구를 만났어요</div>' +
            '<div class="dex">' + cells + '</div>' +
            '<div class="note">' + (got ? SPECIES.filter(s => S.dex[s.id]).slice(-1)[0].line : '씨앗을 심고 물을 주면 친구가 찾아와요') + '</div>');
}
function shopSheet(){
  let rows = '';
  const tier = TIERS.find(t => t.slots > S.slots);
  if(tier){
    const ok = S.hearts >= tier.cost;
    rows += row('<svg viewBox="0 0 44 44" width="42" height="42"><ellipse cx="22" cy="26" rx="17" ry="8" fill="#c49a6c"/><path d="M22 8v10M17 13h10" stroke="#7bc47f" stroke-width="3.4" stroke-linecap="round"/></svg>',
      '자리 넓히기', '흙 세 칸이 더 생겨요 (지금 ' + S.slots + '칸)',
      '<button class="buy" data-buy="slots" ' + (ok ? '' : 'disabled') + '>♥ ' + tier.cost + '</button>');
  }else{
    rows += row('<svg viewBox="0 0 44 44" width="42" height="42"><ellipse cx="22" cy="26" rx="17" ry="8" fill="#c49a6c"/></svg>',
      '자리 넓히기', '정원이 가득 찼어요', '<button class="buy done">완료</button>');
  }
  DECOR.forEach(d => {
    const owned = !!S.decor[d.id];
    const ok = S.hearts >= d.cost;
    rows += row(DECOR_ART[d.id], d.name, d.desc,
      owned ? '<button class="buy done">놓았어요</button>'
            : '<button class="buy" data-buy="' + d.id + '" ' + (ok ? '' : 'disabled') + '>♥ ' + d.cost + '</button>');
  });
  openSheet('<h2>가게</h2><div class="sub">마음 ♥ ' + S.hearts + ' · 쓰다듬으면 모여요</div>' + rows +
            '<div class="note">서두르지 않아도 돼요.<br>여기선 아무것도 시들지 않아요.</div>');
}
function row(ico, nm, ds, btn){
  return '<div class="shop-row"><div class="ico">' + ico + '</div><div class="txt"><div class="nm">' + nm +
         '</div><div class="ds">' + ds + '</div></div>' + btn + '</div>';
}
sheet.addEventListener('click', e => {
  const b = e.target.closest('[data-buy]');
  if(!b) return;
  const id = b.dataset.buy;
  if(id === 'slots'){
    const tier = TIERS.find(t => t.slots > S.slots);
    if(!tier || S.hearts < tier.cost) return;
    S.hearts -= tier.cost; S.slots = tier.slots;
    buildGarden(); paintHud(); save(); chord([0, 3, 5]);
    toast('정원이 넓어졌어요');
  }else{
    const d = DECOR.find(x => x.id === id);
    if(!d || S.decor[d.id] || S.hearts < d.cost) return;
    S.hearts -= d.cost; S.decor[d.id] = 1;
    paintDecor(); paintHud(); save(); chord([2, 4]);
    toast(josa(d.name, '을', '를') + ' 놓았어요');
  }
  shopSheet();
});

/* ===================== 버튼 ===================== */
$('#btnDex').addEventListener('click', () => { note(3, 0.4); dexSheet(); });
$('#btnShop').addEventListener('click', () => { note(2, 0.4); shopSheet(); });
$('#btnTime').addEventListener('click', () => {
  S.night = !S.night;
  paintHud(); paintAll(); paintForest(); save();
  $('#tagline').textContent = S.night ? '오늘도 수고했어요' : '천천히 자라도 괜찮아';
  note(S.night ? 0 : 4, 0.8);
});
$('#btnSound').addEventListener('click', () => {
  S.sound = !S.sound; paintHud(); save();
  if(S.sound) note(4, 0.5);
});
$('#heartPill').addEventListener('click', () => { note(5, 0.5); toast('마음 ♥ ' + S.hearts); });

/* ===================== 별 ===================== */
(function stars(){
  const box = $('#stars');
  let html = '';
  for(let i = 0; i < 40; i++){
    const s = rnd(1.4, 3);
    html += '<div class="star" style="left:' + rnd(1, 98).toFixed(1) + '%; top:' + rnd(2, 46).toFixed(1) +
            '%; width:' + s.toFixed(1) + 'px; height:' + s.toFixed(1) + 'px; animation-delay:' + rnd(0, 3).toFixed(1) + 's"></div>';
  }
  box.innerHTML = html;
})();

/* ===================== 시작 ===================== */
load();
paintHud();
buildGarden();
paintDecor();
paintForest();
resize();
requestAnimationFrame(frame);
setInterval(tick, 500);
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ resize(); tick(); paintAll(); } });
tick();

if(!S.seen){
  S.seen = 1; save();
  setTimeout(() => toast('어서 오세요 · 여기선 아무것도 실패하지 않아요'), 600);
}else{
  const grown = S.plots.slice(0, S.slots).filter(p => p && p.stage === 3).length;
  if(grown) setTimeout(() => toast('친구들이 기다리고 있었어요'), 600);
}
})();
</script>
</body>
</html>
