<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    /* 디자인 토큰 — 색은 여기서만 정의한다 */
    --bg:#FCFAF8; --card:#FFFFFF; --thumb:#F3EFEC; --ink:#292525; --ink-2:#5C5654; --muted:#9B9491;
    --line:#EDE7E4; --pink:#E9A0B0; --pink-soft:#F8E8EC; --pink-ink:#C97F90; --lav:#E6E0EF;
    /* 아래 셋은 옛 이름 유지(참조가 많음). 포인트는 전부 핑크 계열로 통일. */
    --mint:#E9A0B0; --blue:#5C5654; --gold:#C9A227; --danger:#C97A7A;
    /* 그림자는 최소화하고 1px 테두리를 우선 쓴다 */
    --shadow:0 2px 10px rgba(41,37,37,.05); --shadow-sm:0 1px 4px rgba(41,37,37,.04);
    --r:16px; --r-sm:14px;      /* 카드 16 · 입력/행 14 */
    --sp:8px;                    /* 8px 기반 간격 */
    --pad:20px;                  /* 화면 좌우 여백 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  img{display:block}
  body{
    font-family:"Pretendard Variable",Pretendard,"SUIT",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Roboto","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.5; letter-spacing:-.01em;
    min-height:100vh; min-height:100dvh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;   /* 브라우저 기본 당겨서새로고침(페이지 리로드) 대신 앱 것을 쓴다 */
  }
  /* 공통 헤더 (CoupleHeader) — 낮고 조용하게, 콘텐츠가 위에서부터 보이도록 */
  header{position:sticky; top:0; z-index:10; background:var(--bg); display:flex; align-items:center;
    justify-content:space-between; gap:10px; padding:calc(8px + env(safe-area-inset-top)) var(--pad) 6px;
    max-width:680px; margin:0 auto;}
  .ch-couple{display:flex; align-items:center; gap:8px; min-width:0}
  .ch-avs{display:inline-flex; flex:none}
  .ch-av{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--bg); background:var(--pink-soft);
    color:var(--pink-ink); font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center;
    background-size:cover; background-position:center}
  .ch-av.a2{margin-left:-9px; background-color:var(--lav); color:#6E6484}
  .ch-names{font-size:14px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ch-heart{font-style:normal; color:var(--pink); margin:0 3px; font-size:12px}
  .ch-dday{font-size:13px; font-weight:700; color:var(--pink); flex:none}
  .ch-acts{display:flex; align-items:center; gap:2px; flex:none}
  .iconbtn{background:none; border:none; padding:10px; cursor:pointer; color:var(--ink-2); line-height:0;
    min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center}
  .iconbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  main{padding:0 var(--pad) 26px; max-width:680px; margin:0 auto; animation:fade .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @keyframes pop{from{opacity:0; transform:scale(.9)}to{opacity:1; transform:none}}
  /* 페이지 제목 (PageTitle) — 제목·개수는 왼쪽, 추가 CTA는 오른쪽 */
  .phead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:4px 0 12px}
  .phead .pleft{display:flex; align-items:baseline; gap:8px; min-width:0}
  .ptitle{font-weight:600; font-size:22px; line-height:1.2; margin:0; letter-spacing:-.02em}
  .pcount{font-size:13px; color:var(--muted); font-weight:400; flex:none}
  .padd{background:none; border:none; color:var(--pink); font-size:14px; font-weight:600; cursor:pointer;
    padding:10px 0 10px 10px; min-height:44px; flex:none; font-family:inherit}
  /* 개인 영역 라벨 (PrivateSpaceLabel) */
  .privlbl{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:-4px 0 14px}
  .privlbl svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  /* 안내 한 줄 */
  .softnote{font-size:12px; color:var(--muted); margin:-4px 0 14px}
  .softnote .hh{color:var(--pink)}
  /* 파트너 전환 탭 (PartnerTabs) — 선택 탭 아래 작은 핑크 리본 */
  .ptabs{display:flex; gap:20px; border-bottom:1px solid var(--line); margin:0 0 14px}
  .ptab{background:none; border:none; padding:8px 0 12px; font-size:14px; font-weight:500; color:var(--muted);
    cursor:pointer; position:relative; font-family:inherit; min-height:44px}
  .ptab.on{color:var(--ink); font-weight:600}
  .ptab.on::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--pink); border-radius:2px}
  .ptab.on::before{content:''; position:absolute; left:50%; bottom:-5px; width:8px; height:8px; margin-left:-4px;
    background:var(--pink); transform:rotate(45deg); border-radius:1.5px}
  /* 여러 장 추가 + AI 자동완성 (SmartImportRow) */
  .smartrow{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--pink-soft);
    border:1px solid #F0DCE1; border-radius:var(--r); padding:12px 14px; margin-bottom:14px; cursor:pointer; font-family:inherit; min-height:44px}
  .smartrow .si-ic{width:34px; height:34px; border-radius:11px; background:#fff; display:flex; align-items:center; justify-content:center; flex:none; color:var(--pink-ink)}
  .smartrow .si-ic svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  .smartrow .si-tx{flex:1; min-width:0}
  .smartrow b{display:block; font-size:14px; font-weight:600; color:var(--ink)}
  .smartrow i{display:block; font-style:normal; font-size:12px; color:var(--pink-ink); margin-top:2px}
  .smartrow .si-ar{color:var(--pink-ink); font-size:15px; flex:none}
  /* 필터 (FilterTabs) */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .fpill{display:inline-flex; align-items:center; gap:5px; background:var(--card); border:1px solid var(--line);
    color:var(--ink-2); padding:8px 12px; border-radius:12px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; min-height:36px}
  .fpill.on{background:var(--pink-soft); border-color:#F0DCE1; color:var(--pink-ink); font-weight:600}
  .fpill .car{font-size:9px; opacity:.6}
  .fclear{background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; padding:8px 4px; font-family:inherit}
  /* 옷장 마스코트 — 말풍선 대신 조용한 한 줄 */
  .mascot{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); background:var(--card);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 14px; margin-bottom:14px; cursor:pointer; min-height:44px}
  .mascot .mh{color:var(--pink); flex:none}
  /* section header */
  .sec{display:flex; align-items:baseline; justify-content:space-between; margin:8px 0 14px}
  .sec h2{font-size:20px; font-weight:700; margin:0}
  .seeall{background:none; border:none; color:var(--blue); font-size:15px; font-weight:500; cursor:pointer}
  .backlink{background:none; border:none; color:var(--blue); font-size:16px; font-weight:500; cursor:pointer; margin-bottom:10px; padding:0}
  /* nav */
  /* 하단 내비게이션 — 현재 탭만 포인트 핑크, 나머지는 웜그레이 */
  nav{position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(252,250,248,.94);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  nav button{flex:1; background:none; border:none; padding:4px 0; cursor:pointer; color:var(--muted);
    font-size:10px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:4px; min-height:44px; justify-content:center}
  nav button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  nav button.on{color:var(--pink)}
  nav button.on svg{stroke-width:1.7}
  /* grid + cards */
  .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 12px}
  .card{cursor:pointer; position:relative; animation:pop .35s cubic-bezier(.2,.7,.2,1) backwards}
  .card .ph{width:100%; aspect-ratio:3/4; object-fit:cover; background:var(--thumb); border-radius:var(--r); border:1px solid var(--line); transition:transform .18s}
  .card:active .ph{transform:scale(.985)}
  .card.album .ph{aspect-ratio:1/1}
  .card .body{padding:9px 3px 0}
  .card .name{font-size:14px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .card .sub{font-size:12px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:7px; flex-wrap:nowrap; overflow:hidden; white-space:nowrap; min-height:19px}
  .card .sub .tagchip{flex:0 0 auto}
  .badge{font-size:13px; color:var(--muted)}
  .tagchip{font-size:12px; color:var(--ink-2)}
  .swatch{display:inline-block; width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.1); vertical-align:middle}
  .checkmark{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.92); border:1.5px solid var(--pink); color:var(--pink); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; z-index:2}
  .card.selected .checkmark{background:var(--pink); color:#fff}
  .card.selected .ph{outline:3px solid var(--pink); outline-offset:-1px}
  .wbadge{position:absolute; top:8px; left:8px; z-index:2; background:rgba(255,255,255,.94); border:1px solid var(--line);
    color:var(--ink-2); font-size:11px; font-weight:600; padding:3px 8px; border-radius:11px}
  .heart{position:absolute; bottom:10px; right:10px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--pink); box-shadow:0 2px 8px rgba(0,0,0,.13); z-index:2}
  .feature{grid-column:1 / -1}
  .feature .ph{aspect-ratio:4/5}
  .feature .name{font-size:17px}
  /* 접이식 AI 스타일 도우미 (CollapsibleAIStyleAssistant) */
  .aiw{background:var(--pink-soft); border:1px solid #F0DCE1; border-radius:var(--r); margin-bottom:14px; overflow:hidden}
  .aihead{display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; padding:0 14px;
    min-height:56px; cursor:pointer; font-family:inherit; text-align:left; color:inherit}
  .aihead .ai-ic{width:30px; height:30px; flex:none; color:var(--pink-ink); display:flex; align-items:center; justify-content:center}
  .aihead .ai-ic svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  .aihead .ai-tx{flex:1; min-width:0}
  .aihead b{display:block; font-size:14px; font-weight:600; color:var(--ink)}
  .aihead i{display:block; font-style:normal; font-size:12px; color:var(--pink-ink); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .aihead .ai-ar{flex:none; color:var(--pink-ink); font-size:12px; transition:transform .22s ease}
  .aiw.open .ai-ar{transform:rotate(180deg)}
  .aibody{display:grid; grid-template-rows:0fr; transition:grid-template-rows .22s ease}
  .aiw.open .aibody{grid-template-rows:1fr}
  .aibody>div{overflow:hidden}
  .aimenu{display:flex; gap:8px; padding:0 14px 14px}
  .aiitem{flex:1; background:#fff; border:1px solid #F0DCE1; border-radius:12px; padding:11px 6px; font-size:12px;
    font-weight:600; color:var(--ink); cursor:pointer; font-family:inherit; min-height:44px; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:5px; line-height:1.25; text-align:center}
  .aiitem svg{width:17px; height:17px; stroke:var(--pink-ink); fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
  /* 공개 범위 배지 (VisibilityBadge) — 아이콘+글자를 함께 써서 색만으로 구분하지 않는다 */
  .vbadge{position:absolute; top:8px; left:8px; z-index:2; display:inline-flex; align-items:center; gap:4px;
    background:rgba(255,255,255,.94); border:1px solid var(--line); color:var(--muted); border-radius:11px;
    padding:4px 8px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; letter-spacing:-.01em}
  .vbadge svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .vbadge.on{background:var(--pink-soft); border-color:#F0DCE1; color:var(--pink-ink)}
  .look-row .vbadge{position:static; margin-left:auto; align-self:center}
  /* 작은 아이콘 컨트롤 행 */
  .ctlrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
  .iconseg{display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:2px}
  .iconseg button{border:none; background:none; padding:8px 10px; border-radius:9px; color:var(--muted); cursor:pointer;
    min-height:36px; display:flex; align-items:center; font-family:inherit}
  .iconseg button svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  .iconseg button.on{background:var(--pink-soft); color:var(--pink-ink)}
  .iconbtn-sm{background:none; border:none; color:var(--muted); font-size:13px; font-weight:500; cursor:pointer;
    padding:8px 2px; min-height:36px; font-family:inherit}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
  }
  /* filter pills */
  .chips{display:flex; gap:9px; overflow-x:auto; padding:2px 0 16px; -webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap; background:var(--card); border:1px solid var(--line); color:var(--ink-2); padding:8px 14px; border-radius:12px; font-size:13px; font-weight:500; cursor:pointer; min-height:36px}
  .chip.on{background:var(--pink-soft); color:var(--pink-ink); border-color:#F0DCE1; font-weight:600}
  /* search + text CTA */
  .search{width:100%; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:12px 16px; font-size:15px;
    color:var(--ink); font-family:inherit; margin-bottom:14px}
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:none; border-color:var(--pink)}
  .textcta{display:inline-block; background:none; border:none; color:var(--ink-2); font-size:14px; font-weight:500; padding:8px 0; margin-bottom:10px; cursor:pointer; font-family:inherit; min-height:40px}
  /* empty */
  .empty-state{text-align:center; color:var(--muted); padding:48px 24px; font-size:13px; line-height:1.8}
  .empty-state .big{font-size:34px; margin-bottom:12px}
  /* week rows */
  .day-row{display:flex; align-items:center; gap:15px; padding:12px; margin-bottom:11px; background:var(--card); border-radius:var(--r-sm); box-shadow:var(--shadow-sm); cursor:pointer}
  .day-row .thumb{width:52px; height:66px; border-radius:11px; background:var(--thumb) center/cover no-repeat; flex:none; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:20px; font-weight:300}
  .day-row .info{flex:1; min-width:0}
  .day-row .dlabel{font-weight:700; font-size:16px}
  .day-row .dsub{font-size:13px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .day-row.today{outline:2px solid var(--pink); outline-offset:0}
  .day-row.today .dlabel{color:var(--pink-ink)}
  /* calendar */
  .navrow{display:flex; align-items:center; justify-content:space-between; margin:2px 0 16px}
  .navrow button{background:var(--card); border:1px solid var(--line); border-radius:12px; width:44px; height:44px; font-size:17px; color:var(--ink-2); cursor:pointer; font-family:inherit}
  .navrow .title{font-weight:600; font-size:16px}
  .cal-head{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--muted); margin-bottom:8px; font-weight:500}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .cell{aspect-ratio:3/4; border-radius:10px; background:var(--card); border:1px solid var(--line); overflow:hidden; position:relative; cursor:pointer}
  .cell.blank{background:none; border:none; cursor:default}
  .cell .cimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .cell .cnum{position:absolute; top:3px; left:5px; font-size:10px; color:var(--muted); font-weight:600}
  .cell.has .cnum{color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .cell{padding:0; font-family:inherit}
  .cell.today .cnum{color:var(--pink-ink); font-weight:700}
  .cell.sel{border-color:var(--pink); border-width:2px; background:var(--pink-soft)}
  .cell .cwx{position:absolute; bottom:3px; left:0; right:0; text-align:center; font-size:9px; color:var(--muted); line-height:1.1}
  .cell .cwx em{display:block; font-style:normal; font-size:9px}
  /* 캘린더 선택 날짜 상세 */
  .mdet{margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px}

<script>
/* ---------------- storage (Supabase cloud) ---------------- */
const SB_URL='https://brkpvwuictvdnqyojjkg.supabase.co';
const SB_KEY='sb_publishable_YGl42hSSGKCS8ulowQJBdQ_6Vp2ABJM';
let sb=null, HH=null, MYUID=null, PARTNER=null;   // supabase client, 커플 household id, 내 user id, 남친 user id
const _TBL={items:'items',looks:'looks',wishlist:'wishlist',days:'days'};
// all()은 "내 것"만 반환 (items/looks는 user_id로 필터). 남친 데이터는 loadPartner()로 따로.
async function all(store){const t=_TBL[store];if(!t)return [];
  const sel=(t==='looks')?'user_id,shared,data':(t==='items')?'user_id,data':'data';
  const {data,error}=await sb.from(t).select(sel);if(error)throw error;
  let rows=data;
  if(t==='items'||t==='looks')rows=rows.filter(r=>r.user_id===MYUID);
  return rows.map(r=>(t==='looks')?{...r.data,shared:!!r.shared}:r.data);}
async function getOne(store,id){const t=_TBL[store];if(!t)return null;const {data,error}=await sb.from(t).select('data').eq('id',id).limit(1);if(error)throw error;return data[0]?data[0].data:null;}
async function put(store,obj){const t=_TBL[store];if(!t)return obj;
  let row;
  if(t==='days')row={id:obj.id,user_id:MYUID,data:obj};
  else if(t==='wishlist')row={id:obj.id,user_id:MYUID,data:obj};
  else if(t==='looks')row={id:obj.id,user_id:MYUID,household_id:HH,shared:!!obj.shared,data:obj};
  else row={id:obj.id,user_id:MYUID,household_id:HH,data:obj};
  const {error}=await sb.from(t).upsert(row);if(error)throw error;return obj;}
async function del(store,id){const t=_TBL[store];if(!t)return;const {error}=await sb.from(t).delete().eq('id',id);if(error)throw error;}
// 남친 데이터 로드: 옷장 전체 + 공유한 룩만 (RLS가 자동 필터)
async function loadPartner(){
  if(!PARTNER){state.partnerItems=[];state.partnerLooks=[];return;}
  const [it,lo]=await Promise.all([sb.from('items').select('user_id,data'),sb.from('looks').select('user_id,shared,data')]);
  state.partnerItems=(it.data||[]).filter(r=>r.user_id===PARTNER).map(r=>r.data);
  state.partnerLooks=(lo.data||[]).filter(r=>r.user_id===PARTNER&&r.shared).map(r=>r.data);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------------- images ---------------- */
function loadViaURL(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img.onerror(디코드불가)'));};im.src=u;});}
async function shrink(file,max=1100,q=.82){
  let img;
  try{img=await Promise.race([createImageBitmap(file),new Promise((_,j)=>setTimeout(()=>j(new Error('CIB타임아웃')),8000))]);}
  catch(e){try{img=await loadViaURL(file);}catch(e2){throw new Error('디코드실패(CIB:'+(e&&e.message||e)+' / URL:'+(e2&&e2.message||e2)+')');}}
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(!iw||!ih)throw new Error('이미지크기0('+iw+'x'+ih+')');
  const s=Math.min(1,max/Math.max(iw,ih));
  const w=Math.round(iw*s),h=Math.round(ih*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');if(!ctx)throw new Error('canvas ctx 없음');
  try{ctx.drawImage(img,0,0,w,h);}catch(e){throw new Error('drawImage실패: '+(e&&e.message||e));}
  const blob=await new Promise((res)=>c.toBlob(b=>res(b),'image/jpeg',q));
  if(!blob)throw new Error('toBlob→null(용량초과 가능)');
  return blob;
}
// 사진은 Supabase Storage(photos 버킷)에 저장. 경로=household_id/photoId.jpg → 커플이 공유
function photoPath(id){return HH+'/'+id+'.jpg';}
async function storePhoto(id,blob){const {error}=await sb.storage.from('photos').upload(photoPath(id),blob,{upsert:true,contentType:'image/jpeg'});if(error)throw error;return {id};}
async function getPhotoBlob(id){if(!id)return null;const r=await fetch(photoURL(id));if(!r.ok)return null;return await r.blob();}
/* 자동 보정 — 밝기 히스토그램의 양끝을 0~255로 늘려 밝고 선명하게.
   채널별이 아니라 밝기 기준으로 늘린다: 채널별로 하면 색이 틀어져 AI 색 분류가 어긋난다. */
function autoLevels(d){
  const hist=new Uint32Array(256), N=d.length/4;
  for(let i=0;i<d.length;i+=4)hist[(d[i]*77+d[i+1]*150+d[i+2]*29)>>8]++;
  const clip=Math.max(1,Math.round(N*.005));   // 양끝 0.5%는 잡티로 보고 무시
  let lo=0,hi=255,acc=0;
  for(let v=0;v<256;v++){acc+=hist[v];if(acc>clip){lo=v;break;}}
  acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>clip){hi=v;break;}}
  if(hi-lo<24)return;                          // 이미 대비가 충분하거나 단색 → 건드리지 않음
  const lut=new Uint8Array(256),r=hi-lo;
  for(let v=0;v<256;v++)lut[v]=Math.max(0,Math.min(255,Math.round((v-lo)*255/r)));
  for(let i=0;i<d.length;i+=4){
    const R=lut[d[i]],G=lut[d[i+1]],B=lut[d[i+2]];
    const y=(R*77+G*150+B*29)>>8;              // 살짝만 쨍하게(채도 +12%)
    d[i]=Math.max(0,Math.min(255,y+(R-y)*1.12));
    d[i+1]=Math.max(0,Math.min(255,y+(G-y)*1.12));
    d[i+2]=Math.max(0,Math.min(255,y+(B-y)*1.12));
  }
}
/* ----- 사진 편집(회전·크롭·자동보정) — 라이브러리 없이 canvas + CSS transform -----
   여러 장을 한 번에 받아 스와이프/‹›로 넘기며 편집한다. 한 장짜리는 editPhoto()로 감싸 쓴다. */
const CROP_RATIOS=[['3:4',3/4],['1:1',1],['4:5',4/5],['원본',0]];
// 반환: 편집 결과 배열(각 원소 = JPEG blob, 못 읽은 사진은 undefined). 전체 취소면 null.
function editPhotos(files){return new Promise(resolve=>{
  const n=files.length; if(!n)return resolve(null);
  const shot=Array.from({length:n},()=>({ri:0,rot:0,zoom:1,dx:0,dy:0,auto:false}));
  const orig=new Array(n), bad=new Array(n).fill(false);
  let cur=0, iw=0, ih=0;

  const wrap=document.createElement('div');wrap.className='cropwrap';
  wrap.innerHTML=`<div class="cropbox" id="cbox"><img id="cimg" alt=""></div>
    <div class="croptools">
      <div class="croprow">${CROP_RATIOS.map((r,k)=>`<button class="cropbtn${k?'':' on'}" data-ratio="${k}">${r[0]}</button>`).join('')}</div>
      <div class="croprow"><button class="cropbtn" data-rot="-90">↺</button><input type="range" id="czoom" min="1" max="3" step="0.01" value="1"><button class="cropbtn" data-rot="90">↻</button></div>
      <div class="croprow"><button class="cropbtn" id="cauto">✨ 자동보정</button></div>
      ${n>1?`<div class="croprow"><button class="cropbtn" id="cprev">‹</button><span class="cropcount" id="ccount">1 / ${n}</span><button class="cropbtn" id="cnext">›</button></div>`:''}
      <div class="crophint" id="chint"></div>
      <div class="croprow"><button class="cropbtn" id="ccancel">취소</button><button class="cropbtn on" id="cok">${n>1?`완료 (${n}장)`:'확인'}</button></div>
    </div>`;
  document.body.appendChild(wrap);
  const box=wrap.querySelector('#cbox'), img=wrap.querySelector('#cimg');
  const st=()=>shot[cur];
  const dims=()=>st().rot%180?[ih,iw]:[iw,ih];
  // 자를 땐 프레임을 꽉 채우고(cover), '원본'이면 전체가 보이게(contain)
  const base=()=>{const[w,h]=dims(),fw=box.clientWidth,fh=box.clientHeight;
    return CROP_RATIOS[st().ri][1]?Math.max(fw/w,fh/h):Math.min(fw/w,fh/h);};
  function apply(){
    const s0=st(), [w,h]=dims(), r=CROP_RATIOS[s0.ri][1]||w/h;
    // 프레임 크기는 직접 계산한다. flex 안에서 aspect-ratio는 세로가 눌려 비율이 깨짐.
    const aw=Math.min(innerWidth*.92,440), ah=innerHeight*(n>1?.46:.55);
    let bw=aw,bh=bw/r; if(bh>ah){bh=ah;bw=bh*r;}
    box.style.width=Math.round(bw)+'px';box.style.height=Math.round(bh)+'px';
    const fw=box.clientWidth,fh=box.clientHeight,s=base()*s0.zoom;
    const mx=Math.max(0,(w*s-fw)/2),my=Math.max(0,(h*s-fh)/2);   // 프레임 밖으로 못 빠져나가게
    s0.dx=Math.min(mx,Math.max(-mx,s0.dx));s0.dy=Math.min(my,Math.max(-my,s0.dy));
    img.style.cssText=`position:absolute;left:50%;top:50%;width:${iw}px;height:${ih}px;margin-left:${-iw/2}px;margin-top:${-ih/2}px;transform:translate(${s0.dx}px,${s0.dy}px) rotate(${s0.rot}deg) scale(${s})`;
  }
  function syncTools(){
    wrap.querySelectorAll('[data-ratio]').forEach(b=>b.classList.toggle('on',+b.dataset.ratio===st().ri));
    wrap.querySelector('#cauto').classList.toggle('on',st().auto);
    wrap.querySelector('#czoom').value=st().zoom;
    const cc=wrap.querySelector('#ccount'); if(cc)cc.textContent=`${cur+1} / ${n}`;
    wrap.querySelector('#chint').textContent=n>1?'드래그로 위치 · 끝에서 더 밀면 다음 사진':'드래그로 위치, 슬라이더로 확대';
  }
  // 원본을 한 번만 읽어 캐시한다. 폰 사진은 4000px가 넘어 보정이 느리므로 미리 줄인다.
  function load(i){
    if(orig[i]||bad[i])return Promise.resolve();
    return new Promise(done=>{
      const u=URL.createObjectURL(files[i]), im=new Image();
      im.onerror=()=>{bad[i]=true;URL.revokeObjectURL(u);done();};
      im.onload=()=>{
        if(!im.naturalWidth||!im.naturalHeight){bad[i]=true;URL.revokeObjectURL(u);return done();}
        const cap=1400,k=Math.min(1,cap/Math.max(im.naturalWidth,im.naturalHeight));
        const c=document.createElement('canvas');
        c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        orig[i]=c;URL.revokeObjectURL(u);done();
      };
      im.src=u;
    });
  }
  const setSrc=c=>new Promise(r=>{img.onload=r;img.src=c.toDataURL('image/jpeg',.92);});
  // 효과는 매번 원본에서 다시 계산한다(겹겹이 누적되지 않게)
  // 준비가 끝나기 전에 확인을 눌러도 안전하도록 show()를 직렬화한다.
  // (플래그로 조기 반환하면 await show()가 먼저 끝나 크기 0인 캔버스로 저장되던 버그가 있었다)
  let chain=Promise.resolve();
  function show(){chain=chain.then(_show).catch(()=>{});return chain;}
  async function _show(){
    let guard=0;
    for(;;){
      if(++guard>n+2)return;                       // 전부 못 읽는 경우의 안전장치
      const i=cur;
      await load(i);
      if(i!==cur)continue;                         // 그 사이 넘어갔으면 새 사진으로 다시
      if(bad[i]){                                  // 못 읽는 사진은 건너뛴다
        if(bad.every(Boolean))return fin(bad.map(()=>undefined));
        if(n===1)return fin(undefined);
        showToast(`${i+1}번째 사진을 못 읽어 건너뛰어요`);
        cur=i<n-1?i+1:i-1; continue;
      }
      const src=orig[i]; iw=src.width; ih=src.height;
      const c=document.createElement('canvas');c.width=iw;c.height=ih;
      const x=c.getContext('2d');x.drawImage(src,0,0);
      if(st().auto){const im=x.getImageData(0,0,iw,ih);autoLevels(im.data);x.putImageData(im,0,0);}
      await setSrc(c);
      apply();syncTools();
      return;
    }
  }
  function go(d){const t=cur+d; if(t<0||t>=n)return; cur=t; show();}
  // 미리보기와 같은 순서(scale→rotate→translate)로 그려야 결과가 화면과 일치한다
  function renderOne(){
    if(!box.clientWidth||!box.clientHeight)apply();     // 아직 배치 전이면 먼저 크기를 잡는다
    const s0=st(), fw=box.clientWidth, fh=box.clientHeight, k=Math.min(1100/Math.max(fw,fh),4);
    const ow=Math.round(fw*k),oh=Math.round(fh*k);
    const c=document.createElement('canvas');c.width=ow;c.height=oh;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,ow,oh);   // '원본' 비율일 때 생기는 여백
    ctx.translate(ow/2+s0.dx*k,oh/2+s0.dy*k);
    ctx.rotate(s0.rot*Math.PI/180);
    const s=base()*s0.zoom*k;ctx.scale(s,s);
    ctx.drawImage(img,-iw/2,-ih/2);
    return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.82));
  }
  // 지금 보고 있지 않은 사진은 각자의 설정대로 다시 띄워 그린다
  async function renderAll(){
    const out=new Array(n), keep=cur;
    for(let i=0;i<n;i++){
      if(bad[i]){out[i]=undefined;continue;}
      cur=i; await show(); out[i]=await renderOne();
    }
    cur=keep; return out;
  }
  const close=v=>{wrap.remove();resolve(v);};
  const fin=async v=>{close(await v);popNav();};
  pushNav(()=>close(null));                        // 뒤로가기 = 편집 취소

  let drag=null;
  box.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx:st().dx,dy:st().dy,nav:null};box.setPointerCapture(e.pointerId);});
  box.addEventListener('pointermove',e=>{
    if(!drag||drag.nav)return;
    const mx=e.clientX-drag.x, my=e.clientY-drag.y;
    const want=drag.dx+mx;
    st().dx=want; st().dy=drag.dy+my; apply();      // apply()가 프레임 밖으로 안 나가게 잘라준다
    // 끝까지 민 뒤 더 밀면 다음/이전 사진으로 (사진앱과 같은 느낌). 잘려나간 거리로 판단한다.
    const over=want-st().dx;
    if(n>1&&Math.abs(over)>70&&Math.abs(mx)>60&&Math.abs(mx)>Math.abs(my)*1.5)drag.nav=over>0?-1:1;
  });
  box.addEventListener('pointerup',()=>{
    if(!drag)return;
    if(drag.nav)go(drag.nav);
    drag=null;
  });
  box.addEventListener('pointercancel',()=>{drag=null;});
  wrap.querySelector('#czoom').oninput=e=>{st().zoom=+e.target.value;apply();};
  wrap.querySelector('#cauto').onclick=()=>{st().auto=!st().auto;show();};
  if(n>1){wrap.querySelector('#cprev').onclick=()=>go(-1);wrap.querySelector('#cnext').onclick=()=>go(1);}
  wrap.onclick=e=>{const b=e.target.closest('button');if(!b||['cauto','cprev','cnext'].includes(b.id))return;
    if(b.dataset.ratio!==undefined){st().ri=+b.dataset.ratio;st().dx=st().dy=0;syncTools();apply();}
    else if(b.dataset.rot){st().rot=(st().rot+ +b.dataset.rot+360)%360;st().dx=st().dy=0;apply();}
    else if(b.id==='ccancel')fin(null);
    else if(b.id==='cok')fin(show().then(renderAll));};
  show();
});}
// 한 장짜리 — 편집한 blob, 취소=null, 못 읽으면 undefined

/* ----- 옷장 마스코트: 하루 1번 AI 한마디, 유저별(각자 자기 옷장 기준) ----- */
// AI가 대사 대신 형식/지시문을 뱉는 경우를 걸러 유효한 한글 대사 한 줄만 남김
function sanitizeMascot(txt){
  if(!txt)return'';
  const lines=String(txt).replace(/[*#`>_\[\]]/g,'').split('\n');
  for(let ln of lines){
    ln=ln.trim().replace(/^[-•·\d.)\s"'“”]+/,'').replace(/["'“”\s]+$/,'').trim();
    if(!ln||!/[가-힣]/.test(ln))continue;         // 한글 대사만 통과
    if(/constraint|instruction|prompt|output|format|situation|json|제약|형식|출력|규칙|예시|지시|상황|이내|글자|문장|이모지|말투|반말|한국어/i.test(ln))continue;
    return ln.slice(0,45);
  }
  return'';
}
const MASCOT_KEY='mascot2';
// AI가 없거나 실패해도 옷장 데이터로 만드는 대사 (하루 단위로 하나 고정) — 항상 뭔가 말하게
function localMascot(){
  const items=state.myItems||[];const n=items.length;
  const ww=items.map(i=>({i,w:wearOf(i.id)}));
  const sleeping=ww.filter(x=>x.w.count===0||daysSince(x.w.last)>=90);
  const top=ww.filter(x=>x.w.count>0).sort((a,b)=>b.w.count-a.w.count)[0];
  const nm=x=>x&&(x.i.name||x.i.category)||'';
  const pool=[];
  if(n===0)pool.push('첫 옷을 등록해줘! 두근두근 🧺');
  if(sleeping.length)pool.push(`${nm(sleeping[0])} 오랜만에 어때? 🥺`);
  if(top)pool.push(`${nm(top)}, 오늘도 함께할래? 💕`);
  if(typeof PARTNER!=='undefined'&&PARTNER)pool.push(`${PARTNERNAME||'애인'} 오늘 뭐 입었나 궁금해 👀`);
  if(n>=10)pool.push(`옷 ${n}벌… 옷부자다 헤헤 👑`);
  pool.push('오늘은 뭐 입을까? 👗','좋아하는 옷 꺼내 입자! ✨','오늘도 예쁘게 입어봐 🌷');
  const d=new Date();const idx=(d.getFullYear()+d.getMonth()*31+d.getDate())%pool.length;
  return pool[idx];
}
// 둘째(답장) 말풍선 — 그날그날 다른 로컬 문구
function localReply(){
  const pool=['앨범에서 골라봐 ✨','오늘도 예쁘게 입자 🌷','뭐 입을지 같이 골라줄게 👀','거울 앞에서 고민 중? 😆','좋아하는 옷부터 꺼내보자 💕','오늘 룩 기대된다! 🎀','천천히 골라도 돼 🍀'];
  const d=new Date();return pool[(d.getFullYear()+d.getMonth()*31+d.getDate()+3)%pool.length];
}
function mascotCached(){try{const c=JSON.parse(localStorage.getItem(MASCOT_KEY)||'null');return(c&&c.uid===MYUID)?sanitizeMascot(c.text):'';}catch(e){return'';}}
let _mascotBusy=false;
async function refreshMascot(){
  const el=document.getElementById('mascot-bubble');if(!el)return;
  const today=ymd(new Date());let c=null;try{c=JSON.parse(localStorage.getItem(MASCOT_KEY)||'null');}catch(e){}
  if(c&&c.uid===MYUID&&c.date===today&&sanitizeMascot(c.text)){el.textContent=sanitizeMascot(c.text);return;}
  if(!hasAI()||_mascotBusy)return;_mascotBusy=true;
  try{const text=await mascotLine();if(text){const cur=document.getElementById('mascot-bubble');if(cur)cur.textContent=text;localStorage.setItem(MASCOT_KEY,JSON.stringify({date:today,uid:MYUID,text}));}}
  catch(e){}finally{_mascotBusy=false;}
}
// 마스코트를 톡 누르면 즉석에서 새 대사(캐시 갱신)
async function tapMascot(){

    else{el.textContent=prev;showToast('AI가 지금 잠깐 바빠요 🥲 곧 다시!');}}
  catch(e){el.textContent=prev;}

}
async function mascotLine(){
  const items=state.myItems||[];const total=items.length;
  const ww=items.map(i=>({i,w:wearOf(i.id)}));
  const sleeping=ww.filter(x=>x.w.count===0||daysSince(x.w.last)>=90);
  const sleepEx=sleeping.slice(0,2).map(x=>x.i.name||x.i.category).filter(Boolean);
  const top=ww.filter(x=>x.w.count>0).sort((a,b)=>b.w.count-a.w.count)[0];
  const summary=`옷 ${total}벌, 저장한 룩 ${(state.myLooks||[]).length}개. `
    +(total===0?'옷장이 아직 비어있음. ':'')
    +(sleeping.length?`오래 안 입은 옷 ${sleeping.length}벌(예: ${sleepEx.join(', ')||'-'}). `:(total?'옷을 골고루 입는 중. ':''))
    +(top?`제일 자주 입은 옷: ${top.i.name||top.i.category} ${top.w.count}회. `:'')
    +(PARTNER?`${PARTNERNAME||'애인'}이랑 커플 연결됨. `:'');
  const prompt=`옷장 상황: ${summary}\n\n너는 이 옷장에 사는 귀엽고 발랄한 마스코트야. 위 상황에 어울리게, 옷(또는 옷장) 입장에서 주인에게 건네는 사랑스러운 한마디를 지어줘.\n규칙: 한국어로 딱 한 문장, 25자 이내, 이모지 1개 정도, 귀여운 반말 말투. 대사 한 줄만 그대로 출력하고 설명·목록·별표·따옴표·제목은 절대 쓰지 마.`;
  for(const m of GEMINI_MODELS){
    for(let attempt=0;attempt<2;attempt++){
      let res;try{res=await geminiFetch(m,{contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:1.05}});}catch(e){break;}
      if(res.status===404)break;                 // 폐기된 모델 → 다음 모델
      if(res.status===429)break;
      if([500,502,503].includes(res.status)){await new Promise(r=>setTimeout(r,800*(attempt+1)));continue;}
      if(!res.ok)break;
      const data=await res.json();const txt=(((data.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'';
      const clean=sanitizeMascot(txt);if(clean)return clean;
      await new Promise(r=>setTimeout(r,400));    // 200인데 빈 응답 → 한 번 더
    }
  }
  return '';
}

  const isCard=state.lookView!=='single'&&state.lookView!=='list';
  const vv=(v,label,path)=>`<button class="${(v==='card'?isCard:state.lookView===v)?'on':''}" data-action="lookview" data-v="${v}" aria-label="${label}" title="${label}"><svg viewBox="0 0 24 24">${path}</svg></button>`;
  const ctl=`<div class="ctlrow"><div class="iconseg">
      ${vv('single','하나씩 보기','<rect x="6" y="4" width="12" height="16" rx="2"/>')}
      ${vv('card','카드로 보기','<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>')}

function weekSelId(){
  const t=ymd(new Date()), s=ymd(state.week), e=ymd(addDays(state.week,6));
  if(state.weekSel&&state.weekSel>=s&&state.weekSel<=e)return state.weekSel;
  return (t>=s&&t<=e)?t:s;
}
// 날씨 한 줄 제안 — 비/눈/더위/추위만 조용히 알려준다
function weatherTip(wx){
  if(!wx)return null;
  const c=wx.code, pop=wx.pop;
  if((c>=51&&c<=67)||(c>=80&&c<=82)||(pop!=null&&pop>=60))
    return['비가 와요. 부츠 대신 다른 신발은 어때요?','<path d="M7 13.5a4 4 0 0 1 .6-8 5.2 5.2 0 0 1 9.7 1.4A3.5 3.5 0 0 1 17 13.5Z"/><path d="M9 16.5v2M12 16.5v3M15 16.5v2"/>'];
  if((c>=71&&c<=77)||(c>=85&&c<=86))
    return['눈이 와요. 미끄럽지 않은 신발로 골라요.','<path d="M12 4v16M5 8l14 8M19 8 5 16"/>'];
  if(wx.max>=28)return[`오늘 ${wx.max}°까지 올라가요. 얇고 시원하게!`,'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4 12h2M18 12h2M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18"/>'];
  if(wx.min<=4)return[`아침 ${wx.min}°로 쌀쌀해요. 겉옷 하나 챙겨요.`,'<path d="M12 4v16M5 8l14 8M19 8 5 16"/>'];
  return null;
}

/* ---------------- modal helpers ---------------- */
/* 갤럭시 하드웨어 뒤로가기 대응 — SPA라 history 항목이 없어 뒤로가기가 앱을 나가버렸다.
   화면 층(탭·시트·앨범·사진편집)마다 항목을 쌓고, 뒤로가기는 그 층만 닫는다.
   스택이 비면 아무것도 안 쌓이므로 뒤로가기로 앱을 나가는 동작은 그대로 남는다. */
const _nav=[];let _navSkip=false;
function pushNav(close){_nav.push(close);history.pushState({n:_nav.length},'');}
function popNav(){if(_nav.length){_nav.pop();_navSkip=true;history.back();}}  // 앱 안에서 닫았을 때 history 항목도 같이 제거
addEventListener('popstate',()=>{
  if(_navSkip){_navSkip=false;return;}
  const close=_nav.pop();if(close)close();
});
function openSheet(html){
  const root=document.getElementById('modalRoot'),fresh=!root.firstChild;
  root.innerHTML=`<div class="backdrop" data-close="1"><div class="sheet">${html}</div></div>`;
  if(fresh)pushNav(()=>{root.innerHTML='';});   // 리페인트(paint 재호출)로는 안 쌓는다
  hydrate(root);}
function closeSheet(){
  const root=document.getElementById('modalRoot');if(!root.firstChild)return;
  root.innerHTML='';popNav();}

function viewWishlist(){
  const head=pageHead('위시',state.wish.length?`${state.wish.length}개`:'','위시 추가');
  const note=`<div class="softnote">갖고 싶은 것들을 차곡차곡 <span class="hh">♡</span></div>`;
  const top=head+privateLabel()+note;
  if(!state.wish.length)return top+`<div class="empty-state">위시리스트가 비었어요.<br>갖고 싶은 옷을 차곡차곡 모아보세요.</div>`;

  const chips=`<div class="chips"><button class="chip ${!state.wishStatus?'on':''}" data-action="wishstatus" data-s="">전체</button>`+

  let list=state.wish;
  if(state.wishStatus)list=list.filter(w=>(w.status||'want')===state.wishStatus);
  if(state.wishSearch){const q=state.wishSearch.toLowerCase();
    list=list.filter(w=>[w.name||'',w.memo||'',w.link||''].join(' ').toLowerCase().includes(q));}
  // uid()가 시각 기반이라 id 내림차순 = 최근 추가순
  list=[...list].sort((a,b)=>a.id<b.id?1:a.id>b.id?-1:0);
  const sort=`<div class="ctlrow" style="margin-top:-4px"><span class="railh" style="margin:0">${list.length}개</span>
    <span class="iconbtn-sm" aria-hidden="true">최근 추가순</span></div>`;
  const cards=list.map(w=>{const st=wishStatus(w.status);const done=(w.status||'want')==='purchased';
    return `<div class="card" data-action="wishitem" data-id="${w.id}">
    ${done?'<span class="wbadge">구매 완료</span>':''}
    <img class="ph" data-photo="${w.photoId||''}" alt="${esc(w.name||'위시 아이템')}">
    <div class="body"><div class="name">${esc(w.name||'아이템')}</div>

  return top+search+chips+sort+(list.length?`<div class="grid">${cards}</div>`:`<div class="empty-state">조건에 맞는 위시가 없어요.</div>`);
}

/* ----- settings / backup ----- */
function blobToB64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});}
async function exportAll(){
  const data={v:1,items:await all('items'),looks:await all('looks'),days:await all('days'),wishlist:await all('wishlist'),photos:[]};
  const pids=new Set();[...data.items,...data.looks,...data.days,...data.wishlist].forEach(o=>{if(o&&o.photoId)pids.add(o.photoId);});
  for(const pid of pids){const b=await getPhotoBlob(pid);if(b)data.photos.push({id:pid,b64:await blobToB64(b)});}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`룩북백업_${ymd(new Date())}.json`;a.click();
  localStorage.setItem('last_backup',ymd(new Date()));render();
}
async function importAll(file){

/* ----- AI 코디 추천 (Gemini) ----- */
// Lite = 하루 500회 · 가벼움 / Flash = 하루 20회 · 똑똑함.
// 한도 확인: https://aistudio.google.com/rate-limit (모델이 404 나면 여기 목록을 갱신할 것)
const GEMINI_LITE=['gemini-3.5-flash-lite','gemini-3.1-flash-lite'];
const GEMINI_SMART=['gemini-flash-latest','gemini-2.5-flash'];
const GEMINI_MODELS=[...GEMINI_LITE,...GEMINI_SMART];        // 기본(사진 분류·태그): 싼 것 먼저
const GEMINI_MODELS_SMART=[...GEMINI_SMART,...GEMINI_LITE];  // 룩 평가·코디 추천: 똑똑한 것 먼저, 하루 20회 소진되면 Lite로 폴백
const getKey=()=>localStorage.getItem('gemini_key')||'';
// 공유 AI 프록시(Cloudflare Worker): 키를 서버에 숨겨둠 → 개인 키 없어도 AI 사용 가능
const AI_PROXY='https://lookbook-ai-proxy.vercel.app/api/gemini';
const SCRAPE_PROXY=AI_PROXY.replace('/gemini','/scrape');
const hasAI=()=>!!getKey()||!!AI_PROXY;
// 개인 키 있으면 Gemini 직접 호출, 없으면 프록시 경유
// ponytail: 429 맞은 모델은 60초간 호출 안 함(분당 한도 회복 대기).
// 하루 한도면 60초로 안 풀리지만 그때도 모델당 1회로 끝나 폭주는 없음. 정확한 대기시간이 필요하면 응답의 retryDelay를 파싱할 것.
const _cool={};
// ponytail: 최근 60초 안에 AI_RPM회까지만 내보내는 토큰 버킷. 무료 한도(분당 10회) 기준이라
// 유료로 올리거나 한도가 다르면 AI_RPM 숫자만 고치면 된다.
const AI_RPM=15, _hits=[];
async function _slot(){
  for(;;){
    const now=Date.now();
    while(_hits.length&&now-_hits[0]>60000)_hits.shift();
    if(_hits.length<AI_RPM){_hits.push(now);return;}
    await new Promise(r=>setTimeout(r,60000-(now-_hits[0])+50));
  }
}
async function geminiFetch(m,payload,timeoutMs){
  if(Date.now()<(_cool[m]||0))return new Response('{"error":"cooldown"}',{status:429});
  await _slot();                      // 대기는 타임아웃 시작 전에 — 큐 대기가 '응답 지연'으로 오인되지 않게
  const key=getKey();
  const ctrl=new AbortController();
  const to=timeoutMs?setTimeout(()=>ctrl.abort(),timeoutMs):0;
  const signal=ctrl.signal;
  try{
    const res=await(key?fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},signal,body:JSON.stringify(payload)})
                       :fetch(AI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},signal,body:JSON.stringify({model:m,payload})}));
    if(res.status===429)_cool[m]=Date.now()+60000;
    return res;
  }finally{if(to)clearTimeout(to);}
}
function matchIds(names){return(names||[]).map(n=>{const it=state.items.find(i=>i.name===n)||state.items.find(i=>i.name&&n&&i.name.includes(n));return it&&it.id;}).filter(Boolean);}
async function geminiRecommend(situation,models=GEMINI_MODELS_SMART){
  const items=state.items.map(i=>{const sub=i.subcategory?'/'+i.subcategory:'';const mat=(i.materials&&i.materials.length)?' ['+i.materials.join(',')+']':'';const col=(i.colors&&i.colors.length)?' 색:'+i.colors.join('/'):'';return `${i.name} (${i.category}${sub}${mat}${col})`;}).join(', ');
  const prompt=`너는 센스 있는 패션 스타일리스트야. 아래는 사용자 옷장의 옷 목록이야:\n${items}\n\n${situation?`상황/요청: ${situation}\n`:''}이 옷장에 있는 아이템만 조합해서 어울리는 코디 3개를 제안해줘. 반드시 위 목록에 있는 이름만 그대로 사용해. JSON 배열로만 답해(그 외 텍스트 금지). 각 원소 형식: {"name":"코디 이름","items":["아이템 이름", ...],"tags":["상황이나 스타일 태그"],"reason":"왜 어울리는지 한 줄"}`;
  let lastErr='';
  for(const m of models){
    for(let attempt=0;attempt<3;attempt++){
      const res=await geminiFetch(m,{contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.9,responseMimeType:'application/json'}});
      if(res.status===404){lastErr='404 '+m;break;}
      if(res.status===429){lastErr='429 '+m;break;}
      if([500,502,503].includes(res.status)){lastErr=res.status+' '+m;await new Promise(r=>setTimeout(r,900*(attempt+1)));continue;}
      if(!res.ok)throw new Error('API '+res.status+' — '+(await res.text()).slice(0,160));
      const data=await res.json();
      const txt=(((data.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'';
      try{return JSON.parse(txt);}catch(e){return JSON.parse(txt.replace(/```json|```/g,'').trim());}
    }
  }
  throw new Error(lastErr.startsWith('429')?'AI 사용 한도에 걸렸어요. 1분쯤 뒤에 다시 시도해 주세요 ('+lastErr+')':'AI 서버가 잠시 바빠요 ('+lastErr+'). 잠시 후 다시 시도해 주세요');
}
async function geminiVision(photoId,prompt,models=GEMINI_MODELS){
  const pb=await getPhotoBlob(photoId);if(!pb)throw new Error('사진 없음');
  const b64=(await blobToB64(pb)).split(',')[1];
  let lastErr='';
  for(const m of models){
    for(let attempt=0;attempt<3;attempt++){
      let res;
      try{res=await geminiFetch(m,{contents:[{parts:[{inlineData:{mimeType:pb.type||'image/jpeg',data:b64}},{text:prompt}]}],generationConfig:{temperature:.4,responseMimeType:'application/json'}},25000);}
      catch(e){lastErr=(e.name==='AbortError'?'응답 지연':'네트워크')+' '+m;await new Promise(r=>setTimeout(r,600*(attempt+1)));continue;}
      if(res.status===404){lastErr='404 '+m;break;}
      if(res.status===429){lastErr='429 '+m;break;}
      if([500,502,503].includes(res.status)){lastErr=res.status+' '+m;await new Promise(r=>setTimeout(r,900*(attempt+1)));continue;}
      if(!res.ok)throw new Error(res.status+' — '+(await res.text()).slice(0,140));
      const data=await res.json();const txt=(((data.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'';
      try{return JSON.parse(txt);}catch(e){return JSON.parse(txt.replace(/```json|```/g,'').trim());}
    }
  }
  throw new Error(lastErr.startsWith('429')?'AI 사용 한도에 걸렸어요. 1분쯤 뒤에 다시 시도해 주세요 ('+lastErr+')':'AI 서버가 잠시 바빠요 ('+lastErr+'). 잠시 후 다시 시도해 주세요');
}

async function getWeekWeather(){const c=await getGeo();

  if(!r.ok)throw new Error('날씨 조회 실패');const d=await r.json();const map={},t=d.daily.time;

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawCover(ctx,img,x,y,w,h,r){ctx.save();roundRect(ctx,x,y,w,h,r);ctx.clip();const ir=img.width/img.height,tr=w/h;let sw,sh,sx,sy;if(ir>tr){sh=img.height;sw=sh*tr;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=sw/tr;sx=0;sy=(img.height-sh)/2;}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.restore();}

async function shareLook(look){
  const W=1080,H=1350,m=64;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f1f3f2');g.addColorStop(.5,'#e9edee');g.addColorStop(1,'#e0e7ea');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  pics=pics.slice(0,4);
  const top=m+150,gridH=H-top-190;
  if(!pics.length){ctx.fillStyle='#d9e0e4';roundRect(ctx,m,top,W-2*m,gridH,28);ctx.fill();ctx.fillStyle='#9aa6ad';ctx.font='40px sans-serif';ctx.fillText('사진 없음',m+40,top+40);}
  else{const cols=pics.length===1?1:2,rows=Math.ceil(pics.length/cols),gap=18;const cw=(W-2*m-(cols-1)*gap)/cols,ch=(gridH-(rows-1)*gap)/rows;let i=0;for(let r=0;r<rows;r++)for(let cO=0;cO<cols&&i<pics.length;cO++,i++){const img=await loadImg(pics[i]);const x=m+cO*(cw+gap),y=top+r*(ch+gap);if(img)drawCover(ctx,img,x,y,cw,ch,24);else{ctx.fillStyle='#d9e0e4';roundRect(ctx,x,y,cw,ch,24);ctx.fill();}}}

  ctx.fillStyle='#9aa6ad';ctx.font='30px sans-serif';ctx.fillText('내 옷장 룩북',m,H-52);
  const blob=await new Promise(r=>c.toBlob(r,'image/png',.92));

   <div class="ob-lb"><b>가을 데일리</b><div class="ob-tags"><span>데일리룩</span><span>미니멀</span></div></div></div></div>`},

   <div class="ob-wk">${(()=>{const wi={0:'ob3.jpg',1:'ob9.jpg',4:'ob7.jpg'};return ['월','화','수','목','금','토','일'].map((d,i)=>{const f=wi[i];return `<div class="ob-wc ${i===4?'today':''}" ${f?`style="background-image:url('${f}')"`:''}>${f?'':'<u>＋</u>'}<em>${d}</em></div>`;}).join('');})()}</div></div>`},
 {emoji:'💕',title:'커플이 함께 쓰는 옷장',desc:'설정에서 초대코드로 연결하면<br>옷장·룩을 함께 보고 하트·한마디도 남겨요.',

   <div class="ob-rcpt"><div class="ob-rct">OUTFIT RECEIPT</div><div class="ob-rl"><span>자켓</span><span>그레이 블레이저</span></div><div class="ob-rl"><span>신발</span><span>첼시 부츠</span></div><div class="ob-bar"></div></div></div>`},

function showOnboarding(){
  const root=document.getElementById('onboarding');
  const slides=ONBOARDING.map(s=>`<div class="ob-slide"><div class="ob-frame">${s.mock}</div>
    <div class="ob-cap"><div class="ob-emoji">${s.emoji}</div><div class="ob-title">${s.title}</div><div class="ob-desc">${s.desc}</div></div></div>`).join('');
  const dots=ONBOARDING.map((_,i)=>`<span class="ob-dot ${i===0?'on':''}"></span>`).join('');
  root.innerHTML=`<div class="ob-wrap"><button class="ob-skip" data-ob="close">건너뛰기</button>
    <div class="ob-track" id="ob-track">${slides}</div>
    <div class="ob-dots">${dots}</div>
    <button class="ob-start" data-ob="close">시작하기</button></div>`;
  const track=document.getElementById('ob-track');
  track.onscroll=()=>{const i=Math.round(track.scrollLeft/track.clientWidth);[...root.querySelectorAll('.ob-dot')].forEach((d,k)=>d.classList.toggle('on',k===i));};
}

/* 꾸욱 눌러서 선택 — 이미 있는 선택 모드를 그대로 쓴다(새 모드를 만들지 않음) */
let _lpFired=false;
(()=>{
  let timer=null,sx=0,sy=0,card=null,kind='item';
  const clear=()=>{clearTimeout(timer);timer=null;card=null;};
  document.body.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const looks=state.tab==='looks';
    if(looks?(state.lookOwner==='partner'&&PARTNER):(state.tab!=='closet'||state.closetOwner!=='me'))return;
    const c=e.target.closest(looks?'[data-action="look"]':'.card[data-action="item"]');if(!c)return;
    kind=looks?'look':'item';
    card=c;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    timer=setTimeout(()=>{
      if(!card)return;
      if(navigator.vibrate)navigator.vibrate(15);
      state.selectMode=true;state.selectKind=kind;state.selected.add(card.dataset.id);
      _lpFired=true;                       // 손 떼면 따라오는 click은 무시(상세가 열리지 않게)
      render();clear();
    },450);
  },{passive:true});
  document.body.addEventListener('touchmove',e=>{        // 스크롤이면 취소
    if(timer&&(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10))clear();
  },{passive:true});
  ['touchend','touchcancel'].forEach(ev=>document.body.addEventListener(ev,clear));
})();

/* 당겨서 새로고침 */
(()=>{
  const bar=document.createElement('div');bar.className='ptr';bar.textContent='↓ 당겨서 새로고침';
  document.body.appendChild(bar);
  const TH=70; let y0=null,ready=false;
  const busy=()=>document.getElementById('modalRoot').firstChild||document.querySelector('.cropwrap');
  const hide=()=>{bar.style.transition='';bar.style.transform='';};
  addEventListener('touchstart',e=>{y0=(scrollY<=0&&e.touches.length===1&&!busy())?e.touches[0].clientY:null;ready=false;},{passive:true});
  addEventListener('touchmove',e=>{
    if(y0===null)return;
    const dy=e.touches[0].clientY-y0;
    if(dy<=0){hide();ready=false;return;}
    ready=dy>TH;
    bar.style.transition='none';
    bar.style.transform=`translateY(${Math.min(dy,110)}px)`;
    bar.textContent=ready?'놓으면 새로고침 ✨':'↓ 당겨서 새로고침';
  },{passive:true});
  addEventListener('touchend',async()=>{
    if(y0===null)return; y0=null;
    if(!ready){hide();return;}
    ready=false;bar.style.transition='';bar.textContent='새로고침 중…';
    try{await refresh();}catch(err){showToast('새로고침 실패: '+(err.message||err));}
    hide();
  });
})();

/* ---------------- events ---------------- */
document.getElementById('onboarding').addEventListener('click',e=>{if(e.target.closest('[data-ob]')){document.getElementById('onboarding').innerHTML='';localStorage.setItem('onboarded','1');}});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){
  if(b.dataset.tab!==state.tab){const p={t:state.tab};pushNav(()=>{state.tab=p.t;render();});}
  state.tab=b.dataset.tab;state.search='';state.selectMode=false;state.selected.clear();render();}});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.dataset.close)closeSheet();});
document.body.addEventListener('input',e=>{
  if(e.target.id==='wish-search'){state.wishSearch=e.target.value;render().then(()=>{const s=document.getElementById('wish-search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}});}
  else if(e.target.id==='closet-search'){state.search=e.target.value;render().then(()=>{const s=document.getElementById('closet-search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}});}
  else if(e.target.id==='looks-search'){state.lookSearch=e.target.value;render().then(()=>{const s=document.getElementById('looks-search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}});}
});
document.body.addEventListener('click',e=>{
  if(_lpFired){_lpFired=false;return;}          // 꾸욱 누른 뒤 따라오는 click 무시
  const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='add'){state.tab==='closet'?itemForm():state.tab==='wish'?wishForm():lookForm();}
  else if(a==='settings')settings();
  else if(a==='stats')statsSheet();
  else if(a==='airec')aiRecommend();
  else if(a==='mascottap')tapMascot();
  else if(a==='todayoutfit')showToday();
  else if(a==='lookrate')lookRate();
  else if(a==='cat'){state.catFilter=el.dataset.cat||null;render();}
  else if(a==='sortwear'){state.sortWear=!state.sortWear;render();}
  else if(a==='owner'){state.ownerFilter=el.dataset.owner||null;render();}
  else if(a==='aitoggle'){state.aiOpen=!state.aiOpen;render();}
  else if(a==='weekday'){state.weekSel=el.dataset.date;render();}
  else if(a==='monthday'){state.monthSel=el.dataset.date;render();}
  else if(a==='daydel')deleteDay(el.dataset.date);
  else if(a==='closetfilter')closetFilterSheet(el.dataset.k);
  else if(a==='closetclear'){CLOSET_FILTERS.forEach(f=>state[f.k]=null);render();}
  else if(a==='selectmode'){state.selectMode=true;state.selectKind=el.dataset.kind||'item';state.selected.clear();render();}
  else if(a==='cancelselect'){state.selectMode=false;state.selected.clear();render();}
  else if(a==='editselected'){const id=[...state.selected][0];
    const o=state.selectKind==='look'?lookById(id):itemById(id);
    if(o){state.selectMode=false;state.selected.clear();state.selectKind==='look'?lookForm(o):itemForm(o);}}
  else if(a==='moveselected')moveSelected();
  else if(a==='shareselected')shareSelected();
  else if(a==='photoselected')editSelectedPhotos();
  else if(a==='toggleselect'){const id=el.dataset.id;if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);render();}
  else if(a==='deleteselected')deleteSelected();
  else if(a==='bulkadd')bulkAdd();
  else if(a==='dobackup')exportAll();
  else if(a==='dismissbackup'){state.backupDismissed=true;render();}
  else if(a==='lookview'){state.lookView=el.dataset.v;render();}
  else if(a==='lookfilter'){const k=el.dataset.kind;state.favOnly=(k==='fav');state.tagFilter=(k==='tag')?el.dataset.tag:null;render();}
  else if(a==='owner-closet'){state.closetOwner=el.dataset.o;state.search='';state.selectMode=false;state.selected.clear();
    CLOSET_FILTERS.forEach(f=>state[f.k]=null);refresh();}
  else if(a==='owner-look'){state.lookOwner=el.dataset.o;refresh();}
  else if(a==='looklock'){const l=lookById(el.dataset.id);if(l){l.shared=!l.shared;put('looks',l).then(()=>{state.myLooks.forEach(x=>{if(x.id===l.id)x.shared=l.shared;});showToast(l.shared?`💛 ${PARTNERNAME||'상대'}에게 공유했어요`:'🔒 나만 보기로 바꿨어요');render();}).catch(er=>showToast('실패: '+(er.message||er)));}}
  else if(a==='item'){if(state.closetOwner==='partner'){const it=state.partnerItems.find(x=>x.id===el.dataset.id);if(it)itemDetailRO(it);return;}const it=itemById(el.dataset.id);if(it)itemForm(it);}
  else if(a==='look'){if(state.lookOwner==='partner'){const l=state.partnerLooks.find(x=>x.id===el.dataset.id);if(l)lookDetailRO(l);return;}const l=lookById(el.dataset.id);if(l)lookForm(l);}
  else if(a==='wishitem'){const w=state.wish.find(x=>x.id===el.dataset.id);if(w)wishForm(w);}
  else if(a==='wishstatus'){state.wishStatus=el.dataset.s||null;render();}
  else if(a==='day')dayDetail(el.dataset.date);
  else if(a==='weeknav'){state.week=addDays(state.week,+el.dataset.d);render();}
  else if(a==='weekweather')loadWeekWeather();
  else if(a==='monthnav'){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+ +el.dataset.d,1);render();}
});

/* ---------------- auth / boot ---------------- */
function showAuth(){
  let mode='login';
  const r=document.getElementById('authRoot');
  const draw=()=>{r.innerHTML=`<div class="auth-bg"><div class="auth-card">
    <div class="auth-logo">👗</div>
    <h1>내 옷장 룩북</h1>
    <p class="auth-sub">${mode==='login'?'로그인해서 옷장을 열어요':'계정을 만들어 시작해요'}</p>
    ${mode==='signup'?'<input id="au-name" type="text" maxlength="10" placeholder="닉네임 (예: 유링)">':''}
    <input id="au-email" type="email" inputmode="email" autocomplete="email" placeholder="이메일">
    <input id="au-pw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)">
    <button class="btn primary auth-go" id="au-go">${mode==='login'?'로그인':'회원가입'}</button>
    <div id="au-msg" class="auth-msg"></div>
    <button class="auth-toggle" id="au-toggle">${mode==='login'?'계정이 없어요 · 회원가입':'이미 계정이 있어요 · 로그인'}</button>
  </div></div>`;
    const msg=document.getElementById('au-msg');
    document.getElementById('au-toggle').onclick=()=>{mode=mode==='login'?'signup':'login';draw();};
    document.getElementById('au-go').onclick=async()=>{
      const email=document.getElementById('au-email').value.trim();
      const pw=document.getElementById('au-pw').value;
      const nick=mode==='signup'?(document.getElementById('au-name').value.trim()):'';
      if(!email||!pw){msg.textContent='이메일과 비밀번호를 입력해주세요.';return;}
      if(mode==='signup'&&!nick){msg.textContent='닉네임을 입력해주세요.';return;}
      msg.style.color='var(--muted)';msg.textContent='잠시만요…';
      try{
        const {error}=mode==='login'
          ? await sb.auth.signInWithPassword({email,password:pw})
          : await sb.auth.signUp({email,password:pw});
        if(error)throw error;
        await afterLogin(nick);
      }catch(e){msg.style.color='var(--pink)';msg.textContent=(mode==='login'?'로그인 실패: ':'가입 실패: ')+(e.message||e);}
    };
    document.getElementById('au-pw').onkeydown=e=>{if(e.key==='Enter')document.getElementById('au-go').click();};
  };
  draw();
}
async function afterLogin(nickname){
  const {data:{user}}=await sb.auth.getUser(); MYUID=user.id;
  const {data:hh,error}=await sb.rpc('init_profile');
  if(error){alert('프로필 생성 오류: '+error.message);return;}
  HH=hh;
  if(nickname)await sb.from('profiles').update({display_name:nickname}).eq('user_id',MYUID);
  // 같은 커플(household) 멤버들 → 내 이름·남친 이름
  const {data:mates}=await sb.from('profiles').select('user_id,display_name').eq('household_id',HH);
  const me=(mates||[]).find(m=>m.user_id===MYUID);
  const other=(mates||[]).find(m=>m.user_id!==MYUID);
  MYNAME=(me&&me.display_name)||'나';
  PARTNER=other?other.user_id:null;
  PARTNERNAME=(other&&other.display_name)||'';
  const {data:hhrow}=await sb.from('households').select('invite_code').eq('id',HH).single();
  MYCODE=(hhrow&&hhrow.invite_code)||'';
  document.getElementById('authRoot').innerHTML='';
  await refresh();
  if(!localStorage.getItem('onboarded'))setTimeout(showOnboarding,250);
}
async function logout(){await sb.auth.signOut();location.reload();}
async function boot(){
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(session)await afterLogin(); else showAuth();
}
boot();
</script>
