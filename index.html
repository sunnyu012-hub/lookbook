<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbf7f5">
<title>내 옷장 룩북</title>
<style>
  :root{
    --bg:#fbf7f5; --card:#ffffff; --thumb:#f1ecea; --ink:#26221f; --ink-2:#6b6259; --muted:#a89e95;
    --line:#efe7e2; --pink:#ec8aa0; --pink-soft:#fce6ec; --pink-ink:#cf5f7c;
    --mint:#3fc0ad; --blue:#3a86ff; --gold:#e6a94a; --danger:#e5677a;
    --shadow:0 6px 22px rgba(120,90,80,.09); --shadow-sm:0 3px 12px rgba(120,90,80,.07);
    --r:20px; --r-sm:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  img{display:block}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.5; letter-spacing:-.01em;
    min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  header{position:sticky; top:0; z-index:10; background:var(--bg); display:flex; justify-content:flex-end;
    padding:calc(10px + env(safe-area-inset-top)) 18px 2px;}
  .iconbtn{background:none; border:none; padding:6px; cursor:pointer; color:var(--ink-2); line-height:0}
  .iconbtn svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  main{padding:0 18px 26px; max-width:680px; margin:0 auto; animation:fade .4s cubic-bezier(.2,.7,.2,1)}
  @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @keyframes pop{from{opacity:0; transform:scale(.9)}to{opacity:1; transform:none}}
  /* page head (NOVA) */
  .phead{margin:2px 0 16px}
  .add-plus{background:none; border:none; color:var(--mint); font-size:27px; line-height:1; padding:0; margin-bottom:2px; cursor:pointer; font-weight:300; display:block}
  .ptitle{font-weight:800; font-size:32px; line-height:1.05; margin:0; letter-spacing:-.02em}
  .pcount{font-size:14px; color:var(--muted); margin-top:4px; font-weight:500}
  /* section header */
  .sec{display:flex; align-items:baseline; justify-content:space-between; margin:8px 0 14px}
  .sec h2{font-size:20px; font-weight:700; margin:0}
  .seeall{background:none; border:none; color:var(--blue); font-size:15px; font-weight:500; cursor:pointer}
  .backlink{background:none; border:none; color:var(--blue); font-size:16px; font-weight:500; cursor:pointer; margin-bottom:10px; padding:0}
  /* collage bubbles */
  .bubbles{display:flex; flex-direction:column; gap:6px; margin:2px 0 18px}
  .bubble{align-self:flex-start; background:var(--pink); color:#fff; padding:9px 15px; border-radius:19px 19px 19px 5px; font-size:14px; font-weight:500; box-shadow:var(--shadow-sm); max-width:82%}
  .bubble.r{align-self:flex-end; background:var(--card); color:var(--ink); border-radius:19px 19px 5px 19px; box-shadow:var(--shadow-sm)}
  .delivered{align-self:flex-end; font-size:11px; color:var(--muted); margin:1px 4px 0 0}
  /* nav */
  nav{position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(255,255,255,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line);
    display:flex; padding:9px 4px calc(9px + env(safe-area-inset-bottom));}
  nav button{flex:1; background:none; border:none; padding:3px 0; cursor:pointer; color:var(--muted);
    font-size:10px; display:flex; flex-direction:column; align-items:center; gap:5px; transition:color .2s}
  nav button svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  nav button.on{color:var(--ink)}
  /* grid + cards */
  .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 14px}
  .card{cursor:pointer; position:relative; animation:pop .35s cubic-bezier(.2,.7,.2,1) backwards}
  .card .ph{width:100%; aspect-ratio:3/4; object-fit:cover; background:var(--thumb); border-radius:var(--r-sm); box-shadow:var(--shadow-sm); transition:transform .25s}
  .card:active .ph{transform:scale(.97)}
  .card.album .ph{aspect-ratio:1/1}
  .card .body{padding:9px 3px 0}
  .card .name{font-size:15px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .card .sub{font-size:13px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:7px; flex-wrap:nowrap; overflow:hidden; white-space:nowrap; min-height:19px}
  .card .sub .tagchip{flex:0 0 auto}
  .badge{font-size:13px; color:var(--muted)}
  .tagchip{font-size:12px; color:var(--ink-2)}
  .swatch{display:inline-block; width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.1); vertical-align:middle}
  .plus-badge{position:absolute; top:9px; left:9px; width:28px; height:28px; border-radius:50%; background:var(--mint); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:300; box-shadow:0 2px 7px rgba(0,0,0,.16); z-index:2; pointer-events:none}
  .checkmark{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.92); border:1.5px solid var(--pink); color:var(--pink); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; z-index:2}
  .card.selected .checkmark{background:var(--pink); color:#fff}
  .card.selected .ph{outline:3px solid var(--pink); outline-offset:-1px}
  .wbadge{position:absolute; top:9px; left:9px; z-index:2; color:#fff; font-size:11px; font-weight:600; padding:3px 10px; border-radius:12px; box-shadow:0 1px 5px rgba(0,0,0,.14)}
  .heart{position:absolute; bottom:10px; right:10px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--pink); box-shadow:0 2px 8px rgba(0,0,0,.13); z-index:2}
  .feature{grid-column:1 / -1}
  .feature .ph{aspect-ratio:4/5}
  .feature .name{font-size:17px}
  /* filter pills */
  .chips{display:flex; gap:9px; overflow-x:auto; padding:2px 0 16px; -webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap; background:var(--card); border:1px solid var(--line); color:var(--ink-2); padding:8px 15px; border-radius:16px; font-size:13px; font-weight:500; cursor:pointer; box-shadow:var(--shadow-sm)}
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  /* search + text CTA */
  .search{width:100%; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:12px 16px; font-size:15px;
    color:var(--ink); font-family:inherit; margin-bottom:16px; box-shadow:var(--shadow-sm)}
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:none; border-color:var(--pink)}
  .textcta{display:inline-block; background:none; border:none; color:var(--blue); font-size:14px; font-weight:500; padding:2px 0; margin-bottom:14px; cursor:pointer}
  /* empty */
  .empty-state{text-align:center; color:var(--muted); padding:56px 24px; font-size:14px; line-height:1.7}
  .empty-state .big{font-size:40px; margin-bottom:14px}
  /* week rows */
  .day-row{display:flex; align-items:center; gap:15px; padding:12px; margin-bottom:11px; background:var(--card); border-radius:var(--r-sm); box-shadow:var(--shadow-sm); cursor:pointer}
  .day-row .thumb{width:52px; height:66px; border-radius:11px; background:var(--thumb) center/cover no-repeat; flex:none; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:20px; font-weight:300}
  .day-row .info{flex:1; min-width:0}
  .day-row .dlabel{font-weight:700; font-size:16px}
  .day-row .dsub{font-size:13px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .day-row.today{outline:2px solid var(--pink); outline-offset:0}
  .day-row.today .dlabel{color:var(--pink-ink)}
  /* calendar */
  .navrow{display:flex; align-items:center; justify-content:space-between; margin:2px 0 16px}
  .navrow button{background:var(--card); border:1px solid var(--line); border-radius:11px; width:36px; height:36px; font-size:19px; color:var(--ink-2); cursor:pointer; box-shadow:var(--shadow-sm)}
  .navrow .title{font-weight:800; font-size:22px}
  .cal-head{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--muted); margin-bottom:8px; font-weight:500}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .cell{aspect-ratio:3/4; border-radius:9px; background:var(--card); border:1px solid var(--line); overflow:hidden; position:relative; cursor:pointer}
  .cell.blank{background:none; border:none; cursor:default}
  .cell .cimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .cell .cnum{position:absolute; top:3px; left:5px; font-size:10px; color:var(--muted); font-weight:600}
  .cell.has .cnum{color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .cell.today{border-color:var(--pink); border-width:2px}
  /* modal sheet */
  .backdrop{position:fixed; inset:0; background:rgba(38,34,31,.4); z-index:30; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease-out}
  .sheet{background:var(--bg); width:100%; max-width:680px; border-radius:26px 26px 0 0; padding:22px 20px calc(28px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; box-shadow:0 -12px 44px rgba(80,50,45,.18)}
  .sheet h2{font-weight:800; margin:2px 0 20px; font-size:23px}
  .field{margin-bottom:16px}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:7px; font-weight:600}
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:16px; background:var(--card); color:var(--ink); font-family:inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--pink)}
  .field textarea{resize:vertical; min-height:62px}
  .photo-pick{width:100%; aspect-ratio:3/4; max-height:300px; border:1.5px dashed var(--line); border-radius:16px; background:var(--card) center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; cursor:pointer}
  .btnrow{display:flex; gap:10px; margin-top:10px}
  .btn{flex:1; border:none; border-radius:14px; padding:15px; font-size:15px; font-weight:600; cursor:pointer}
  .btn.primary{background:var(--ink); color:#fff}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .btn.danger{background:var(--card); color:var(--danger); border:1px solid var(--line); flex:0 0 auto; padding:15px 18px}
  .stars{display:flex; gap:9px; font-size:27px}
  .stars span{cursor:pointer; color:var(--line)}
  .stars span.on{color:var(--gold)}
  .pick-list{display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto}
  .pick-item{display:flex; align-items:center; gap:13px; padding:9px; background:var(--card); border:1px solid var(--line); border-radius:12px; cursor:pointer}
  .pick-item.sel{border-color:var(--pink); background:var(--pink-soft)}
  .pick-item img{width:40px; height:52px; object-fit:cover; border-radius:9px; background:var(--thumb); flex:none}
  .pick-item .pn{flex:1; font-size:14px; font-weight:500}
  .selgrid{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .selgrid img{width:48px; height:60px; object-fit:cover; border-radius:10px; background:var(--thumb)}
  .hint{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.6}
  .tagwrap{display:flex; flex-wrap:wrap; gap:8px}
  .tagwrap .chip{border:1px solid var(--line); border-radius:14px; padding:8px 13px; color:var(--ink-2); font-size:13px}
  .tagwrap .chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .colorchip .dot{display:inline-block; width:13px; height:13px; border-radius:50%; margin-right:6px; border:1px solid rgba(0,0,0,.12); vertical-align:middle}
  .banner{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--pink-soft); color:var(--pink-ink); border-radius:16px; padding:12px 12px 12px 16px; margin-bottom:16px; font-size:13px; font-weight:500}
  .banner-btn{background:var(--pink-ink); color:#fff; border:none; border-radius:10px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer}
  .banner-x{background:none; border:none; color:var(--pink-ink); font-size:15px; padding:4px 6px; cursor:pointer; opacity:.6}
  #toast{position:fixed; left:0; right:0; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:40; display:flex; justify-content:center; pointer-events:none}
  .toast{pointer-events:auto; display:flex; align-items:center; gap:16px; background:var(--ink); color:#fff; border-radius:14px; padding:13px 18px; font-size:14px; box-shadow:0 8px 28px rgba(0,0,0,.25); max-width:90%}
  .toast-undo{background:none; border:none; color:var(--pink); font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap}
  .statgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:8px}
  .statbox{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 5px; text-align:center; box-shadow:var(--shadow-sm)}
  .statnum{font-size:22px; font-weight:800}
  .statlbl{font-size:11px; color:var(--muted); margin-top:3px}
  .statrow{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
  .statimg{width:38px; height:48px; object-fit:cover; border-radius:9px; background:var(--thumb); flex:none}
  .statname{flex:1; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .statval{font-size:14px; font-weight:700; color:var(--pink-ink)}
  .wk-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .wk-cell{position:relative; aspect-ratio:3/4; border-radius:12px; overflow:hidden; background:var(--card); border:1px solid var(--line); cursor:pointer}
  .wk-cell img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .wk-cell .wk-day{position:absolute; top:7px; left:8px; font-size:11px; font-weight:700; color:var(--muted); z-index:1}
  .wk-cell .wk-num{position:absolute; top:6px; right:8px; font-size:12px; font-weight:700; color:var(--ink-2); z-index:1}
  .wk-cell.has .wk-day, .wk-cell.has .wk-num{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .wk-plus{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#cdc3ba; font-size:30px; font-weight:200}
  .wk-cell.today{border-color:var(--pink); border-width:2px}
  .wk-cell.today .wk-day{color:var(--pink-ink)}
  .wk-wx{position:absolute; bottom:4px; left:0; right:0; text-align:center; font-size:10px; font-weight:700; color:var(--ink-2); z-index:1}
  .wk-cell.has .wk-wx{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .viewtoggle{display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px; margin-bottom:14px; box-shadow:var(--shadow-sm)}
  .vt{border:none; background:none; padding:6px 14px; border-radius:9px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer}
  .vt.on{background:var(--ink); color:#fff}
  .look-single{display:flex; flex-direction:column; gap:22px}
  .look-single .card .ph{aspect-ratio:4/5}
  .look-single .card .name{font-size:17px}
  .look-list{display:flex; flex-direction:column}
  .look-row{display:flex; align-items:center; gap:13px; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer}
  .lr-thumb{width:54px; height:68px; object-fit:cover; border-radius:10px; background:var(--thumb); flex:none}
  .lr-info{flex:1; min-width:0}
  .lr-info .name{font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lr-info .sub{font-size:12px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  #onboarding:empty{display:none}
  .ob-wrap{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column; animation:fade .3s ease-out}
  .ob-skip{position:absolute; top:calc(12px + env(safe-area-inset-top)); right:18px; z-index:2; background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer}
  .ob-track{flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; min-height:0}
  .ob-track::-webkit-scrollbar{display:none}
  .ob-slide{flex:0 0 100%; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center; padding:calc(44px + env(safe-area-inset-top)) 24px 0}
  .ob-frame{width:100%; flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
  .ob-cap{padding:18px 20px 4px; text-align:center; max-width:360px}
  .ob-emoji{font-size:28px; margin-bottom:8px}
  .ob-title{font-size:22px; font-weight:800; margin-bottom:9px}
  .ob-desc{font-size:14px; color:var(--ink-2); line-height:1.65}
  .ob-dots{display:flex; justify-content:center; gap:7px; padding:12px 0}
  .ob-dot{width:7px; height:7px; border-radius:50%; background:var(--line); transition:.2s}
  .ob-dot.on{background:var(--pink); width:20px; border-radius:4px}
  .ob-start{margin:2px 24px calc(22px + env(safe-area-inset-bottom)); padding:16px; border:none; border-radius:16px; background:var(--ink); color:#fff; font-size:16px; font-weight:600; cursor:pointer}
  .ob-scr{width:100%; max-width:288px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px 16px; box-shadow:var(--shadow)}
  .ob-sp{color:var(--mint); font-size:22px; line-height:1}
  .ob-st{font-size:24px; font-weight:800; margin-top:2px}
  .ob-ss{font-size:12px; color:var(--muted); margin-top:2px}
  .ob-row{display:flex; gap:7px; margin:12px 0}
  .ob-pill{font-size:11px; padding:5px 11px; border-radius:13px; background:var(--bg); border:1px solid var(--line); color:var(--ink-2)}
  .ob-pill.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .ob-g2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .ob-alb{position:relative}
  .ob-bdg{position:absolute; top:6px; left:6px; width:20px; height:20px; border-radius:50%; background:var(--mint); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center}
  .ob-cov{width:100%; aspect-ratio:1/1; border-radius:10px; background-size:cover; background-position:center; background-color:#e5ddd4}
  .ob-cov.big{aspect-ratio:4/5; border-radius:12px}
  .ob-alb b{display:block; font-size:13px; margin-top:6px}
  .ob-alb i{font-size:11px; color:var(--muted); font-style:normal}
  .ob-photo{width:100%; aspect-ratio:4/3; border-radius:12px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .ob-line{display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:13px; color:var(--muted)}
  .ob-line b{color:var(--ink)}
  .ob-look{position:relative; margin-top:10px}
  .ob-hrt{position:absolute; top:calc(4/5*100%); margin-top:-42px; right:10px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.92); color:var(--pink); display:flex; align-items:center; justify-content:center; font-size:15px; box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .ob-lb b{display:block; font-size:15px; margin-top:8px}
  .ob-tags{display:flex; gap:6px; margin-top:5px}
  .ob-tags span{font-size:11px; color:var(--ink-2)}
  .ob-wk{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px}
  .ob-wc{position:relative; aspect-ratio:3/4; border-radius:9px; background:var(--bg) center/cover; border:1px solid var(--line); display:flex; align-items:center; justify-content:center}
  .ob-wc u{color:#cdc3ba; font-size:18px; text-decoration:none}
  .ob-wc em{position:absolute; top:4px; left:5px; font-size:10px; font-style:normal; font-weight:700; color:var(--muted)}
  .ob-wc[style] em{color:#fff}
  .ob-wc.today{border-color:var(--pink); border-width:2px}
  .ob-stg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .ob-sb{background:var(--bg); border-radius:12px; padding:12px 4px; text-align:center}
  .ob-sb b{font-size:20px}
  .ob-sb i{display:block; font-size:11px; color:var(--muted); font-style:normal; margin-top:2px}
  .ob-rcpt{background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; margin-top:12px; font-family:'Courier New',monospace}
  .ob-rct{text-align:center; font-weight:800; font-size:15px; margin-bottom:10px}
  .ob-rl{display:flex; justify-content:space-between; font-size:11px; padding:3px 0; border-bottom:1px dashed #ddd}

// all()은 "내 것"만 반환 (items/looks는 user_id로 필터). 남친 데이터는 loadPartner()로 따로.
async function all(store){const t=_TBL[store];if(!t)return [];
  const sel=(t==='looks')?'user_id,shared,data':(t==='items')?'user_id,data':'data';
  const {data,error}=await sb.from(t).select(sel);if(error)throw error;
  let rows=data;
  if(t==='items'||t==='looks')rows=rows.filter(r=>r.user_id===MYUID);
  return rows.map(r=>(t==='looks')?{...r.data,shared:!!r.shared}:r.data);}
async function getOne(store,id){const t=_TBL[store];if(!t)return null;const {data,error}=await sb.from(t).select('data').eq('id',id).limit(1);if(error)throw error;return data[0]?data[0].data:null;}
async function put(store,obj){const t=_TBL[store];if(!t)return obj;
  let row;
  if(t==='days')row={id:obj.id,user_id:MYUID,data:obj};
  else if(t==='wishlist')row={id:obj.id,user_id:MYUID,data:obj};
  else if(t==='looks')row={id:obj.id,user_id:MYUID,household_id:HH,shared:!!obj.shared,data:obj};
  else row={id:obj.id,user_id:MYUID,household_id:HH,data:obj};
  const {error}=await sb.from(t).upsert(row);if(error)throw error;return obj;}
async function del(store,id){const t=_TBL[store];if(!t)return;const {error}=await sb.from(t).delete().eq('id',id);if(error)throw error;}

async function loadPartner(){

  const [it,lo]=await Promise.all([sb.from('items').select('user_id,data'),sb.from('looks').select('user_id,shared,data')]);

/* ---------------- images ---------------- */
function loadViaURL(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img.onerror(디코드불가)'));};im.src=u;});}
async function shrink(file,max=1100,q=.82){
  let img;
  try{img=await Promise.race([createImageBitmap(file),new Promise((_,j)=>setTimeout(()=>j(new Error('CIB타임아웃')),8000))]);}
  catch(e){try{img=await loadViaURL(file);}catch(e2){throw new Error('디코드실패(CIB:'+(e&&e.message||e)+' / URL:'+(e2&&e2.message||e2)+')');}}
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(!iw||!ih)throw new Error('이미지크기0('+iw+'x'+ih+')');
  const s=Math.min(1,max/Math.max(iw,ih));
  const w=Math.round(iw*s),h=Math.round(ih*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');if(!ctx)throw new Error('canvas ctx 없음');
  try{ctx.drawImage(img,0,0,w,h);}catch(e){throw new Error('drawImage실패: '+(e&&e.message||e));}
  const blob=await new Promise((res)=>c.toBlob(b=>res(b),'image/jpeg',q));
  if(!blob)throw new Error('toBlob→null(용량초과 가능)');
  return blob;
}
// 사진은 Supabase Storage(photos 버킷)에 저장. 경로=household_id/photoId.jpg → 커플이 공유
function photoPath(id){return HH+'/'+id+'.jpg';}

async function getPhotoBlob(id){if(!id)return null;const r=await fetch(photoURL(id));if(!r.ok)return null;return await r.blob();}
function pickImage(){return new Promise(res=>{
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px';

  i.onchange=async()=>{const f=i.files[0];if(!f)return done(null);
    showToast('사진 불러오는 중…');
    let step='shrink';
    try{const blob=await shrink(f);step='save';const id=uid();await storePhoto(id,blob);done(id);}
    catch(e){alert('실패@'+step+' | 파일:'+(f.type||'형식없음')+' '+Math.round((f.size||0)/1024)+'KB | '+(e?((e.name||'Err')+': '+(e.message||JSON.stringify(e)||'(빈메시지)')):'에러객체=null'));done(null);}};
  document.body.appendChild(i);
  i.click();
});}
const _urls={};
function photoURL(id){if(!id)return'';if(_urls[id])return _urls[id];const u=sb.storage.from('photos').getPublicUrl(photoPath(id)).data.publicUrl;_urls[id]=u;return u;}

async function render(){

    <img class="lr-thumb" data-photo="${lookThumb(l)||''}" alt="">
    <div class="lr-info"><div class="name">${esc(l.name||'룩')} ${l.favorite?'<span style="color:var(--pink)">♥</span>':''}</div>
    <div class="sub">${stars(l.rating)} ${(l.tags||[]).slice(0,3).map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}</div></div>${lock(l)}</div>`;
  const vt=`<div class="viewtoggle">
    <button class="vt ${state.lookView==='single'?'on':''}" data-action="lookview" data-v="single">하나씩</button>
    <button class="vt ${state.lookView!=='single'&&state.lookView!=='list'?'on':''}" data-action="lookview" data-v="card">카드</button>

  else body=`<div class="grid">${list.map(card).join('')}</div>`;
  return head+tog+aiBtn+searchBox+chips+vt+body;

async function viewWeek(){
  const days=await all('days');const byId={};days.forEach(d=>byId[d.id]=d);
  const tstr=ymd(new Date());
  let worn=0,cells='';
  for(let k=0;k<7;k++){const dt=addDays(state.week,k);const id=ymd(dt);const d=byId[id];const thumb=dayThumb(d);const today=id===tstr;if(d)worn++;
    const wx=state.weekWeather&&state.weekWeather[id];
    cells+=`<div class="wk-cell ${thumb?'has':''} ${today?'today':''}" data-action="day" data-date="${id}">
      ${thumb?`<img data-photo="${thumb}" alt="">`:'<span class="wk-plus">＋</span>'}
      <span class="wk-day">${WD[k]}</span><span class="wk-num">${dt.getDate()}</span>
      ${wx?`<span class="wk-wx">${wmoEmoji(wx.code)} ${wx.max}°</span>`:''}</div>`;}
  const e=addDays(state.week,6);
  const head=pageHead('이번 주',worn?`${worn} 착장`:'','');
  const wxBtn=state.weekWeather?'':`<button class="textcta" data-action="weekweather">🌤️ 이번 주 날씨 보기 (위치)</button>`;
  return head+`<div class="navrow"><button data-action="weeknav" data-d="-7">‹</button>
    <span class="title" style="font-size:15px">${state.week.getMonth()+1}/${state.week.getDate()} – ${e.getMonth()+1}/${e.getDate()}</span>
    <button data-action="weeknav" data-d="7">›</button></div>${wxBtn}<div class="wk-grid">${cells}</div>`;
}
async function viewMonth(){
  const days=await all('days');const byId={};days.forEach(d=>byId[d.id]=d);
  const first=state.month;const y=first.getFullYear(),mo=first.getMonth();
  const lead=(first.getDay()+6)%7;const dim=new Date(y,mo+1,0).getDate();const tstr=ymd(new Date());
  let cells='';
  for(let i=0;i<lead;i++)cells+=`<div class="cell blank"></div>`;
  for(let d=1;d<=dim;d++){const id=ymd(new Date(y,mo,d));const rec=byId[id];
    const thumb=dayThumb(rec);
    cells+=`<div class="cell ${thumb?'has':''} ${id===tstr?'today':''}" data-action="day" data-date="${id}">
      ${thumb?`<img class="cimg" data-photo="${thumb}" alt="">`:''}<span class="cnum">${d}</span></div>`;}
  const head=WD.map(w=>`<div>${w}</div>`).join('');
  return `<div class="navrow"><button data-action="monthnav" data-d="-1">‹</button>
    <span class="title">${y}년 ${mo+1}월</span>
    <button data-action="monthnav" data-d="1">›</button></div>
    <div class="cal-head">${head}</div><div class="cal">${cells}</div>`;
}
function stars(n){n=n||0;let s='';for(let i=1;i<=5;i++)s+=i<=n?'★':'';return s?`<span style="color:var(--gold);letter-spacing:1px">${s}</span>`:'';}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function blobToB64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});}
async function exportAll(){
  const data={v:1,items:await all('items'),looks:await all('looks'),days:await all('days'),wishlist:await all('wishlist'),photos:[]};
  const pids=new Set();[...data.items,...data.looks,...data.days,...data.wishlist].forEach(o=>{if(o&&o.photoId)pids.add(o.photoId);});
  for(const pid of pids){const b=await getPhotoBlob(pid);if(b)data.photos.push({id:pid,b64:await blobToB64(b)});}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`룩북백업_${ymd(new Date())}.json`;a.click();
  localStorage.setItem('last_backup',ymd(new Date()));render();
}
async function importAll(file){
  const data=JSON.parse(await file.text());
  if(!confirm('백업 파일을 불러오면 같은 항목은 덮어써집니다. 계속할까요?'))return;
  for(const p of(data.photos||[])){const blob=await(await fetch(p.b64)).blob();await storePhoto(p.id,blob);}
  for(const i of(data.items||[]))await put('items',i);
  for(const l of(data.looks||[]))await put('looks',l);
  for(const d of(data.days||[]))await put('days',d);
  for(const w of(data.wishlist||[]))await put('wishlist',w);
  alert('불러오기 완료!');refresh();
}

/* ----- AI 코디 추천 (Gemini) ----- */
const GEMINI_MODELS=['gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash-001','gemini-2.5-flash-lite'];
const getKey=()=>localStorage.getItem('gemini_key')||'';
// 공유 AI 프록시(Cloudflare Worker): 키를 서버에 숨겨둠 → 개인 키 없어도 AI 사용 가능
const AI_PROXY='https://lookbook-ai-proxy.vercel.app/api/gemini';
const hasAI=()=>!!getKey()||!!AI_PROXY;
// 개인 키 있으면 Gemini 직접 호출, 없으면 프록시 경유
function geminiFetch(m,payload,signal){
  const key=getKey();
  if(key)return fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},signal,body:JSON.stringify(payload)});
  return fetch(AI_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},signal,body:JSON.stringify({model:m,payload})});
}
function matchIds(names){return(names||[]).map(n=>{const it=state.items.find(i=>i.name===n)||state.items.find(i=>i.name&&n&&i.name.includes(n));return it&&it.id;}).filter(Boolean);}
async function geminiRecommend(situation){
  const items=state.items.map(i=>{const sub=i.subcategory?'/'+i.subcategory:'';const mat=(i.materials&&i.materials.length)?' ['+i.materials.join(',')+']':'';const col=(i.colors&&i.colors.length)?' 색:'+i.colors.join('/'):'';return `${i.name} (${i.category}${sub}${mat}${col})`;}).join(', ');
  const prompt=`너는 센스 있는 패션 스타일리스트야. 아래는 사용자 옷장의 옷 목록이야:\n${items}\n\n${situation?`상황/요청: ${situation}\n`:''}이 옷장에 있는 아이템만 조합해서 어울리는 코디 3개를 제안해줘. 반드시 위 목록에 있는 이름만 그대로 사용해. JSON 배열로만 답해(그 외 텍스트 금지). 각 원소 형식: {"name":"코디 이름","items":["아이템 이름", ...],"tags":["상황이나 스타일 태그"],"reason":"왜 어울리는지 한 줄"}`;
  let lastErr='';
  for(const m of GEMINI_MODELS){
    for(let attempt=0;attempt<3;attempt++){
      const res=await geminiFetch(m,{contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.9,responseMimeType:'application/json'}});
      if(res.status===404){lastErr='404 '+m;break;}
      if([429,500,502,503].includes(res.status)){lastErr=res.status+' '+m;await new Promise(r=>setTimeout(r,900*(attempt+1)));continue;}
      if(!res.ok)throw new Error('API '+res.status+' — '+(await res.text()).slice(0,160));
      const data=await res.json();
      const txt=(((data.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'';
      try{return JSON.parse(txt);}catch(e){return JSON.parse(txt.replace(/```json|```/g,'').trim());}
    }
  }
  throw new Error('AI 서버가 잠시 바빠요 ('+lastErr+'). 잠시 후 다시 시도해 주세요');
}
async function geminiVision(photoId,prompt){
  const pb=await getPhotoBlob(photoId);if(!pb)throw new Error('사진 없음');
  const b64=(await blobToB64(pb)).split(',')[1];
  let lastErr='';
  for(const m of GEMINI_MODELS){
    for(let attempt=0;attempt<3;attempt++){
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);let res;
      try{res=await geminiFetch(m,{contents:[{parts:[{inlineData:{mimeType:pb.type||'image/jpeg',data:b64}},{text:prompt}]}],generationConfig:{temperature:.4,responseMimeType:'application/json'}},ctrl.signal);}
      catch(e){lastErr=(e.name==='AbortError'?'응답 지연':'네트워크')+' '+m;await new Promise(r=>setTimeout(r,600*(attempt+1)));continue;}
      finally{clearTimeout(to);}
      if(res.status===404){lastErr='404 '+m;break;}
      if([429,500,502,503].includes(res.status)){lastErr=res.status+' '+m;await new Promise(r=>setTimeout(r,900*(attempt+1)));continue;}
      if(!res.ok)throw new Error(res.status+' — '+(await res.text()).slice(0,140));
      const data=await res.json();const txt=(((data.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'';
      try{return JSON.parse(txt);}catch(e){return JSON.parse(txt.replace(/```json|```/g,'').trim());}
    }
  }
  throw new Error('AI 서버가 잠시 바빠요 ('+lastErr+'). 잠시 후 다시 시도해 주세요');
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawCover(ctx,img,x,y,w,h,r){ctx.save();roundRect(ctx,x,y,w,h,r);ctx.clip();const ir=img.width/img.height,tr=w/h;let sw,sh,sx,sy;if(ir>tr){sh=img.height;sw=sh*tr;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=sw/tr;sx=0;sy=(img.height-sh)/2;}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.restore();}
async function loadImg(photoId){const b=await getPhotoBlob(photoId);if(!b)return null;try{return await createImageBitmap(b);}catch(e){return null;}}
async function shareLook(look){

  ctx.textBaseline='top';ctx.fillStyle='#38404a';ctx.font='bold 62px -apple-system,sans-serif';ctx.fillText(look.name||'룩',m,m);
  if(look.rating){ctx.fillStyle='#e0a53f';ctx.font='42px sans-serif';ctx.fillText('★'.repeat(look.rating),m,m+82);}

  pics=pics.slice(0,4);
  const top=m+150,gridH=H-top-190;
  if(!pics.length){ctx.fillStyle='#d9e0e4';roundRect(ctx,m,top,W-2*m,gridH,28);ctx.fill();ctx.fillStyle='#9aa6ad';ctx.font='40px sans-serif';ctx.fillText('사진 없음',m+40,top+40);}
  else{const cols=pics.length===1?1:2,rows=Math.ceil(pics.length/cols),gap=18;const cw=(W-2*m-(cols-1)*gap)/cols,ch=(gridH-(rows-1)*gap)/rows;let i=0;for(let r=0;r<rows;r++)for(let cO=0;cO<cols&&i<pics.length;cO++,i++){const img=await loadImg(pics[i]);const x=m+cO*(cw+gap),y=top+r*(ch+gap);if(img)drawCover(ctx,img,x,y,cw,ch,24);else{ctx.fillStyle='#d9e0e4';roundRect(ctx,x,y,cw,ch,24);ctx.fill();}}}
  let tx=m;const ty=H-118;ctx.font='bold 34px sans-serif';
  for(const t of(look.tags||[]).slice(0,4)){const tw=ctx.measureText(t).width+44;ctx.fillStyle='rgba(255,255,255,.72)';roundRect(ctx,tx,ty,tw,56,28);ctx.fill();ctx.fillStyle='#456273';ctx.fillText(t,tx+22,ty+11);tx+=tw+12;}
  ctx.fillStyle='#9aa6ad';ctx.font='30px sans-serif';ctx.fillText('내 옷장 룩북',m,H-52);
  const blob=await new Promise(r=>c.toBlob(r,'image/png',.92));
  const file=new File([blob],`${(look.name||'look').replace(/[^\w가-힣]+/g,'_')}.png`,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:look.name||'룩'});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
}
async function shareReceipt(look){

  const W=760,H=1160;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  ctx.fillStyle='#e9e9ec';ctx.fillRect(0,0,W,H);
  const rx=52,rw=W-104,ry=44,rh=H-96;
  ctx.fillStyle='#fff';ctx.fillRect(rx,ry,rw,rh);
  const cx=W/2;ctx.textBaseline='top';
  ctx.textAlign='center';ctx.fillStyle='#141414';ctx.font='bold 48px Arial';ctx.fillText('OUTFIT RECEIPT',cx,ry+52);
  ctx.font='17px "Courier New",monospace';ctx.fillStyle='#666';ctx.fillText(`${(look.name||'MY LOOK')}  ·  ${ymd(new Date())}`,cx,ry+118);
  const dash=y=>{ctx.strokeStyle='#c9c9c9';ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(rx+40,y);ctx.lineTo(rx+rw-40,y);ctx.stroke();ctx.setLineDash([]);};
  let ty=ry+158;dash(ty);ty+=28;
  if(items.length){const cols=Math.min(items.length,4),gap=14,th=150,tw=(rw-80-(cols-1)*gap)/cols;let x=rx+40;
    for(let i=0;i<cols;i++){const it=items[i];const img=await loadImg(it.photoId);if(img)drawCover(ctx,img,x,ty,tw,th,8);else{ctx.fillStyle='#eee';roundRect(ctx,x,ty,tw,th,8);ctx.fill();}x+=tw+gap;}
    ty+=th+26;dash(ty);ty+=26;}
  ctx.font='21px "Courier New",monospace';ctx.fillStyle='#141414';
  const lx=rx+44,rr=rx+rw-44;
  for(const it of items){ctx.textAlign='left';ctx.fillText((it.subcategory||it.category||'ITEM'),lx,ty);ctx.textAlign='right';ctx.fillText((it.name||'-').slice(0,16),rr,ty);ty+=42;}
  if(!items.length){ctx.textAlign='center';ctx.fillStyle='#999';ctx.fillText('아이템이 연결되지 않은 룩',cx,ty);ty+=42;}
  ty+=6;dash(ty);ty+=24;
  ctx.font='bold 21px "Courier New",monospace';ctx.fillStyle='#141414';ctx.textAlign='left';ctx.fillText('TOTAL',lx,ty);ctx.textAlign='right';ctx.fillText(`${items.length} ITEMS`,rr,ty);ty+=48;
  if(look.rating){ctx.textAlign='center';ctx.font='24px Arial';ctx.fillStyle='#e6a94a';ctx.fillText('★'.repeat(look.rating),cx,ty);ty+=42;}
  let bx=cx-170,by=ty+14;ctx.fillStyle='#141414';
  for(let i=0;i<74;i++){const bw=1+((i*7)%5);if(i%2===0)ctx.fillRect(bx,by,bw,58);bx+=bw+2;}
  ctx.textAlign='center';ctx.font='14px "Courier New",monospace';ctx.fillStyle='#333';ctx.fillText('MY CLOSET LOOKBOOK',cx,by+70);
  ctx.textAlign='left';
  const blob=await new Promise(r=>c.toBlob(r,'image/png',.92));
  const file=new File([blob],`receipt_${(look.name||'look').replace(/[^\w가-힣]+/g,'_')}.png`,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'OUTFIT RECEIPT'});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
}

}

/* ---------------- events ---------------- */
document.getElementById('onboarding').addEventListener('click',e=>{if(e.target.closest('[data-ob]')){document.getElementById('onboarding').innerHTML='';localStorage.setItem('onboarded','1');}});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=b.dataset.tab;state.album=null;state.search='';state.selectMode=false;state.selected.clear();render();}});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.dataset.close)closeSheet();});
document.body.addEventListener('input',e=>{
  if(e.target.id==='closet-search'){state.search=e.target.value;render().then(()=>{const s=document.getElementById('closet-search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}});}
  else if(e.target.id==='looks-search'){state.lookSearch=e.target.value;render().then(()=>{const s=document.getElementById('looks-search');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}});}
});
document.body.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='add'){state.tab==='closet'?itemForm():state.tab==='wish'?wishForm():lookForm();}
  else if(a==='settings')settings();
  else if(a==='stats')statsSheet();
  else if(a==='airec')aiRecommend();
  else if(a==='lookrate')lookRate();
  else if(a==='cat'){state.catFilter=el.dataset.cat||null;render();}
  else if(a==='sortwear'){state.sortWear=!state.sortWear;render();}
  else if(a==='owner'){state.ownerFilter=el.dataset.owner||null;render();}
  else if(a==='album'){state.album=el.dataset.key;render();}
  else if(a==='albumback'){state.album=null;state.selectMode=false;state.selected.clear();render();}
  else if(a==='albumby'){state.albumBy=el.dataset.by;state.album=null;render();}
  else if(a==='selectmode'){state.selectMode=true;state.selected.clear();render();}
  else if(a==='cancelselect'){state.selectMode=false;state.selected.clear();render();}
  else if(a==='toggleselect'){const id=el.dataset.id;if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);render();}
  else if(a==='deleteselected')deleteSelected();
  else if(a==='bulkadd')bulkAdd();
  else if(a==='dobackup')exportAll();
  else if(a==='dismissbackup'){state.backupDismissed=true;render();}
  else if(a==='lookview'){state.lookView=el.dataset.v;render();}
  else if(a==='lookfilter'){const k=el.dataset.kind;state.favOnly=(k==='fav');state.tagFilter=(k==='tag')?el.dataset.tag:null;render();}
  else if(a==='owner-closet'){state.closetOwner=el.dataset.o;state.album=null;state.search='';state.selectMode=false;state.selected.clear();refresh();}
  else if(a==='owner-look'){state.lookOwner=el.dataset.o;refresh();}
  else if(a==='looklock'){const l=lookById(el.dataset.id);if(l){l.shared=!l.shared;put('looks',l).then(()=>{state.myLooks.forEach(x=>{if(x.id===l.id)x.shared=l.shared;});showToast(l.shared?`💛 ${PARTNERNAME||'상대'}에게 공유했어요`:'🔒 나만 보기로 바꿨어요');render();}).catch(er=>showToast('실패: '+(er.message||er)));}}
  else if(a==='item'){if(state.closetOwner==='partner'){showToast(`${PARTNERNAME} 옷장은 보기 전용이에요`);return;}const it=itemById(el.dataset.id);if(it)itemForm(it);}
  else if(a==='look'){if(state.lookOwner==='partner'){showToast('공유받은 룩은 보기 전용이에요');return;}const l=lookById(el.dataset.id);if(l)lookForm(l);}
  else if(a==='wishitem'){const w=state.wish.find(x=>x.id===el.dataset.id);if(w)wishForm(w);}
  else if(a==='wishstatus'){state.wishStatus=el.dataset.s||null;render();}
  else if(a==='day')dayDetail(el.dataset.date);
  else if(a==='weeknav'){state.week=addDays(state.week,+el.dataset.d);render();}
  else if(a==='weekweather')loadWeekWeather();
  else if(a==='monthnav'){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+ +el.dataset.d,1);render();}
});

/* ---------------- auth / boot ---------------- */
function showAuth(){
  let mode='login';
  const r=document.getElementById('authRoot');
  const draw=()=>{r.innerHTML=`<div class="auth-bg"><div class="auth-card">
    <div class="auth-logo">👗</div>
    <h1>내 옷장 룩북</h1>
    <p class="auth-sub">${mode==='login'?'로그인해서 옷장을 열어요':'계정을 만들어 시작해요'}</p>
    ${mode==='signup'?'<input id="au-name" type="text" maxlength="10" placeholder="닉네임 (예: 유링)">':''}
    <input id="au-email" type="email" inputmode="email" autocomplete="email" placeholder="이메일">
    <input id="au-pw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)">
    <button class="btn primary auth-go" id="au-go">${mode==='login'?'로그인':'회원가입'}</button>
    <div id="au-msg" class="auth-msg"></div>
    <button class="auth-toggle" id="au-toggle">${mode==='login'?'계정이 없어요 · 회원가입':'이미 계정이 있어요 · 로그인'}</button>
  </div></div>`;
    const msg=document.getElementById('au-msg');
    document.getElementById('au-toggle').onclick=()=>{mode=mode==='login'?'signup':'login';draw();};
    document.getElementById('au-go').onclick=async()=>{
      const email=document.getElementById('au-email').value.trim();
      const pw=document.getElementById('au-pw').value;
      const nick=mode==='signup'?(document.getElementById('au-name').value.trim()):'';
      if(!email||!pw){msg.textContent='이메일과 비밀번호를 입력해주세요.';return;}
      if(mode==='signup'&&!nick){msg.textContent='닉네임을 입력해주세요.';return;}
      msg.style.color='var(--muted)';msg.textContent='잠시만요…';
      try{
        const {error}=mode==='login'
          ? await sb.auth.signInWithPassword({email,password:pw})
          : await sb.auth.signUp({email,password:pw});
        if(error)throw error;
        await afterLogin(nick);
      }catch(e){msg.style.color='var(--pink)';msg.textContent=(mode==='login'?'로그인 실패: ':'가입 실패: ')+(e.message||e);}
    };
    document.getElementById('au-pw').onkeydown=e=>{if(e.key==='Enter')document.getElementById('au-go').click();};
  };
  draw();
}
async function afterLogin(nickname){
  const {data:{user}}=await sb.auth.getUser(); MYUID=user.id;
  const {data:hh,error}=await sb.rpc('init_profile');
  if(error){alert('프로필 생성 오류: '+error.message);return;}
  HH=hh;
  if(nickname)await sb.from('profiles').update({display_name:nickname}).eq('user_id',MYUID);
  // 같은 커플(household) 멤버들 → 내 이름·남친 이름
  const {data:mates}=await sb.from('profiles').select('user_id,display_name').eq('household_id',HH);
  const me=(mates||[]).find(m=>m.user_id===MYUID);
  const other=(mates||[]).find(m=>m.user_id!==MYUID);
  MYNAME=(me&&me.display_name)||'나';
  PARTNER=other?other.user_id:null;
  PARTNERNAME=(other&&other.display_name)||'';
  document.getElementById('authRoot').innerHTML='';
  await refresh();
  if(!localStorage.getItem('onboarded'))setTimeout(showOnboarding,250);
}
async function logout(){await sb.auth.signOut();location.reload();}
async function boot(){
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(session)await afterLogin(); else showAuth();
}
boot();
</script>
