name: chehumdan-collect
# 체험단 모음: 하루 네 번 공고를 수집해 chehumdan/data/campaigns.json 을 갱신한다.
on:
  schedule:
    # KST 07:10, 11:10, 16:10, 21:10
    - cron: "10 22,2,7,12 * * *"
  workflow_dispatch:
  push:
    branches: [claude/clever-dijkstra-0mvpvv]
    paths: [chehumdan/collect/**, .github/workflows/chehumdan-collect.yml]
permissions:
  contents: write
concurrency:
  group: chehumdan-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        working-directory: chehumdan/collect
        run: python run.py reviewnote popomon dinnerqueen cometoplay chvu remin fourblog cloudreview ddok
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add chehumdan/data/sites
          git diff --cached --quiet && exit 0
          git commit -m "체험단 모음: 공고 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
