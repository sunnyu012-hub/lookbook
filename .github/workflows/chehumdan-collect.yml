name: chehumdan-collect
# 체험단 다모아: 하루 두 번 공고를 수집해 chehumdan-data 브랜치(sites/<사이트>.json)를 갱신한다.
# 데이터는 main 에 커밋하지 않는다 — 기록이 쌓여 저장소가 커지므로 데이터 브랜치를 매번 덮어쓴다(collect/data_sync.py).
on:
  schedule:
    # KST 07:10, 19:10 (사이트 부담·하루 2번이면 충분, 10-16 사용자 결정)
    - cron: "10 22,10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [chehumdan/collect/**, .github/workflows/chehumdan-collect.yml]
permissions:
  contents: write
concurrency:
  group: chehumdan-collect
  cancel-in-progress: false
env:
  SITES: reviewnote popomon dinnerqueen cometoplay chvu ddok
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 사이트별 상한 25분, 리뷰노트 45분(run.py)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 지난 데이터 받기
        run: python chehumdan/collect/data_sync.py pull
      - name: 수집
        working-directory: chehumdan/collect
        run: python run.py $SITES
      - name: 저장
        if: ${{ always() }}
        run: python chehumdan/collect/data_sync.py push $SITES
