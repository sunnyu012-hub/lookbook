name: chehumdan-probe
# 개발용 임시 워크플로 — 사이트 구조 확인이 끝나면 삭제한다.
on:
  push:
    branches: [claude/clever-dijkstra-0mvpvv]
    paths: [chehumdan/scripts/probe2-urls.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf chehumdan/_probe2 && python3 chehumdan/scripts/probe2.py chehumdan/scripts/probe2-urls.txt; cat chehumdan/_probe2/_summary.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f chehumdan/_probe2
          git commit -m "probe: 사이트 원본 수집" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
