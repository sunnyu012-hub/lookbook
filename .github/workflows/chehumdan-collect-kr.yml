name: chehumdan-collect-kr
# 체험단 다모아: 한국 사무실 PC(Windows self-hosted runner)에서만 되는 사이트
#   레뷰(부계정 로그인), 강남맛집·리뷰의민족·포블로그·클라우드리뷰(해외 IP 차단),
#   어디야·링블·서울오빠·리뷰플레이스·클립뷰·구구다스(robots 금지를 알고도 수집, 사용자 결정 10-16). 계정 보호를 위해 하루 두 번만 돈다.
#   결과는 chehumdan-data 브랜치에 올린다(kr_job.py → data_sync.py).
# 러너 라벨: chehumdan-kr / PC 준비: chehumdan/KR_PC.md
on:
  schedule:
    # KST 08:40, 18:40
    - cron: "40 23,9 * * *"
  # 개발 중 시험: 이 파일을 바꿔 올리면 PC에서 그 내용대로 한 번 돈다 (1줄: collect|probe, 2줄: 사이트)
  push:
    branches: [main]
    paths: [chehumdan/scripts/kr-task.txt]
  workflow_dispatch:
    inputs:
      task:
        description: "collect = 수집, probe = 사이트 구조 확인"
        default: collect
        type: choice
        options: [collect, probe]
      sites:
        description: "수집할 사이트 (공백으로 구분)"
        default: "revu gangnam remin fourblog cloudreview odiya ringble seoulouba reviewplace clipview gugudas"
permissions:
  contents: write
concurrency:
  group: chehumdan-collect-kr
  cancel-in-progress: false
jobs:
  collect:
    runs-on: [self-hosted, chehumdan-kr]
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      # 단계 로직은 파이썬(kr_job.py)에 있다. PC의 PowerShell 실행 정책과 상관없이 돌게 하려고 cmd 에서 python 만 부른다.
      - name: 수집
        env:
          IN_TASK: ${{ inputs.task }}
          IN_SITES: ${{ inputs.sites }}
          EVENT: ${{ github.event_name }}
          REVU_ID: ${{ secrets.REVU_ID }}
          REVU_PW: ${{ secrets.REVU_PW }}
          CHEHUMDAN_DEBUG: ${{ github.workspace }}/chehumdan/_debug
        run: python chehumdan\collect\kr_job.py
