[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imgcrop"
version = "1.0.0"
description = "이미지를 요소별로 잘라 분리하고 여백을 없애 크기를 딱 맞추는 데스크톱 도구"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0", "numpy>=1.22"]

[project.scripts]
imgcrop = "imgcrop.cli:main"

[project.gui-scripts]
imgcrop-gui = "imgcrop.gui:main"

[tool.setuptools.packages.find]
include = ["imgcrop*"]
