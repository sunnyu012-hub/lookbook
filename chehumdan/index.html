<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체험단 다모아 by. 유니니</title>
<meta name="description" content="여러 체험단 사이트의 공고를 지역·목적별로 한곳에 모아 봅니다.">
<meta property="og:title" content="체험단 다모아 by. 유니니">
<meta property="og:description" content="여러 체험단 사이트의 공고를 지역·목적별로 한곳에 모아 봅니다.">
<meta name="theme-color" content="#eef1ec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%230d7556'/%3E%3Cpath d='M11 7v18' stroke='%23eef1ec' stroke-width='2' stroke-dasharray='2 2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1016b">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./" aria-label="체험단 다모아 by. 유니니 처음으로"><span>체험단<b>다모아</b></span><small>by. 유니니</small></a>
    <label class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
      <input id="q" type="search" placeholder="가게·메뉴 검색" autocomplete="off" aria-label="공고 검색">
    </label>
    <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M6 10h8M8.5 15h3"/></svg>
      <span>필터</span><em id="filterCount"></em>
    </button>
  </div>
</header>
<!-- 모바일 전용: 엄지로 넘기는 빠른 분류 (고정 헤더 밖이라 스크롤하면 같이 올라간다) -->
<nav class="quick" aria-label="빠른 분류">
  <div class="strip" id="qSido"></div>
  <div class="strip" id="qSgg" hidden></div>
  <div class="strip" id="qPurpose"></div>
</nav>

<div class="shell">
  <aside class="side" id="side" aria-labelledby="sideTitle">
    <div class="sheet-head">
      <strong id="sideTitle">필터</strong>
      <button class="link" id="reset" type="button">모두 지우기</button>
    </div>
    <div class="sheet-body">
      <section class="grp">
        <h2>지역</h2>
        <div class="chips" id="sidoChips"></div>
        <div class="chips sub" id="sggChips" hidden></div>
      </section>
      <section class="grp">
        <h2>목적</h2>
        <div class="chips" id="purposeChips"></div>
      </section>
      <section class="grp">
        <h2>유형</h2>
        <div class="chips" id="typeChips"></div>
      </section>
      <section class="grp">
        <h2>채널</h2>
        <div class="chips" id="channelChips"></div>
      </section>
      <section class="grp" id="siteGroup">
        <h2>사이트</h2>
        <div class="chips" id="siteChips"></div>
      </section>
    </div>
    <div class="sheet-foot">
      <button class="done" id="sheetDone" type="button">공고 보기</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="bar">
      <div class="tabs" role="group" aria-label="보기" id="tabs">
        <button type="button" data-tab="all">전체</button>
        <button type="button" data-tab="new">오늘 새로</button>
        <button type="button" data-tab="soon">마감 임박</button>
      </div>
      <label class="sort">
        <span class="sr">정렬</span>
        <select id="sort">
          <option value="pick" title="마감 빠른 순, 오늘 마감은 뒤로">추천 순</option>
          <option value="end">마감 빠른 순</option>
          <option value="new">새로 올라온 순</option>
          <option value="ratio">경쟁 낮은 순</option>
        </select>
      </label>
      <p class="summary" id="summary" aria-live="polite">불러오는 중…</p>
      <div class="active" id="active" aria-label="걸린 조건" hidden></div>
    </div>
    <p class="notice" id="notice" hidden></p>
    <ul class="list" id="list" aria-busy="true">
      <li class="skel" aria-hidden="true"></li><li class="skel" aria-hidden="true"></li><li class="skel" aria-hidden="true"></li>
      <li class="skel" aria-hidden="true"></li><li class="skel" aria-hidden="true"></li><li class="skel" aria-hidden="true"></li>
    </ul>
    <div class="load-error" id="loadError" hidden>
      <p>공고를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 불러와 주세요.</p>
      <button class="more" id="reload" type="button">다시 불러오기</button>
    </div>
    <button class="more" id="more" type="button" hidden>더 보기</button>
    <div class="empty" id="empty" hidden>
      <p>조건에 맞는 공고가 없어요.</p>
      <div class="relax" id="relax"></div>
      <button class="link" id="emptyReset" type="button">조건 모두 지우기</button>
    </div>
    <footer class="foot">
      <p id="updated"></p>
      <p>경쟁률은 신청 ÷ 모집이에요. '여유'는 아직 신청이 모집 인원보다 적다는 뜻이고, 기자단은 가게에 가지 않고 원고만 쓰는 공고예요.</p>
      <p>신청은 각 사이트에서 해요. 공고를 누르면 원래 페이지로 이동합니다. 로그인 없이 공개된 목록 정보만 모으고, 사진과 상세 내용은 옮기지 않아요.</p>
    </footer>
  </main>
</div>
<script src="app.js?v=1016c"></script>
</body>
</html>
